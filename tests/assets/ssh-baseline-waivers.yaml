---
# Waivers for controls the DevSec ssh-baseline profile can't verify
# meaningfully against a Kairos+hadron build. Each waived control
# documents why. Everything not listed here must pass.

sshd-18:
  expiration_date: "2099-01-01"
  run: false
  justification: >-
    LoginGraceTime is set to 30 in the hardening drop-in, but sshd -T
    normalises the value to bare seconds ("30") whereas the profile
    literally compares against "30s". Semantically compliant, format
    mismatch beyond our control from within the config file.

sshd-29:
  expiration_date: "2099-01-01"
  run: false
  justification: >-
    OpenSSH >= 8.7 renamed ChallengeResponseAuthentication to
    KbdInteractiveAuthentication. The drop-in sets the modern name to
    "no"; sshd -T emits only the modern name, so the profile's lookup
    of the old name returns nil.

sshd-30:
  expiration_date: "2099-01-01"
  run: false
  justification: >-
    Hadron's OpenSSH is built without --with-kerberos5. KerberosAuthentication
    is not a valid directive in that build, so sshd -T does not emit it and
    the profile sees nil. Kerberos is unreachable; the intent of the control
    is satisfied.

sshd-31:
  expiration_date: "2099-01-01"
  run: false
  justification: See sshd-30. Same krb5-not-compiled-in rationale.

sshd-32:
  expiration_date: "2099-01-01"
  run: false
  justification: See sshd-30. Same krb5-not-compiled-in rationale.

sshd-33:
  expiration_date: "2099-01-01"
  run: false
  justification: >-
    Hadron's OpenSSH is built without GSSAPI. The directive is not accepted
    by that build and would emit "Unsupported option"; sshd -T does not
    emit it either. GSSAPI is unreachable.

sshd-34:
  expiration_date: "2099-01-01"
  run: false
  justification: See sshd-33. Same GSSAPI-not-compiled-in rationale.

sshd-45:
  expiration_date: "2099-01-01"
  run: false
  justification: >-
    Hadron's OpenSSH is built with --disable-lastlog. PrintLastLog is not
    a valid directive in that build and sshd -T does not emit it.

sshd-46:
  expiration_date: "2099-01-01"
  run: false
  justification: >-
    DevSec ssh-baseline wants Banner=none. CIS Distribution Independent
    Linux L1 5.2.19 requires Banner=/etc/issue.net. Kairos-init follows
    CIS on this one and ships the pre-auth banner file plus the sshd
    Banner directive. The two standards disagree; the deliberate choice
    is CIS.

sshd-01:
  expiration_date: "2099-01-01"
  run: false
  justification: >-
    Kairos-init ships the OpenSSH 10.x post-quantum-first cipher list
    (aes256-gcm@openssh.com,chacha20-poly1305@openssh.com,aes256-ctr,
    aes128-gcm@openssh.com,aes128-ctr). The DevSec profile's expected
    value is the pre-10.x list, so its literal string comparison fails
    even though the shipped list is a strict subset of secure AEAD and
    CTR ciphers.

sshd-02:
  expiration_date: "2099-01-01"
  run: false
  justification: >-
    Kairos-init ships the OpenSSH 10.x post-quantum-hybrid Kex list
    (leads with mlkem768x25519-sha256 and both sntrup761 names) so
    OpenSSH 10.1+ clients do not print "connection is not using a
    post-quantum key exchange algorithm" on every login. The DevSec
    profile's expected value predates the PQ hybrids.

sshd-03:
  expiration_date: "2099-01-01"
  run: false
  justification: >-
    Kairos-init ships the ETM-first MAC list matching Hadron's STIG.
    Order differs from the DevSec profile's expected string, so its
    literal comparison fails even though every listed MAC is a strong
    HMAC-SHA2 or umac-128 variant.

sshd-14:
  expiration_date: "2099-01-01"
  run: false
  justification: >-
    OpenSSH 10.x adds ssh_host_mldsa44_ed25519_key (post-quantum
    signature host key) to the default host-key set. The DevSec
    profile's expected value lists only the pre-10.x host keys, so
    the extra PQ host key trips the literal comparison. The PQ host
    key is a security addition, not a regression.

sshd-19:
  expiration_date: "2099-01-01"
  run: false
  justification: >-
    Kairos-init sets MaxAuthTries=4 to match the Hadron STIG value.
    CIS Distribution Independent Linux L1 5.2.7 requires
    MaxAuthTries<=4, so 4 satisfies CIS. DevSec's expected value of 2
    is stricter than any published benchmark; the deliberate choice
    is the STIG/CIS-aligned value so downstream Hadron acceptance
    tests keep passing.

sshd-36:
  expiration_date: "2099-01-01"
  run: false
  justification: >-
    Kairos-init sets ClientAliveInterval=600 to match the Hadron STIG
    value. CIS Distribution Independent Linux L1 5.2.16 requires
    <=900s, so 600 satisfies CIS. DevSec's expected value of 300 is
    stricter than any published benchmark; the deliberate choice is
    the STIG/CIS-aligned value.

sshd-37:
  expiration_date: "2099-01-01"
  run: false
  justification: >-
    Kairos-init sets ClientAliveCountMax=1 to match the Hadron STIG
    value. That is stricter than DevSec's expected 3 (a single missed
    keepalive drops the connection). DevSec's literal comparison fails
    even though the shipped value is more restrictive.
