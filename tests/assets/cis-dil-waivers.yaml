---
# Waivers for CIS Distribution Independent Linux v2.0.0 Level 1 controls
# (dev-sec/cis-dil-benchmark) that cannot apply to a Kairos Hadron system,
# are covered by another test, or were declined as a default behaviour
# change. Each entry says why. Everything not listed here must pass; a real
# hardening gap is fixed in kairos-init or immucore, not waived.

cis-dil-benchmark-1.1.1.6:
  expiration_date: "2099-01-01"
  run: false
  justification: >-
    Kairos boots its live and recovery systems from squashfs images, so the
    squashfs module cannot be blocked.

cis-dil-benchmark-1.1.23:
  expiration_date: "2099-01-01"
  run: false
  justification: >-
    Operator decision: Kairos targets edge devices that are installed from and
    use USB drives, so usb-storage stays loadable by default.

cis-dil-benchmark-1.3.1:
  expiration_date: "2099-01-01"
  run: false
  justification: >-
    AIDE is not shipped. The Kairos rootfs is an immutable image, replaced as
    a whole on upgrade; its integrity comes from the image (and from measured
    boot under Trusted Boot), not from a file database on the running system.

cis-dil-benchmark-1.3.2:
  expiration_date: "2099-01-01"
  run: false
  justification: >-
    AIDE is not shipped. The Kairos rootfs is an immutable image, replaced as
    a whole on upgrade; its integrity comes from the image (and from measured
    boot under Trusted Boot), not from a file database on the running system.

cis-dil-benchmark-1.4.1:
  expiration_date: "2099-01-01"
  run: false
  justification: >-
    The profile checks /boot/grub/grub.conf and /boot/grub/grub.cfg. Kairos
    keeps its GRUB config on the COS_STATE/EFI partitions, generated at
    install, not in the rootfs.

cis-dil-benchmark-1.4.2:
  expiration_date: "2099-01-01"
  run: false
  justification: >-
    Operator decision: a GRUB password needs a secret at build or install time
    and blocks editing boot entries for recovery, so it is not set by default.

cis-dil-benchmark-2.2.1.1:
  expiration_date: "2099-01-01"
  run: false
  justification: >-
    Time sync is systemd-timesyncd, enabled by kairos-init (steps_init.go).
    This profile only recognises ntp and chrony.

cis-dil-benchmark-3.2.7:
  expiration_date: "2099-01-01"
  run: false
  justification: >-
    Operator decision: rp_filter is set to 2 (loose) on purpose (commit
    468b9daf); strict mode breaks multi-homed nodes and some Kubernetes CNIs.

