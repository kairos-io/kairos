apiVersion: v1
kind: Secret
metadata:
  name: rotate-token
  namespace: system-upgrade
type: Opaque
stringData:
  network_token: ""
  rotate.sh: |
      #!/bin/sh
      # Runs in a system-upgrade-controller pod, which is privileged and
      # shares the host PID namespace. The rotation itself runs on the host
      # with the node's own kairos binary, entered through PID 1.
      set -e
      TOKEN="$(cat /rotate-token/network_token)"
      export TOKEN
      CONFIG_DIRS="/oem /usr/local/cloud-config /etc/kairos"

      if [ -z "$TOKEN" ]; then
          echo "network_token is empty in the rotate-token secret"
          exit 1
      fi

      if [ "$FORCE" != "true" ]; then
          if nsenter -t 1 -m -- sh -c 'grep -rqsF "$TOKEN" '"$CONFIG_DIRS"; then
              echo "Network token up to date"
              exit 0
          fi
      fi

      set --
      for d in $CONFIG_DIRS; do
          set -- "$@" --config-dir "$d"
      done
      # TOKEN is read from the environment, so it does not show up in ps.
      nsenter -t 1 -m -u -i -n -p -- kairos provider rotate-token --restart "$@"
---
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: network-token-rotation
  namespace: system-upgrade
spec:
  concurrency: 1
  nodeSelector:
    matchExpressions:
      - {key: kubernetes.io/hostname, operator: Exists}
  serviceAccountName: system-upgrade
  secrets:
    - name: rotate-token
      path: /rotate-token
  version: "1.37"
  drain:
    force: false
  upgrade:
    image: busybox
    command: ["sh"]
    args: ["/rotate-token/rotate.sh"]
