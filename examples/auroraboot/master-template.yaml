#cloud-config

hostname: metal-{{ trunc 4 .MachineID }}
users:
- name: kairos
  # Set with: --set "kairos.password=<your password>"
  passwd: "[[[.kairos.password]]]"
  groups:
  - admin
  ssh_authorized_keys:
  # Set with: --set "github.user=<your github user>"
  - "github:[[[.github.user]]]"

k3s:
  enabled: true
  args:
  - --disable=traefik,servicelb
