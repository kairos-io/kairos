name: Build Kairos Image

on:
  workflow_call:
    secrets:
      registry_username:
        required: false
      registry_password:
        required: false
    inputs:
      # Dockerfile path
      ref:
        description: |
          Git ref or SHA to check out. Defaults to the ref that triggered the
          calling workflow, which is the right answer for every ordinary caller.

          Set this only when the caller must build something other than its own
          trigger ref -- the motivating case is a `pull_request_target` workflow
          that needs to build a fork pull request's head commit, since that
          event's context is the base branch.

          Only `ref` is exposed, deliberately: a pull request's head commit is
          reachable from the base repository via `refs/pull/<n>/head`, so no
          second repository ever needs naming, and omitting `repository` means
          this cannot be pointed at code outside the calling repo.

          Security note for callers: passing an untrusted ref here in a workflow
          that also has access to secrets means running that code with those
          secrets. This input is neutral; the caller carries the risk.
        type: string
        required: false
        default: ''
      caller-vetted-ref:
        description: |
          Caller assertion required to unlock actions/checkout's
          `allow-unsafe-pr-checkout` opt-in. Set to `true` ONLY if the caller
          has its own authorization gate in front of this workflow -- e.g.
          a `pull_request_target` pipeline whose `authorize` job pins the run
          to a GitHub Environment that requires maintainer review before the
          fork's `ref` is fetched. Without such a gate, leaving this false
          keeps the `pull_request_target` + fork-ref combination blocked at
          checkout time (the guard described at
          https://gh.io/securely-using-pull_request_target).

          Legacy behavior: for backward compatibility this reusable also opts
          into `allow-unsafe-pr-checkout` when `ref` is non-empty and this
          input is unset, matching how earlier versions of this workflow
          worked. New callers should set this input explicitly; the legacy
          `ref != ''` fallback is scheduled for removal in the next major
          version.
        type: boolean
        required: false
        default: false
      dockerfile_path:
        type: string

      build_args:
        type: string
        required: false
        default: ''
        description: |
          Extra --build-arg values to pass to the user's Dockerfile, one
          per line, in KEY=VALUE form.

          Appended AFTER the built-in build-args (BASE_IMAGE, MODEL,
          KUBERNETES_*, TRUSTED_BOOT, VERSION). Docker's --build-arg is
          last-wins for a given KEY, so a caller can override any
          built-in by including it here (e.g. `VERSION=custom`) as well
          as any Dockerfile ARG default the built-ins do not cover.

          Motivating case: the Kairos monorepo release workflow passes
          `KAIROS_INIT=<the-release-tag>` (via the github.ref_name
          expression on the caller side) so the ISO build uses the
          kairos-init image freshly published earlier in the same run,
          instead of the ARG default pinned in images/Dockerfile.

          DO NOT pass secrets through this input. Docker build args are
          printed in build logs (visible to anyone with read access to
          workflow logs) and can be recovered from image layer history.
          Use docker secrets (BuildKit `--secret`) or dedicated CI
          secret-injection mechanisms for anything sensitive.

      oci_context_artifact:
        type: string
        required: false
        default: ''
        description: |
          Name of a workflow artifact that holds an OCI layout tarball
          (as written by `docker buildx build --output type=oci`). When
          set, the tarball is downloaded and passed to the image build
          as the named build context `oci_context_name`, so a `FROM` of
          that name resolves to it instead of to a registry.

          This is how the PR pipeline feeds its freshly built kairos-init
          image into the OS image build without pushing it anywhere: a
          plain pull_request run has no registry credentials.

      oci_context_name:
        type: string
        required: false
        default: ''
        description: |
          Build context name the `oci_context_artifact` layout is bound
          to. Must match the image reference the Dockerfile uses in its
          `FROM`, e.g. the value the caller passes as KAIROS_INIT_IMAGE.

      # Kairos version for fallback Dockerfile
      kairos_version:
        type: string
        default: "v4.0.0"
        description: "Kairos version to use when downloading the fallback Dockerfile"

      # Core build parameters
      base_image:
        type: string
        default: "ghcr.io/kairos-io/hadron:v0.0.4"

      model:
        type: string
        default: "generic"

      arch:
        type: string
        default: "amd64"

      kubernetes_distro:
        type: string
        required: false
        description: "Kubernetes distribution to include. Must be either 'k0s' or 'k3s'. If not specified, no Kubernetes distribution will be included."

      kubernetes_version:
        type: string
        default: "auto"

      version:
        type: string
        required: true

      trusted_boot:
        type: boolean
        default: false

      no_cache:
        type: boolean
        default: false

      allow_insecure_registries:
        type: boolean
        default: false
        description: "Allow auroraboot to pull container images from registries over plain HTTP or
          with untrusted/self-signed TLS certificates when generating artifacts (ISO/UKI/RAW).
          Useful on self-hosted runners that pull from a local or in-cluster registry (e.g.
          localhost:5000/...). Passed to auroraboot as --allow-insecure-registries, and as --set
          allow-insecure-registries=true for the RAW flow."

      # Individual artifact types
      iso:
        type: boolean
        default: false

      raw:
        type: boolean
        default: false

      vhd:
        type: boolean
        default: false

      gce:
        type: boolean
        default: false

      tar:
        type: boolean
        default: false

      # Checksums
      compute_checksums:
        type: boolean
        default: true

      output_format:
        type: string
        default: "auto"

      # Security and signing
      security_checks:
        type: string
        default: ""

      security_scan_mode:
        type: string
        default: "legacy"
        description: "Security scan policy: legacy|enforce|report-only"

      # Individual security checks
      cosign:
        type: boolean
        default: false

      grype:
        type: boolean
        default: false

      trivy:
        type: boolean
        default: false

      sbom:
        type: boolean
        default: true
        description: |
          Attach an SBOM attestation to the pushed image. Default true, so every
          existing caller keeps its current behaviour.

          Set false only when the attestation cannot be attached at all. BuildKit
          refuses a single attestation larger than 41943040 bytes (40 MiB) and
          fails the whole push, so an image whose SBOM crosses that line cannot
          be published while this is true. The image itself is fine in that case:
          the layers, manifest and config all export successfully and only the
          attestation step fails.

          The images that hit this are the ones with very large file counts --
          the NVIDIA Jetson images, whose CUDA userspace produces an SPDX
          document past the limit. Package versions are not the cause and
          bumping them does not help, because the document scales with how many
          packages and files an image contains, not with how old they are.

          Turning this off is a real loss: consumers of that image get no
          attached bill of materials. Prefer these first, and use this input when
          neither is available:
            1. Shrink the document -- package-level SPDX without file-level
               entries is typically far under the limit.
            2. Publish the SBOM as a separate artifact rather than an inline
               attestation, which the 40 MiB cap does not apply to.

      # SARIF generation and upload toggles
      grype_sarif:
        type: boolean
        default: false

      grype_sarif_fail_build:
        type: boolean
        default: true
        description: "Whether the Grype SARIF scan step should fail the job when vulnerabilities at/above the severity cutoff are found. Set to false to prevent SARIF generation from failing the job; build gating may still occur via security_scan_mode when grype/trivy scans are enabled."

      trivy_sarif:
        type: boolean
        default: false

      # Scanner configs (optional)
      grype_config:
        type: string
        required: false
        description: "Path to Grype config file (defaults to .grype.yaml in repo root if not provided)"

      trivy_config:
        type: string
        required: false
        description: "Path to Trivy config file (defaults to .trivy.yaml in repo root if not provided)"

      # Publishing
      registry_domain:
        type: string
        description: "Container registry domain to push to"

      registry_namespace:
        type: string
        description: "Namespace/organization in the registry URL"

      registry_repository:
        type: string
        required: false
        description: "Repository name in the registry (defaults to $FLAVOR if not specified)"

      # Output and reporting
      summary_artifacts:
        type: boolean
        default: false

      auroraboot_version:
        type: string
        default: "latest"

      # Custom tag format
      custom_tag_format:
        type: string
        required: false
        description: "Custom tag format using variables like $FLAVOR, $FLAVOR_RELEASE, $VARIANT, $ARCH, $MODEL, $VERSION, $KUBERNETES_DISTRO, $KUBERNETES_VERSION, $K8S, $UKI, $COMMIT_SHA. If not provided, uses default format."

      custom_artifact_format:
        type: string
        required: false
        description: "Custom artifact filename format using variables like $FLAVOR, $FLAVOR_RELEASE, $VARIANT, $ARCH, $MODEL, $VERSION, $KUBERNETES_DISTRO, $KUBERNETES_VERSION, $K8S, $UKI, $COMMIT_SHA. If not provided, uses auroraboot's default naming."

      custom_job_name_format:
        type: string
        required: false
        description: "Custom job name format using variables like $FLAVOR_RELEASE, $VARIANT, $ARCH, $MODEL, $VERSION, $KUBERNETES_DISTRO, $KUBERNETES_VERSION, $UKI, $COMMIT_SHA. If not provided, uses default format."

      image_labels:
        type: string
        required: false
        description: "Image labels to add to the image"

      # Trusted boot inputs
      keys_dir:
        type: string
        required: false
        description: "Path to directory containing trusted boot keys (required when trusted_boot is true)"

      sysext_dir:
        type: string
        required: false
        description: "Path to directory containing system extensions overlay (optional)"

      generate_test_keys:
        type: boolean
        required: false
        default: false
        description: |
          Generate a throwaway Secure Boot and TPM PCR key set with
          cmd/test-artifacts and sign trusted boot builds with it instead of
          keys_dir. The set is uploaded as the <artifact name>.test-keys
          artifact for one day, so a later job can sign an upgrade image the
          installed test system accepts. For CI test builds only.

      generate_test_sysext:
        type: boolean
        required: false
        default: false
        description: |
          Build the CI test system extensions with cmd/test-artifacts and
          bake them onto the ISO instead of sysext_dir. Trusted boot builds
          get a signed work extension (signed with the generated keys, so
          generate_test_keys must be true) plus the hello-broke extension
          the image policy rejects; other builds get a verity-only work
          extension.

      single_efi_cmdline:
        type: string
        required: false
        description: "Single EFI command line to use for trusted boot (optional, only used when trusted_boot is true)"

      # Cloud config (file path or URL)
      cloud_config:
        type: string
        required: false
        description: "Cloud-config file path or URL passed to auroraboot via --cloud-config. If empty, not passed."

      release:
        type: boolean
        default: false
        description: "Whether to create a GitHub release for the built artifacts"

      list_release_artifacts:
        type: boolean
        default: false
        description: "List all the artifacts that would be included in the release in the GitHub summary"

      release_extraction_notes:
        type: boolean
        default: true
        description: "For raw builds (which can't be attached as release assets), append instructions to the GitHub release for extracting the raw image from the published -img OCI artifact. Set to false to disable."

      cleanup:
        type: boolean
        default: false
        description: "Remove preinstalled packages to free disk space on the runner"

# Every job declares the permissions it needs, so nothing is granted by
# default.
permissions: {}

jobs:
  build:
    permissions:
      id-token: write  # OIDC support
      contents: write
      actions: read
      security-events: write
      models: none
      # packages: write is required for the "Push Kairos image" step
      # to push the built OS image to ghcr or quay when the caller
      # opts into push_images. Job-level permissions here override
      # workflow-level and any permissions the caller declares, so
      # omitting this caps GITHUB_TOKEN to packages:none regardless
      # of what next-*.yaml / _next-build-iso.yaml grant, and ghcr
      # returns "installation not allowed to Write organization package".
      packages: write
    name: "${{ inputs.custom_job_name_format != '' && inputs.custom_job_name_format || format('{0}-{1}-{2}-{3}{4}{5}',
      inputs.base_image, (inputs.kubernetes_distro != '' && 'standard' || 'core'), inputs.arch, inputs.model,
      (inputs.kubernetes_distro != '' && format('-{0}', inputs.kubernetes_distro) || ''), (inputs.trusted_boot && '-uki' || '')) }}"
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - name: Release space from worker
        if: inputs.cleanup
        run: |
          echo "Listing top largest packages"
          pkgs=$(dpkg-query -Wf '${Installed-Size}\t${Package}\t${Status}\n' | awk '$NF == "installed"{print $1 "\t" $2}' | sort -nr)
          head -n 30 <<< "${pkgs}"
          echo
          df -h
          echo
          sudo apt-get remove -y '^llvm-.*|^libllvm.*' || true
          sudo apt-get remove --auto-remove android-sdk-platform-tools || true
          sudo apt-get purge --auto-remove android-sdk-platform-tools || true
          sudo rm -rf /usr/local/lib/android
          sudo apt-get remove -y '^dotnet-.*|^aspnetcore-.*' || true
          sudo rm -rf /usr/share/dotnet
          sudo apt-get remove -y '^mono-.*' || true
          sudo apt-get remove -y '^ghc-.*' || true
          sudo apt-get remove -y '.*jdk.*|.*jre.*' || true
          sudo apt-get remove -y 'php.*' || true
          sudo apt-get remove -y hhvm || true
          sudo apt-get remove -y powershell || true
          sudo apt-get remove -y firefox || true
          sudo apt-get remove -y monodoc-manual || true
          sudo apt-get remove -y msbuild || true
          sudo apt-get remove -y microsoft-edge-stable || true
          sudo apt-get remove -y '^google-.*' || true
          sudo apt-get remove -y azure-cli || true
          sudo apt-get remove -y '^mongo.*-.*|^postgresql-.*|^mysql-.*|^mssql-.*' || true
          sudo apt-get remove -y '^gfortran-.*' || true
          sudo apt-get remove -y '^gcc-*' || true
          sudo apt-get remove -y '^g++-*' || true
          sudo apt-get remove -y '^cpp-*' || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          echo
          echo "Listing top largest packages"
          pkgs=$(dpkg-query -Wf '${Installed-Size}\t${Package}\t${Status}\n' | awk '$NF == "installed"{print $1 "\t" $2}' | sort -nr)
          head -n 30 <<< "${pkgs}"
          echo
          sudo rm -rfv build || true
          df -h
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: '0'
          # Empty is actions/checkout's own default, so unset behaves exactly as
          # before for every existing caller.
          ref: ${{ inputs.ref }}
          # actions/checkout refuses to fetch a non-default ref inside a
          # pull_request_target workflow otherwise -- the exact "pwn request"
          # guard https://gh.io/securely-using-pull_request_target describes.
          # The `caller-vetted-ref` input is the explicit way to opt in;
          # `inputs.ref != ''` is retained as a legacy fallback so existing
          # callers that predate the input keep working. New callers should
          # set caller-vetted-ref; the fallback will be dropped in the next
          # major version.
          allow-unsafe-pr-checkout: ${{ inputs.caller-vetted-ref || inputs.ref != '' }}
          persist-credentials: false

      - name: Validate inputs and setup Dockerfile
        shell: bash
        run: |
          # Create a temporary directory for downloaded files (needed for fallback cases)
          TEMP_DIR=$(mktemp -d)
          echo "📁 Created temporary directory: $TEMP_DIR"

          # Check if user provided a dockerfile_path
          if [[ -n "${INPUTS_DOCKERFILE_PATH}" ]]; then
            # User provided a path - validate it exists
            if [ ! -f "${INPUTS_DOCKERFILE_PATH}" ]; then
              echo "❌ Error: Dockerfile not found at ${INPUTS_DOCKERFILE_PATH}"
              echo "   Current directory: $(pwd)"
              echo "   Directory contents: $(ls -la)"
              echo "   Please ensure the Dockerfile exists at the specified path"
              exit 1
            fi
            echo "✅ Found Dockerfile at ${INPUTS_DOCKERFILE_PATH}"
            echo "DOCKERFILE_PATH=${INPUTS_DOCKERFILE_PATH}" >> $GITHUB_ENV
          else
            # User didn't provide a path - download fallback
            echo "📥 No Dockerfile path provided, downloading fallback from Kairos ${INPUTS_KAIROS_VERSION}"

            # Download the default Kairos Dockerfile to temp directory
            echo "📥 Downloading default Kairos Dockerfile from https://github.com/kairos-io/kairos/blob/${INPUTS_KAIROS_VERSION}/images/Dockerfile"
            curl -L "https://raw.githubusercontent.com/kairos-io/kairos/${INPUTS_KAIROS_VERSION}/images/Dockerfile" -o "$TEMP_DIR/Dockerfile"

            if [ -f "$TEMP_DIR/Dockerfile" ]; then
              echo "✅ Successfully downloaded default Dockerfile to $TEMP_DIR/Dockerfile"
              # Update the dockerfile_path to use the downloaded file
              echo "DOCKERFILE_PATH=$TEMP_DIR/Dockerfile" >> $GITHUB_ENV
            else
              echo "❌ Error: Failed to download default Dockerfile"
              exit 1
            fi
          fi

          # Download Dockerfile.img only if RAW builds are requested
          if [[ "${{ inputs.raw }}" == "true" ]]; then
            echo "📥 Downloading Kairos Dockerfile.img for RAW builds from https://github.com/kairos-io/kairos/blob/${INPUTS_KAIROS_VERSION}/images/Dockerfile.img"
            curl -L "https://raw.githubusercontent.com/kairos-io/kairos/${INPUTS_KAIROS_VERSION}/images/Dockerfile.img" -o "$TEMP_DIR/Dockerfile.img"

            if [ -f "$TEMP_DIR/Dockerfile.img" ]; then
              echo "✅ Successfully downloaded Dockerfile.img to $TEMP_DIR/Dockerfile.img"
              # Update the dockerfile_img_path to use the downloaded file
              echo "DOCKERFILE_IMG_PATH=$TEMP_DIR/Dockerfile.img" >> $GITHUB_ENV
            else
              echo "❌ Error: Failed to download Dockerfile.img"
              exit 1
            fi
          fi

          # Validate required inputs
          if [[ -z "${INPUTS_VERSION}" ]]; then
            echo "❌ Error: version is required"
            exit 1
          fi

          # Validate kubernetes_distro values
          if [[ -n "${INPUTS_KUBERNETES_DISTRO}" ]]; then
            case "${INPUTS_KUBERNETES_DISTRO}" in
              k3s|k0s)
                ;;
              *)
                echo "❌ Error: kubernetes_distro must be 'k3s' or 'k0s'"
                exit 1
                ;;
            esac
          fi

          # Validate arch values
          case "${INPUTS_ARCH}" in
            amd64|arm64)
              ;;
            *)
              echo "❌ Error: arch must be 'amd64' or 'arm64'"
              exit 1
              ;;
          esac

          # Validate security scan mode
          case "${INPUTS_SECURITY_SCAN_MODE}" in
            legacy|enforce|report-only)
              ;;
            *)
              echo "❌ Error: security_scan_mode must be one of 'legacy', 'enforce', or 'report-only'"
              exit 1
              ;;
          esac

          echo "✅ Input validation passed"
        env:
          INPUTS_DOCKERFILE_PATH: ${{ inputs.dockerfile_path }}
          INPUTS_KAIROS_VERSION: ${{ inputs.kairos_version }}
          INPUTS_VERSION: ${{ inputs.version }}
          INPUTS_KUBERNETES_DISTRO: ${{ inputs.kubernetes_distro }}
          INPUTS_ARCH: ${{ inputs.arch }}
          INPUTS_SECURITY_SCAN_MODE: ${{ inputs.security_scan_mode }}

      - name: Setup environment
        id: setup
        shell: bash
        run: |
          # Determine variant based on kubernetes_distro
          if [[ -n "${INPUTS_KUBERNETES_DISTRO}" ]]; then
            VARIANT="standard"
          else
            VARIANT="core"
          fi

          # Handle version resolution
          if [[ "${INPUTS_VERSION}" == "auto" ]]; then
            VERSION=$(git describe --tags --dirty --always)
            # Handle three cases:
            # 1. No tags: 39d55d3 → v0.0.0-39d55d3
            # 2. Dirty tag: v3.5.0-23-g94fe1d98 → keep as is
            # 3. Clean tag: v3.5.0 → keep as is
            if [[ "$VERSION" =~ ^[a-f0-9]+$ ]]; then
              # Just a commit SHA (no tags), prefix with v0.0.0-
              VERSION="v0.0.0-$VERSION"
            fi
          else
            VERSION="${INPUTS_VERSION}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

          if [[ "${INPUTS_KAIROS_VERSION}" == "auto" ]]; then
            KAIROS_VERSION=$VERSION
          elif [[ "${INPUTS_KAIROS_VERSION}" != "" ]]; then
            KAIROS_VERSION="${INPUTS_KAIROS_VERSION}"
          fi
          echo "KAIROS_VERSION=$KAIROS_VERSION" >> $GITHUB_ENV

          # Handle kubernetes version resolution
          if [[ "${INPUTS_KUBERNETES_VERSION}" == "auto" ]]; then
            KUBERNETES_VERSION=""
          else
            KUBERNETES_VERSION="${INPUTS_KUBERNETES_VERSION}"
          fi

          # Split base image for tag generation
          BASE_IMAGE=$(echo "${INPUTS_BASE_IMAGE}" | cut -d ':' -f 1)
          BASE_TAG=$(echo "${INPUTS_BASE_IMAGE}" | cut -d ':' -f 2 || echo 'latest')

          # Handle base images with slashes (registry paths)
          # Examples:
          # - ubuntu:24.04 -> FLAVOR=ubuntu, FLAVOR_RELEASE=24.04
          # - opensuse/leap:15.6 -> FLAVOR=opensuse, FLAVOR_RELEASE=leap-15.6
          # - ghcr.io/kairos-io/hadron:main -> FLAVOR=hadron, FLAVOR_RELEASE=main
          if [[ "$BASE_IMAGE" == *"/"* ]]; then
            # Count number of slashes to determine if it's a registry path
            SLASH_COUNT=$(echo "$BASE_IMAGE" | tr -cd '/' | wc -c)
            if [[ $SLASH_COUNT -eq 1 ]]; then
              # Simple case: distro/subdistro (preserve existing behavior)
              DISTRO=$(echo "$BASE_IMAGE" | cut -d '/' -f 1)
              SUB_DISTRO=$(echo "$BASE_IMAGE" | cut -d '/' -f 2)
              FLAVOR="$DISTRO"
              FLAVOR_RELEASE="$SUB_DISTRO-$BASE_TAG"
            else
              # Registry path with multiple slashes: extract last component as FLAVOR
              # e.g., ghcr.io/kairos-io/hadron -> FLAVOR=hadron
              FLAVOR=$(echo "$BASE_IMAGE" | awk -F'/' '{print $NF}')
              FLAVOR_RELEASE="$BASE_TAG"
            fi
          else
            # No slashes: simple image name
            FLAVOR="$BASE_IMAGE"
            FLAVOR_RELEASE="$BASE_TAG"
          fi

          # Special case for nvidia
          if [[ "${INPUTS_MODEL}" == "nvidia-jetson-agx-orin" ]]; then
            FLAVOR="ubuntu"
            FLAVOR_RELEASE="22.04"
          fi

          # Generate image tag
          # Replace + with - in kubernetes version for tag compatibility
          SANITIZED_KUBERNETES_VERSION=$(echo "$KUBERNETES_VERSION" | sed 's/+/-/g')

          # Set UKI suffix if trusted boot is enabled
          UKI_SUFFIX=""
          if [[ "${{ inputs.trusted_boot }}" == "true" ]]; then
            UKI_SUFFIX="-uki"
          fi

          # Define variables for tag generation
          ARCH="${INPUTS_ARCH}"
          MODEL="${INPUTS_MODEL}"
          KUBERNETES_DISTRO="${INPUTS_KUBERNETES_DISTRO}"
          UKI="$UKI_SUFFIX"
          COMMIT_SHA="${{ github.sha }}"

          # Set kubernetes suffix (leading dash) if a k8s distro+version
          # pair was passed; empty otherwise. Consumers use this in
          # custom_tag_format so cells without k8s don't get a stray dash
          # (e.g. `...-generic--v4.3.0`) and cells with k8s get the
          # distro+version pair disambiguating them from each other and
          # from the no-k8s cell.
          K8S=""
          if [[ -n "$KUBERNETES_VERSION" ]]; then
            K8S="-$KUBERNETES_DISTRO-$SANITIZED_KUBERNETES_VERSION"
          fi

          # custom_tag_format and custom_artifact_format name the variables
          # above, such as $FLAVOR_RELEASE or $K8S. Only those names are
          # replaced, and the rest of the format stays literal text, so a
          # format cannot run commands. Longer names go first, so that
          # $FLAVOR does not match the start of $FLAVOR_RELEASE.
          expand_format() {
            local out="$1" v
            for v in SANITIZED_KUBERNETES_VERSION KUBERNETES_DISTRO KUBERNETES_VERSION FLAVOR_RELEASE COMMIT_SHA VARIANT VERSION FLAVOR MODEL ARCH K8S UKI; do
              out=${out//"\${$v}"/"${!v}"}
              out=${out//"\$$v"/"${!v}"}
            done
            printf '%s' "$out"
          }

          # Generate default tag
          if [[ -n "$KUBERNETES_VERSION" ]]; then
            DEFAULT_TAG="$FLAVOR_RELEASE-$VARIANT-$ARCH-$MODEL-$VERSION-$KUBERNETES_DISTRO-$SANITIZED_KUBERNETES_VERSION$UKI"
          else
            DEFAULT_TAG="$FLAVOR_RELEASE-$VARIANT-$ARCH-$MODEL-$VERSION$UKI"
          fi

          # Use custom tag format if provided, otherwise use default
          if [[ -n "${INPUTS_CUSTOM_TAG_FORMAT}" ]]; then
            TAG="$(expand_format "${INPUTS_CUSTOM_TAG_FORMAT}")"
          else
            TAG="$DEFAULT_TAG"
          fi

          # Determine registry, namespace, and repository
          REGISTRY="${INPUTS_REGISTRY_DOMAIN}"
          NAMESPACE="${INPUTS_REGISTRY_NAMESPACE}"

          # Use registry_repository if specified, otherwise use FLAVOR
          if [[ -n "${INPUTS_REGISTRY_REPOSITORY}" ]]; then
            REPOSITORY="${INPUTS_REGISTRY_REPOSITORY}"
          else
            REPOSITORY="$FLAVOR"
          fi

          IMAGE_TAG=""
          # Build image tag
          if [[ -n "$REGISTRY" ]]; then
            IMAGE_TAG="$REGISTRY/"
          fi
          if [[ -n "$NAMESPACE" ]]; then
            IMAGE_TAG="$IMAGE_TAG$NAMESPACE/"
          fi
          if [[ -n "$REPOSITORY" ]]; then
            IMAGE_TAG="$IMAGE_TAG$REPOSITORY:"
          fi
          IMAGE_TAG="$IMAGE_TAG$TAG"

          echo "IMAGE_NAME=$IMAGE_TAG" >> $GITHUB_ENV

          # Generate artifact name
          if [[ -n "${INPUTS_CUSTOM_ARTIFACT_FORMAT}" ]]; then
            ARTIFACT_NAME="$(expand_format "${INPUTS_CUSTOM_ARTIFACT_FORMAT}")"
          else
            # Generate default artifact name format
            DEFAULT_ARTIFACT_NAME="kairos-$FLAVOR_RELEASE-$VARIANT-$ARCH-$MODEL-$VERSION"

            # Append kubernetes distro and version if defined
            if [[ -n "$KUBERNETES_DISTRO" ]]; then
              DEFAULT_ARTIFACT_NAME="$DEFAULT_ARTIFACT_NAME-$KUBERNETES_DISTRO-$SANITIZED_KUBERNETES_VERSION"
            fi

            # Append UKI suffix if trusted boot is enabled
            DEFAULT_ARTIFACT_NAME="$DEFAULT_ARTIFACT_NAME$UKI"

            ARTIFACT_NAME="$DEFAULT_ARTIFACT_NAME"
          fi

          # Use keys_dir if specified
          if [[ -n "${INPUTS_KEYS_DIR}" ]]; then
            KEYS_DIR="${INPUTS_KEYS_DIR}"
          else
            KEYS_DIR=""
          fi

          # Use sysext_dir if specified
          if [[ -n "${INPUTS_SYSEXT_DIR}" ]]; then
            SYSEXT_DIR="${INPUTS_SYSEXT_DIR}"
          else
            SYSEXT_DIR=""
          fi

          # Use single_efi_cmdline if specified
          if [[ -n "${INPUTS_SINGLE_EFI_CMDLINE}" ]]; then
            SINGLE_EFI_CMDLINE="${INPUTS_SINGLE_EFI_CMDLINE}"
          else
            SINGLE_EFI_CMDLINE=""
          fi

          # Export variables
          echo "variant=$VARIANT" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "kubernetes_version=$KUBERNETES_VERSION" >> $GITHUB_OUTPUT
          echo "kubernetes_distro=$KUBERNETES_DISTRO" >> $GITHUB_OUTPUT
          echo "flavor=$FLAVOR" >> $GITHUB_OUTPUT
          echo "flavor_release=$FLAVOR_RELEASE" >> $GITHUB_OUTPUT
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
          echo "keys_dir=$KEYS_DIR" >> $GITHUB_OUTPUT
          echo "sysext_dir=$SYSEXT_DIR" >> $GITHUB_OUTPUT
          echo "single_efi_cmdline=$SINGLE_EFI_CMDLINE" >> $GITHUB_OUTPUT

          echo "🔧 Environment setup complete"
          echo "   Variant: $VARIANT"
          echo "   Version: $VERSION"
          echo "   Registry: $REGISTRY"
          echo "   Namespace: $NAMESPACE"
          echo "   Repository: $REPOSITORY"
          echo "   Default Tag: $DEFAULT_TAG"
          if [[ -n "${INPUTS_CUSTOM_TAG_FORMAT}" ]]; then
            echo "   Custom Tag Format: ${INPUTS_CUSTOM_TAG_FORMAT}"
          fi
          if [[ -n "${INPUTS_CUSTOM_ARTIFACT_FORMAT}" ]]; then
            echo "   Custom Artifact Format: ${INPUTS_CUSTOM_ARTIFACT_FORMAT}"
            echo "   Artifact Name: $ARTIFACT_NAME"
          fi
          if [[ -n "${INPUTS_KEYS_DIR}" ]]; then
            echo "   Keys Dir: ${INPUTS_KEYS_DIR}"
          fi
          if [[ -n "${INPUTS_SYSEXT_DIR}" ]]; then
            echo "   Sysext Dir: ${INPUTS_SYSEXT_DIR}"
          fi
          if [[ -n "${INPUTS_SINGLE_EFI_CMDLINE}" ]]; then
            echo "   Single EFI Cmdline: ${INPUTS_SINGLE_EFI_CMDLINE}"
          fi
          echo "   Final Tag: $TAG"
          echo "   Image Tag: $IMAGE_TAG"
        env:
          INPUTS_KUBERNETES_DISTRO: ${{ inputs.kubernetes_distro }}
          INPUTS_VERSION: ${{ inputs.version }}
          INPUTS_KAIROS_VERSION: ${{ inputs.kairos_version }}
          INPUTS_KUBERNETES_VERSION: ${{ inputs.kubernetes_version }}
          INPUTS_BASE_IMAGE: ${{ inputs.base_image }}
          INPUTS_MODEL: ${{ inputs.model }}
          INPUTS_ARCH: ${{ inputs.arch }}
          INPUTS_CUSTOM_TAG_FORMAT: ${{ inputs.custom_tag_format }}
          INPUTS_REGISTRY_DOMAIN: ${{ inputs.registry_domain }}
          INPUTS_REGISTRY_NAMESPACE: ${{ inputs.registry_namespace }}
          INPUTS_REGISTRY_REPOSITORY: ${{ inputs.registry_repository }}
          INPUTS_CUSTOM_ARTIFACT_FORMAT: ${{ inputs.custom_artifact_format }}
          INPUTS_KEYS_DIR: ${{ inputs.keys_dir }}
          INPUTS_SYSEXT_DIR: ${{ inputs.sysext_dir }}
          INPUTS_SINGLE_EFI_CMDLINE: ${{ inputs.single_efi_cmdline }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
        with:
          platforms: linux/${{ inputs.arch }}

      - name: Login to registry
        if: inputs.registry_domain != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ${{ inputs.registry_domain }}
          username: ${{ secrets.registry_username }}
          password: ${{ secrets.registry_password }}

      - name: Download OCI build context
        if: inputs.oci_context_artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ inputs.oci_context_artifact }}
          path: ${{ runner.temp }}/oci-context

      - name: Unpack OCI build context
        if: inputs.oci_context_artifact != ''
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${INPUTS_OCI_CONTEXT_NAME}" ]]; then
            echo "::error::oci_context_artifact needs oci_context_name"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/oci-context/layout"
          tar -xf "$RUNNER_TEMP"/oci-context/*.tar -C "$RUNNER_TEMP/oci-context/layout"
        env:
          INPUTS_OCI_CONTEXT_NAME: ${{ inputs.oci_context_name }}

      - name: Build Kairos image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          platforms: linux/${{ inputs.arch }}
          no-cache: ${{ inputs.no_cache }}
          push: false
          load: true
          build-contexts: ${{ inputs.oci_context_artifact != '' && format('{0}=oci-layout://{1}/oci-context/layout', inputs.oci_context_name, runner.temp) || '' }}
          tags: ${{ steps.setup.outputs.image_tag }}
          labels: ${{ inputs.image_labels }}
          build-args: |
            BASE_IMAGE=${{ inputs.base_image }}
            MODEL=${{ inputs.model }}
            KUBERNETES_VERSION=${{ steps.setup.outputs.kubernetes_version }}
            KUBERNETES_DISTRO=${{ inputs.kubernetes_distro }}
            TRUSTED_BOOT=${{ inputs.trusted_boot }}
            VERSION=${{ steps.setup.outputs.version }}
            ${{ inputs.build_args }}

      - name: Check for Grype config
        if: inputs.grype || inputs.grype_sarif
        id: grype-config
        env:
          INPUTS_GRYPE_CONFIG: ${{ inputs.grype_config }}
        run: |
          if [[ -n "${INPUTS_GRYPE_CONFIG}" && -f "${INPUTS_GRYPE_CONFIG}" ]]; then
            echo "📄 Using Grype config: ${INPUTS_GRYPE_CONFIG}"
            echo "path=${INPUTS_GRYPE_CONFIG}" >> $GITHUB_OUTPUT
          elif [[ -f ".grype.yaml" ]]; then
            echo "📄 Using Grype config: .grype.yaml"
            echo "path=.grype.yaml" >> $GITHUB_OUTPUT
          else
            echo "ℹ️ No Grype config file found, using defaults"
            echo "path=" >> $GITHUB_OUTPUT
          fi

      # `fail-build: false` only stops grype failing on findings. The action
      # downloads the grype release asset at run time, so it can also fail for
      # reasons that say nothing about the image: a 500 from the release CDN, a
      # checksum mismatch on a truncated download, a vulnerability database
      # that will not fetch. Those used to fail this job, and every scan step
      # runs before "Push Kairos image", so a build that was told not to gate
      # on scanning never published its image.
      #
      # Whether a scanner is allowed to fail the job follows from whether its
      # findings gate the build in the mode we are running in:
      #
      #   mode          grype gates   trivy gates
      #   legacy        yes           no
      #   enforce       yes           yes
      #   report-only   no            no
      #
      # A scan that gates fails closed: if it cannot run we do not know whether
      # the image is clean, so the build has to stop. A scan that gates nothing
      # must not be able to fail the build at all. Findings are still handled
      # exactly as before, by the parse and enforce steps below.
      - name: Run Grype security scan
        if: inputs.grype
        id: grype
        continue-on-error: ${{ inputs.security_scan_mode == 'report-only' }}
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        with:
          image: ${{ steps.setup.outputs.image_tag }}
          output-format: json
          severity-cutoff: critical
          add-cpes-if-none: true
          only-fixed: true
          fail-build: false
          config: ${{ steps.grype-config.outputs.path }}
      - name: Parse Grype scan results
        if: inputs.grype
        id: grype-results
        env:
          STEPS_GRYPE_OUTPUTS_JSON: ${{ steps.grype.outputs.json }}
          INPUTS_SECURITY_SCAN_MODE: ${{ inputs.security_scan_mode }}
        run: |
          # Check if the JSON file exists and is not empty. This is the
          # scanner-did-not-run case: either the step above was tolerated by
          # continue-on-error, or it reported success without producing output.
          if [[ ! -f "${STEPS_GRYPE_OUTPUTS_JSON}" ]] || [[ ! -s "${STEPS_GRYPE_OUTPUTS_JSON}" ]]; then
            echo "critical_count=0" >> $GITHUB_OUTPUT
            echo "status=error" >> $GITHUB_OUTPUT
            if [[ "${INPUTS_SECURITY_SCAN_MODE}" == "report-only" ]]; then
              echo "::warning title=Grype scan did not run::The Grype scan produced no results, so this image was not scanned by Grype. The build is not gated on Grype in report-only mode, so it continues."
              exit 0
            fi
            echo "❌ Error: Grype JSON output file is missing or empty"
            echo "   Expected file: ${STEPS_GRYPE_OUTPUTS_JSON}"
            echo "   This indicates the Grype scan failed or didn't produce output"
            echo "   Grype gates the build in '${INPUTS_SECURITY_SCAN_MODE}' mode, so this is a failure."
            exit 1
          fi

          CRITICAL_COUNT=$(jq '[.matches[]? | select((.vulnerability.severity // "") == "Critical")] | length' "${STEPS_GRYPE_OUTPUTS_JSON}")
          echo "critical_count=$CRITICAL_COUNT" >> $GITHUB_OUTPUT

          jq -r '.matches[]? | select((.vulnerability.severity // "") == "Critical") | "\(.vulnerability.id)\t\(.artifact.name) \(.artifact.version) -> \(.artifact.locations[0].path // "no-path")"' "${STEPS_GRYPE_OUTPUTS_JSON}" > grype-critical.txt

          if [[ "$CRITICAL_COUNT" -gt 0 ]]; then
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "❌ Grype found $CRITICAL_COUNT critical vulnerabilities."
            echo "   Critical findings:"
            cat grype-critical.txt
          else
            echo "status=passed" >> $GITHUB_OUTPUT
            echo "✅ Grype found no critical vulnerabilities."
          fi

      # Trivy findings only gate the build in 'enforce' mode, so 'legacy' and
      # 'report-only' tolerate a Trivy that cannot run.
      - name: Run Trivy security scan
        if: inputs.trivy
        id: trivy-scan
        continue-on-error: ${{ inputs.security_scan_mode != 'enforce' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ steps.setup.outputs.image_tag }}
          format: json
          output: trivy.json
          severity: CRITICAL
          trivy-config: ${{ inputs.trivy_config || '.trivy.yaml' }}

      - name: Parse Trivy scan results
        if: inputs.trivy
        id: trivy-results
        shell: bash
        env:
          INPUTS_SECURITY_SCAN_MODE: ${{ inputs.security_scan_mode }}
        run: |
          if [[ ! -f "trivy.json" ]] || [[ ! -s "trivy.json" ]]; then
            echo "critical_count=0" >> $GITHUB_OUTPUT
            echo "status=error" >> $GITHUB_OUTPUT
            if [[ "${INPUTS_SECURITY_SCAN_MODE}" != "enforce" ]]; then
              echo "::warning title=Trivy scan did not run::The Trivy scan produced no results, so this image was not scanned by Trivy. The build is not gated on Trivy in '${INPUTS_SECURITY_SCAN_MODE}' mode, so it continues."
              exit 0
            fi
            echo "❌ Error: Trivy JSON output file is missing or empty"
            echo "   Trivy gates the build in 'enforce' mode, so this is a failure."
            exit 1
          fi

          CRITICAL_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select((.Severity // "") == "CRITICAL")] | length' trivy.json)
          echo "critical_count=$CRITICAL_COUNT" >> $GITHUB_OUTPUT

          jq -r '.Results[]? as $r | $r.Vulnerabilities[]? | select((.Severity // "") == "CRITICAL") | "\(.VulnerabilityID)\t\(.PkgName) \(.InstalledVersion // "unknown") -> \($r.Target // "unknown-target")"' trivy.json > trivy-critical.txt

          if [[ "$CRITICAL_COUNT" -gt 0 ]]; then
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "❌ Trivy found $CRITICAL_COUNT critical vulnerabilities."
            echo "   Critical findings:"
            cat trivy-critical.txt
          else
            echo "status=passed" >> $GITHUB_OUTPUT
            echo "✅ Trivy found no critical vulnerabilities."
          fi

      - name: Enforce security scan policy (legacy)
        if: inputs.security_scan_mode == 'legacy' && inputs.grype
        shell: bash
        run: |
          GRYPE_CRITICAL="${STEPS_GRYPE_RESULTS_OUTPUTS_CRITICAL_COUNT}"
          [[ -z "$GRYPE_CRITICAL" ]] && GRYPE_CRITICAL=0

          if [[ "$GRYPE_CRITICAL" -gt 0 ]]; then
            echo "❌ Security gate blocked build (legacy mode): Grype found $GRYPE_CRITICAL critical vulnerabilities."
            if [[ ! -s grype-critical.txt ]]; then
              jq -r '.matches[]? | select((.vulnerability.severity // "") == "Critical") | "\(.vulnerability.id)\t\(.artifact.name) \(.artifact.version) -> \(.artifact.locations[0].path // "no-path")"' "${STEPS_GRYPE_OUTPUTS_JSON}" > grype-critical.txt
            fi
            if [[ -s grype-critical.txt ]]; then
              echo "   Grype critical findings:"
              cat grype-critical.txt
            else
              echo "   Grype critical findings unavailable (could not parse details)."
            fi
            exit 1
          fi

          echo "✅ Security gate passed (legacy mode)."
        env:
          STEPS_GRYPE_RESULTS_OUTPUTS_CRITICAL_COUNT: ${{ steps.grype-results.outputs.critical_count }}
          STEPS_GRYPE_OUTPUTS_JSON: ${{ steps.grype.outputs.json }}

      - name: Enforce security scan policy (enforce)
        if: inputs.security_scan_mode == 'enforce'
        shell: bash
        run: |
          FAIL=0

          if [[ "${{ inputs.grype }}" == "true" ]]; then
            GRYPE_CRITICAL="${STEPS_GRYPE_RESULTS_OUTPUTS_CRITICAL_COUNT}"
            [[ -z "$GRYPE_CRITICAL" ]] && GRYPE_CRITICAL=0
            if [[ "$GRYPE_CRITICAL" -gt 0 ]]; then
              echo "❌ Grype found $GRYPE_CRITICAL critical vulnerabilities."
              if [[ ! -s grype-critical.txt ]]; then
                jq -r '.matches[]? | select((.vulnerability.severity // "") == "Critical") | "\(.vulnerability.id)\t\(.artifact.name) \(.artifact.version) -> \(.artifact.locations[0].path // "no-path")"' "${STEPS_GRYPE_OUTPUTS_JSON}" > grype-critical.txt
              fi
              if [[ -s grype-critical.txt ]]; then
                echo "   Grype critical findings:"
                cat grype-critical.txt
              else
                echo "   Grype critical findings unavailable (could not parse details)."
              fi
              FAIL=1
            fi
          fi

          if [[ "${{ inputs.trivy }}" == "true" ]]; then
            TRIVY_CRITICAL="${STEPS_TRIVY_RESULTS_OUTPUTS_CRITICAL_COUNT}"
            [[ -z "$TRIVY_CRITICAL" ]] && TRIVY_CRITICAL=0
            if [[ "$TRIVY_CRITICAL" -gt 0 ]]; then
              echo "❌ Trivy found $TRIVY_CRITICAL critical vulnerabilities."
              if [[ ! -s trivy-critical.txt ]]; then
                jq -r '.Results[]? as $r | $r.Vulnerabilities[]? | select((.Severity // "") == "CRITICAL") | "\(.VulnerabilityID)\t\(.PkgName) \(.InstalledVersion // "unknown") -> \($r.Target // "unknown-target")"' trivy.json > trivy-critical.txt
              fi
              if [[ -s trivy-critical.txt ]]; then
                echo "   Trivy critical findings:"
                cat trivy-critical.txt
              else
                echo "   Trivy critical findings unavailable (could not parse details)."
              fi
              FAIL=1
            fi
          fi

          if [[ "$FAIL" -eq 1 ]]; then
            echo "❌ Security gate blocked build (enforce mode)."
            exit 1
          fi

          echo "✅ Security gate passed (enforce mode)."
        env:
          STEPS_GRYPE_RESULTS_OUTPUTS_CRITICAL_COUNT: ${{ steps.grype-results.outputs.critical_count }}
          STEPS_GRYPE_OUTPUTS_JSON: ${{ steps.grype.outputs.json }}
          STEPS_TRIVY_RESULTS_OUTPUTS_CRITICAL_COUNT: ${{ steps.trivy-results.outputs.critical_count }}

      # SARIF generation and upload only feed the GitHub Security tab. Nothing
      # downstream gates on them, so they must not be able to fail the job and
      # block the push. The one exception is grype_sarif_fail_build, which is
      # the caller asking for findings to fail the job, and which is left
      # intact.
      - name: Run Trivy SARIF scan
        if: inputs.trivy_sarif
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ steps.setup.outputs.image_tag }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL
          limit-severities-for-sarif: true
          trivy-config: ${{ inputs.trivy_config || '.trivy.yaml' }}

      - name: Generate Grype SARIF
        if: inputs.grype_sarif
        continue-on-error: ${{ !inputs.grype_sarif_fail_build }}
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        with:
          image: ${{ steps.setup.outputs.image_tag }}
          output-format: sarif
          output-file: grype.sarif
          severity-cutoff: critical
          add-cpes-if-none: true
          only-fixed: true
          fail-build: ${{ inputs.grype_sarif_fail_build }}
          config: ${{ steps.grype-config.outputs.path }}

      # The hashFiles guards keep the filter and upload steps from failing on a
      # SARIF file the step above did not manage to write.
      - name: Filter Grype SARIF to critical
        if: inputs.grype_sarif && hashFiles('grype.sarif') != ''
        continue-on-error: true
        uses: itxaka/sarif-filter@e5315c19bd49c5a4ad76310a2640b2586247d433  # v1
        with:
          input: grype.sarif
          output: grype.sarif
          severity: critical

      - name: Filter Trivy SARIF to critical
        if: inputs.trivy_sarif && hashFiles('trivy.sarif') != ''
        continue-on-error: true
        uses: itxaka/sarif-filter@e5315c19bd49c5a4ad76310a2640b2586247d433  # v1
        with:
          input: trivy.sarif
          output: trivy.sarif
          severity: critical

      - name: Upload Trivy scan results to GitHub Security tab
        if: inputs.trivy_sarif && hashFiles('trivy.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4.38.0
        with:
          sarif_file: 'trivy.sarif'
          category: ${{ steps.setup.outputs.flavor }}-${{ steps.setup.outputs.flavor_release }}-${{ steps.setup.outputs.variant }}-${{ inputs.arch }}-${{ inputs.model }}${{ inputs.trusted_boot && '-uki' || '' }}

      - name: Upload Grype scan results to GitHub Security tab
        if: inputs.grype_sarif && hashFiles('grype.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4.38.0
        with:
          sarif_file: 'grype.sarif'
          category: ${{ steps.setup.outputs.flavor }}-${{ steps.setup.outputs.flavor_release }}-${{ steps.setup.outputs.variant }}-${{ inputs.arch }}-${{ inputs.model }}${{ inputs.trusted_boot && '-uki' || '' }}

      # The step name no longer promises an SBOM, because `sbom` is now an
      # input. A step called "with SBOM" that pushed without one would be the
      # kind of small lie that costs someone an afternoon.
      - name: Push Kairos image
        if: inputs.registry_domain != ''
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          platforms: linux/${{ inputs.arch }}
          push: true
          sbom: ${{ inputs.sbom }}
          tags: ${{ steps.setup.outputs.image_tag }}
          build-contexts: ${{ inputs.oci_context_artifact != '' && format('{0}=oci-layout://{1}/oci-context/layout', inputs.oci_context_name, runner.temp) || '' }}
          labels: ${{ inputs.image_labels }}
          build-args: |
            BASE_IMAGE=${{ inputs.base_image }}
            MODEL=${{ inputs.model }}
            KUBERNETES_VERSION=${{ steps.setup.outputs.kubernetes_version }}
            KUBERNETES_DISTRO=${{ inputs.kubernetes_distro }}
            TRUSTED_BOOT=${{ inputs.trusted_boot }}
            VERSION=${{ steps.setup.outputs.version }}
            ${{ inputs.build_args }}

      - name: Set up Go for test artifacts
        if: inputs.generate_test_keys || inputs.generate_test_sysext
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install AuroraBoot runtime library
        # cmd/test-artifacts runs the AuroraBoot release binary for genkey,
        # which links libpcsclite.
        if: inputs.generate_test_keys
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpcsclite1

      - name: Generate test keys and system extensions
        id: test-artifacts
        if: inputs.generate_test_keys || inputs.generate_test_sysext
        env:
          GENERATE_KEYS: ${{ inputs.generate_test_keys }}
          GENERATE_SYSEXT: ${{ inputs.generate_test_sysext }}
          TRUSTED_BOOT: ${{ inputs.trusted_boot }}
          ARCH: ${{ inputs.arch }}
        run: |
          set -euo pipefail
          keys="$RUNNER_TEMP/test-keys"
          sysext="$RUNNER_TEMP/test-sysext"
          if [[ "$GENERATE_KEYS" == "true" ]]; then
            go run ./cmd/test-artifacts keys --out "$keys"
            echo "keys_dir=$keys" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$GENERATE_SYSEXT" == "true" ]]; then
            if [[ "$TRUSTED_BOOT" == "true" ]]; then
              if [[ "$GENERATE_KEYS" != "true" ]]; then
                echo "::error::generate_test_sysext on a trusted boot build needs generate_test_keys"
                exit 1
              fi
              go run ./cmd/test-artifacts sysext --out "$sysext" --name work --arch "$ARCH" --key "$keys/db.key" --cert "$keys/db.pem"
              go run ./cmd/test-artifacts sysext-plain --out "$sysext" --name hello-broke
            else
              go run ./cmd/test-artifacts sysext --out "$sysext" --name work --arch "$ARCH"
            fi
            echo "sysext_dir=$sysext" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate ISO artifact
        if: inputs.iso && inputs.model == 'generic'
        id: generate-iso
        shell: bash
        env:
          KEYS_DIR_INPUT: ${{ steps.test-artifacts.outputs.keys_dir || inputs.keys_dir }}
          SYSEXT_DIR_INPUT: ${{ steps.test-artifacts.outputs.sysext_dir || inputs.sysext_dir }}
          INPUTS_MODEL: ${{ inputs.model }}
          STEPS_SETUP_OUTPUTS_IMAGE_TAG: ${{ steps.setup.outputs.image_tag }}
          INPUTS_CLOUD_CONFIG: ${{ inputs.cloud_config }}
          INPUTS_AURORABOOT_VERSION: ${{ inputs.auroraboot_version }}
          INPUTS_SINGLE_EFI_CMDLINE: ${{ inputs.single_efi_cmdline }}
        run: |
          echo "🔍 Debug: Starting ISO generation step"
          echo "   Inputs: iso=${{ inputs.iso }}, model=${INPUTS_MODEL}"
          echo "   Image tag: ${STEPS_SETUP_OUTPUTS_IMAGE_TAG}"

          mkdir -p artifacts
          echo "   Using image: ${STEPS_SETUP_OUTPUTS_IMAGE_TAG}"

          echo "📦 Building ISO ..."
          # The command is a bash array run as "${cmd[@]}", not a string
          # run with eval. eval would read input values such as the
          # cloud-config path or the kernel command line as shell code;
          # in an array each one stays a single argument.
          cmd=(docker run --rm -v /var/run/docker.sock:/var/run/docker.sock)
          cmd+=(-v "$PWD/artifacts:/output")

          if [[ "${{ inputs.trusted_boot }}" == "true" ]]; then
            if [[ "$KEYS_DIR_INPUT" != /* ]]; then
              KEYS_DIR_INPUT="$PWD/$KEYS_DIR_INPUT"
            fi
            cmd+=(-v "$KEYS_DIR_INPUT:/keys")
          fi

          # build-iso takes --overlay-iso just like build-uki, so the
          # extensions ship on the GRUB ISO too. The agent sweeps the live
          # media for *.sysext.raw on both install flows, so keeping this
          # mount inside the trusted_boot branch left the GRUB half of that
          # sweep with nothing to find and no test.
          if [[ -n "$SYSEXT_DIR_INPUT" ]]; then
            if [[ "$SYSEXT_DIR_INPUT" != /* ]]; then
              SYSEXT_DIR_INPUT="$PWD/$SYSEXT_DIR_INPUT"
            fi
            cmd+=(-v "$SYSEXT_DIR_INPUT:/overlay")
          fi

          # Optional cloud-config (file path or URL)
          cloud_config_args=()
          CLOUD_CONFIG_INPUT="${INPUTS_CLOUD_CONFIG}"
          if [[ -n "$CLOUD_CONFIG_INPUT" ]]; then
            if [[ "$CLOUD_CONFIG_INPUT" =~ ^https?:// ]]; then
              cloud_config_args=(--cloud-config "$CLOUD_CONFIG_INPUT")
            else
              # Mount local file into container and refer to stable path
              if [[ "$CLOUD_CONFIG_INPUT" != /* ]]; then
                ABS_CC_PATH="$PWD/$CLOUD_CONFIG_INPUT"
              else
                ABS_CC_PATH="$CLOUD_CONFIG_INPUT"
              fi
              cmd+=(-v "$ABS_CC_PATH:/cloud-config:ro")
              cloud_config_args=(--cloud-config /cloud-config)
            fi
          fi
          cmd+=("quay.io/kairos/auroraboot:${INPUTS_AURORABOOT_VERSION}" --debug)
          if [[ "${{ inputs.trusted_boot }}" == "true" ]]; then
            cmd+=(build-uki)
          else
            cmd+=(build-iso)
          fi
          ## auroraboot flags
          if [[ "${{ inputs.trusted_boot }}" == "true" ]]; then
            cmd+=(--output-dir /output/)
          else
            cmd+=(--output /output/)
          fi

          if [[ "${{ inputs.allow_insecure_registries }}" == "true" ]]; then
            cmd+=(--allow-insecure-registries)
          fi

          if [[ "${{ inputs.trusted_boot }}" == "true" ]]; then
            cmd+=(--output-type=iso)
            cmd+=(--public-keys /keys)
            cmd+=(--tpm-pcr-private-key /keys/tpm2-pcr-private.pem)
            cmd+=(--sb-key /keys/db.key --sb-cert /keys/db.pem)

            if [[ -n "${INPUTS_SINGLE_EFI_CMDLINE}" ]]; then
              cmd+=("--single-efi-cmdline=${INPUTS_SINGLE_EFI_CMDLINE}")
            fi
          fi

          if [[ -n "$SYSEXT_DIR_INPUT" ]]; then
            cmd+=(--overlay-iso /overlay)
          fi

          cmd+=("${cloud_config_args[@]}")
          cmd+=("docker:${STEPS_SETUP_OUTPUTS_IMAGE_TAG}")

          echo "🔧 Executing: ${cmd[*]}"
          "${cmd[@]}"


          ISO_FILE=$(ls artifacts/*.iso | head -1)
          if [[ -n "$ISO_FILE" ]]; then
            echo "✅ ISO generated: $ISO_FILE"
          else
            echo "❌ Error: No ISO file found in artifacts directory"
            echo "   Artifacts directory contents:"
            ls -la artifacts/ || echo "   Artifacts directory is empty or doesn't exist"
            exit 1
          fi

      - name: Generate RAW artifact
        if: inputs.raw
        id: generate-raw
        shell: bash
        run: |
          mkdir -p artifacts
          echo "📦 Building RAW artifact..."
          # The command is a bash array run as "${cmd[@]}", not a string
          # run with eval. eval would read input values such as the
          # cloud-config path or the kernel command line as shell code;
          # in an array each one stays a single argument.
          cmd=(docker run --rm --privileged -v /var/run/docker.sock:/var/run/docker.sock)
          cmd+=(-v "$PWD/artifacts:/output")

          # Optional cloud-config (file path or URL)
          cloud_config_args=()
          CLOUD_CONFIG_INPUT="${INPUTS_CLOUD_CONFIG}"
          if [[ -n "$CLOUD_CONFIG_INPUT" ]]; then
            if [[ "$CLOUD_CONFIG_INPUT" =~ ^https?:// ]]; then
              cloud_config_args=(--cloud-config "$CLOUD_CONFIG_INPUT")
            else
              if [[ "$CLOUD_CONFIG_INPUT" != /* ]]; then
                ABS_CC_PATH="$PWD/$CLOUD_CONFIG_INPUT"
              else
                ABS_CC_PATH="$CLOUD_CONFIG_INPUT"
              fi
              cmd+=(-v "$ABS_CC_PATH:/cloud-config:ro")
              cloud_config_args=(--cloud-config /cloud-config)
            fi
          fi

          cmd+=("quay.io/kairos/auroraboot:${INPUTS_AURORABOOT_VERSION}" --debug)
          cmd+=("${cloud_config_args[@]}")
          cmd+=(--set "disable_http_server=true")
          cmd+=(--set "disable_netboot=true")
          cmd+=(--set "container_image=docker:${STEPS_SETUP_OUTPUTS_IMAGE_TAG}")
          cmd+=(--set "state_dir=/output")
          cmd+=(--set "disk.raw=true")
          if [[ "${{ inputs.allow_insecure_registries }}" == "true" ]]; then
            cmd+=(--set "allow-insecure-registries=true")
          fi

          echo "🔧 Executing: ${cmd[*]}"
          "${cmd[@]}"

          RAW_FILE=$(ls artifacts/*.raw | head -1)
          if [[ -n "$RAW_FILE" ]]; then
            echo "✅ RAW generated: $RAW_FILE"
            echo "RAW_ARTIFACT=$RAW_FILE" >> $GITHUB_ENV
          else
            echo "❌ Error: No RAW file found in artifacts directory"
            echo "   Artifacts directory contents:"
            ls -la artifacts/ || echo "   Artifacts directory is empty or doesn't exist"
            exit 1
          fi
        env:
          INPUTS_CLOUD_CONFIG: ${{ inputs.cloud_config }}
          INPUTS_AURORABOOT_VERSION: ${{ inputs.auroraboot_version }}
          STEPS_SETUP_OUTPUTS_IMAGE_TAG: ${{ steps.setup.outputs.image_tag }}

      - name: Create OCI artifact from RAW image
        if: inputs.raw && inputs.registry_domain != ''
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ${{ env.DOCKERFILE_IMG_PATH }}
          platforms: linux/${{ inputs.arch }}
          push: true
          tags: ${{ steps.setup.outputs.image_tag }}-img
          build-args: |
            ARTIFACT=${{ env.RAW_ARTIFACT }}

      - name: Compute checksums for generated artifacts
        if: (inputs.iso || inputs.raw || inputs.vhd || inputs.tar) && inputs.compute_checksums
        shell: bash
        run: |
          mkdir -p artifacts
          # Enable nullglob so patterns that match nothing (e.g. *.raw
          # when only an ISO was produced) expand to empty rather than
          # staying literal. Without this, `ls artifacts/*.{iso,raw,vhd,tar}`
          # was passing the literal string `artifacts/*.raw` to ls,
          # ls returned non-zero, and the whole step reported
          # "No artifact files found to checksum" even when a valid
          # ISO was sitting right there.
          shopt -s nullglob
          files=(artifacts/*.iso artifacts/*.raw artifacts/*.vhd artifacts/*.tar)
          if [ "${#files[@]}" -gt 0 ]; then
            echo "🔍 Computing SHA256 checksums"
            # artifacts/ and its contents are written by auroraboot
            # running in a docker container as root, so the runner
            # user cannot create the `.sha256` sibling that `tee`
            # tries to write. Reclaim ownership before the loop.
            sudo chown -R "$(id -u):$(id -g)" artifacts
            for f in "${files[@]}"; do
              sha256sum "$f" | tee "${f}.sha256"
            done
          else
            echo "ℹ️  No artifact files found to checksum"
          fi

      - name: Generate VHD artifact
        if: inputs.vhd
        shell: bash
        run: |
          echo "📦 Building VHD artifact..."
          echo "⚠️  VHD generation not yet implemented"

      - name: Generate GCE artifact
        if: inputs.gce
        shell: bash
        run: |
          echo "📦 Building GCE artifact..."
          echo "⚠️  GCE generation not yet implemented"

      - name: Generate TAR artifact
        if: inputs.tar
        shell: bash
        run: |
          echo "📦 Building TAR artifact..."
          echo "⚠️  TAR generation not yet implemented"

      - name: Install Cosign
        if: inputs.cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: "v3.1.3"

      - name: Sign image and artifact checksums with cosign
        if: inputs.cosign && inputs.registry_domain != ''
        env:
          COSIGN_YES: true
          STEPS_SETUP_OUTPUTS_IMAGE_TAG: ${{ steps.setup.outputs.image_tag }}
        shell: bash
        run: |
          set -euo pipefail

          echo "🔏 Signing image in registry: ${STEPS_SETUP_OUTPUTS_IMAGE_TAG}"
          cosign sign "${STEPS_SETUP_OUTPUTS_IMAGE_TAG}"

          echo "🔏 Signing artifact checksums"
          # The bundle holds the signature and the certificate. .sigstore.json
          # is the name Sigstore tools and OpenSSF Scorecard look for.
          for checksum in artifacts/*.sha256; do
            if [[ -f "$checksum" ]]; then
              cosign sign-blob --yes --bundle="${checksum}.sigstore.json" "$checksum"
              echo "✅ Signed checksum: $checksum"
            fi
          done

          if [[ -n "${RAW_ARTIFACT:-}" ]]; then
            echo "🔏 Signing RAW OCI image tag in registry: ${STEPS_SETUP_OUTPUTS_IMAGE_TAG}-img"
            cosign sign "${STEPS_SETUP_OUTPUTS_IMAGE_TAG}-img"
          fi
      - name: GitHub Release
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
          IMG_REF: ${{ steps.setup.outputs.image_tag }}-img
          REGISTRY_DOMAIN: ${{ inputs.registry_domain }}
          RELEASE_EXTRACTION_NOTES: ${{ inputs.release_extraction_notes }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"

          if [[ -z "$TAG" ]]; then
            echo "❌ Could not determine tag from GITHUB_REF_NAME"
            exit 1
          fi

          shopt -s nullglob
          RELEASE_FILES=(
            artifacts/*.iso
            artifacts/*.iso.sha256
            artifacts/*.iso.sha256.sigstore.json
          )
          RAW_FILES=( artifacts/*.raw )
          shopt -u nullglob

          if [[ ${#RELEASE_FILES[@]} -eq 0 && ${#RAW_FILES[@]} -eq 0 ]]; then
            echo "ℹ️ No release artifacts found; skipping release."
            echo "   Looked for artifacts/*.iso* and artifacts/*.raw"
            echo "   Current artifacts directory contents:"
            ls -la artifacts || echo "   (artifacts directory not found)"
            exit 0
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "ℹ️ Release $TAG already exists"
          else
            echo "📦 Creating release $TAG (must already exist as a tag)"
            gh release create "$TAG" --verify-tag --title "$TAG" --notes "Release $TAG"
          fi

          # Upload ISO-style assets. Raw images are handled separately below
          # because a raw disk image typically exceeds GitHub's 2 GiB per-file
          # release-asset limit.
          if [[ ${#RELEASE_FILES[@]} -gt 0 ]]; then
            echo "⬆️ Uploading release artifacts"
            MAX_ATTEMPTS=3
            ATTEMPT=1
            until gh release upload "$TAG" "${RELEASE_FILES[@]}" --clobber; do
              if [[ "$ATTEMPT" -ge "$MAX_ATTEMPTS" ]]; then
                echo "❌ Failed to upload release artifacts after $MAX_ATTEMPTS attempts"
                exit 1
              fi

              BACKOFF=$((ATTEMPT * 5))
              echo "⚠️ Upload failed (attempt $ATTEMPT/$MAX_ATTEMPTS). Retrying in ${BACKOFF}s..."
              sleep "$BACKOFF"
              ATTEMPT=$((ATTEMPT + 1))
            done
          fi

          # Raw builds: the raw image is published as an <image>-img OCI artifact
          # (see "Create OCI artifact from RAW image"), so append instructions for
          # extracting it from that image instead of attaching the oversized raw.
          if [[ ${#RAW_FILES[@]} -gt 0 && "${RELEASE_EXTRACTION_NOTES}" == "true" && -n "${REGISTRY_DOMAIN}" ]]; then
            MARKER="<!-- kairos-factory:raw-image-extraction -->"
            CURRENT_BODY="$(gh release view "$TAG" --json body -q .body)"
            if [[ "$CURRENT_BODY" == *"$MARKER"* ]]; then
              echo "ℹ️ Raw-image extraction instructions already present on release $TAG"
            else
              echo "📝 Appending raw-image extraction instructions to release $TAG"
              {
                printf '%s\n\n' "$CURRENT_BODY"
                printf '%s\n\n' "$MARKER"
                printf '## Raw disk image\n\n'
                printf 'This release includes a raw disk image. Raw images exceed GitHub'"'"'s 2 GiB per-file release-asset limit, so instead of being attached here the image is published as an OCI artifact:\n\n'
                printf '`%s`\n\n' "$IMG_REF"
                printf 'Extract the raw image with Docker:\n\n'
                printf '```bash\n'
                printf 'export IMAGE=%s\n' "$IMG_REF"
                printf 'container=$(docker create "$IMAGE" noop)   # scratch image: throwaway command, never executed\n'
                printf 'docker cp "$container:/artifacts/." .\n'
                printf 'docker rm "$container"\n'
                printf '```\n\n'
                printf 'The `.raw` image is now in the current directory, ready to flash.\n'
              } | gh release edit "$TAG" --notes-file -
            fi
          fi
      - name: List Release Artifacts
        if: inputs.list_release_artifacts
        shell: bash
        run: |
          echo "## 🏭 Kairos Factory Release Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Artifacts:**" >> $GITHUB_STEP_SUMMARY
          for artifact in artifacts/*.iso artifacts/*.raw artifacts/*.vhd artifacts/*.tar; do
            if [[ -f "$artifact" ]]; then
              echo "- \`$(basename "$artifact")\`" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Generate GitHub summary
        if: always() && inputs.summary_artifacts
        shell: bash
        run: |
          echo "## 🏭 Kairos Factory Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${STEPS_SETUP_OUTPUTS_IMAGE_TAG}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Configuration:**" >> $GITHUB_STEP_SUMMARY
          echo "- Base Image: \`${INPUTS_BASE_IMAGE}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Model: \`${INPUTS_MODEL}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Architecture: \`${INPUTS_ARCH}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Variant: \`${STEPS_SETUP_OUTPUTS_VARIANT}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Version: \`${STEPS_SETUP_OUTPUTS_VERSION}\`" >> $GITHUB_STEP_SUMMARY

          if [[ -n "${INPUTS_KUBERNETES_DISTRO}" ]]; then
            echo "- Kubernetes: \`${INPUTS_KUBERNETES_DISTRO}\` \`${STEPS_SETUP_OUTPUTS_KUBERNETES_VERSION}\`" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "${{ inputs.trusted_boot }}" == "true" ]]; then
            echo "- Trusted Boot: ✅ Enabled" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Generated Artifacts:**" >> $GITHUB_STEP_SUMMARY

          ARTIFACT_COUNT=0
          for artifact in artifacts/*.iso artifacts/*.raw artifacts/*.vhd artifacts/*.tar; do
            if [[ -f "$artifact" ]]; then
              echo "- \`$(basename "$artifact")\`" >> $GITHUB_STEP_SUMMARY
              ARTIFACT_COUNT=$((ARTIFACT_COUNT + 1))
            fi
          done

          if [[ $ARTIFACT_COUNT -eq 0 ]]; then
            echo "- No artifacts generated" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "${{ inputs.cosign }}" == "true" && "${INPUTS_REGISTRY_DOMAIN}" != "" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Security:**" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Image signed with cosign" >> $GITHUB_STEP_SUMMARY
            # Check if any artifacts exist for signing
            if ls artifacts/*.iso artifacts/*.raw artifacts/*.vhd artifacts/*.tar 2>/dev/null | grep -q .; then
              echo "- ✅ Artifacts signed with cosign" >> $GITHUB_STEP_SUMMARY
            fi
          elif [[ "${{ inputs.cosign }}" == "true" && "${INPUTS_REGISTRY_DOMAIN}" == "" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Security:**" >> $GITHUB_STEP_SUMMARY
            echo "- ⚠️  Cosign signing skipped (requires registry_domain)" >> $GITHUB_STEP_SUMMARY
          fi

          # Check which security scans were run
          if [[ "${{ inputs.grype }}" == "true" || "${{ inputs.trivy }}" == "true" ]]; then
            MAX_FINDINGS=50
            GRYPE_CRITICAL="${STEPS_GRYPE_RESULTS_OUTPUTS_CRITICAL_COUNT}"
            TRIVY_CRITICAL="${STEPS_TRIVY_RESULTS_OUTPUTS_CRITICAL_COUNT}"
            GRYPE_STATUS="${STEPS_GRYPE_RESULTS_OUTPUTS_STATUS}"
            TRIVY_STATUS="${STEPS_TRIVY_RESULTS_OUTPUTS_STATUS}"
            [[ -z "$GRYPE_CRITICAL" ]] && GRYPE_CRITICAL=0
            [[ -z "$TRIVY_CRITICAL" ]] && TRIVY_CRITICAL=0

            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Security Scans:**" >> $GITHUB_STEP_SUMMARY

            if [[ "${{ inputs.grype }}" == "true" ]]; then
              if [[ "$GRYPE_STATUS" == "passed" ]]; then
                echo "- Grype: ✅ passed ($GRYPE_CRITICAL critical)" >> $GITHUB_STEP_SUMMARY
              elif [[ "$GRYPE_STATUS" == "failed" ]]; then
                echo "- Grype: ❌ failed ($GRYPE_CRITICAL critical)" >> $GITHUB_STEP_SUMMARY
                if [[ "$GRYPE_CRITICAL" -gt 0 && ! -s grype-critical.txt ]]; then
                  jq -r '.matches[]? | select((.vulnerability.severity // "") == "Critical") | "\(.vulnerability.id)\t\(.artifact.name) \(.artifact.version) -> \(.artifact.locations[0].path // "no-path")"' "${STEPS_GRYPE_OUTPUTS_JSON}" > grype-critical.txt
                fi
                if [[ -s grype-critical.txt ]]; then
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "<details><summary>Grype critical findings (up to $MAX_FINDINGS)</summary>" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "\`\`\`text" >> $GITHUB_STEP_SUMMARY
                  awk -v max="$MAX_FINDINGS" 'NR <= max { print } NR == max + 1 { print "... truncated ..." }' grype-critical.txt >> $GITHUB_STEP_SUMMARY
                  echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "</details>" >> $GITHUB_STEP_SUMMARY
                fi
              else
                echo "- Grype: ⚠️ status unknown" >> $GITHUB_STEP_SUMMARY
              fi
            fi

            if [[ "${{ inputs.trivy }}" == "true" ]]; then
              if [[ "$TRIVY_STATUS" == "passed" ]]; then
                echo "- Trivy: ✅ passed ($TRIVY_CRITICAL critical)" >> $GITHUB_STEP_SUMMARY
              elif [[ "$TRIVY_STATUS" == "failed" ]]; then
                echo "- Trivy: ❌ failed ($TRIVY_CRITICAL critical)" >> $GITHUB_STEP_SUMMARY
                if [[ "$TRIVY_CRITICAL" -gt 0 && ! -s trivy-critical.txt ]]; then
                  jq -r '.Results[]? as $r | $r.Vulnerabilities[]? | select((.Severity // "") == "CRITICAL") | "\(.VulnerabilityID)\t\(.PkgName) \(.InstalledVersion // "unknown") -> \($r.Target // "unknown-target")"' trivy.json > trivy-critical.txt
                fi
                if [[ -s trivy-critical.txt ]]; then
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "<details><summary>Trivy critical findings (up to $MAX_FINDINGS)</summary>" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "\`\`\`text" >> $GITHUB_STEP_SUMMARY
                  awk -v max="$MAX_FINDINGS" 'NR <= max { print } NR == max + 1 { print "... truncated ..." }' trivy-critical.txt >> $GITHUB_STEP_SUMMARY
                  echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "</details>" >> $GITHUB_STEP_SUMMARY
                fi
              else
                echo "- Trivy: ⚠️ status unknown" >> $GITHUB_STEP_SUMMARY
              fi
            fi

            echo "- Policy: \`${INPUTS_SECURITY_SCAN_MODE}\`" >> $GITHUB_STEP_SUMMARY

            BLOCKED=false
            if [[ "${INPUTS_SECURITY_SCAN_MODE}" == "legacy" ]]; then
              if [[ "${{ inputs.grype }}" == "true" && "$GRYPE_CRITICAL" -gt 0 ]]; then
                BLOCKED=true
              fi
            elif [[ "${INPUTS_SECURITY_SCAN_MODE}" == "enforce" ]]; then
              if [[ "${{ inputs.grype }}" == "true" && "$GRYPE_CRITICAL" -gt 0 ]]; then
                BLOCKED=true
              fi
              if [[ "${{ inputs.trivy }}" == "true" && "$TRIVY_CRITICAL" -gt 0 ]]; then
                BLOCKED=true
              fi
            fi

            if [[ "$BLOCKED" == "true" ]]; then
              echo "- Gate: ❌ blocked by policy" >> $GITHUB_STEP_SUMMARY
            elif [[ "${INPUTS_SECURITY_SCAN_MODE}" == "report-only" ]]; then
              echo "- Gate: ✅ report-only (non-blocking)" >> $GITHUB_STEP_SUMMARY
            else
              echo "- Gate: ✅ passed" >> $GITHUB_STEP_SUMMARY
            fi
          fi
        env:
          STEPS_SETUP_OUTPUTS_IMAGE_TAG: ${{ steps.setup.outputs.image_tag }}
          INPUTS_BASE_IMAGE: ${{ inputs.base_image }}
          INPUTS_MODEL: ${{ inputs.model }}
          INPUTS_ARCH: ${{ inputs.arch }}
          STEPS_SETUP_OUTPUTS_VARIANT: ${{ steps.setup.outputs.variant }}
          STEPS_SETUP_OUTPUTS_VERSION: ${{ steps.setup.outputs.version }}
          INPUTS_KUBERNETES_DISTRO: ${{ inputs.kubernetes_distro }}
          STEPS_SETUP_OUTPUTS_KUBERNETES_VERSION: ${{ steps.setup.outputs.kubernetes_version }}
          INPUTS_REGISTRY_DOMAIN: ${{ inputs.registry_domain }}
          STEPS_GRYPE_RESULTS_OUTPUTS_CRITICAL_COUNT: ${{ steps.grype-results.outputs.critical_count }}
          STEPS_TRIVY_RESULTS_OUTPUTS_CRITICAL_COUNT: ${{ steps.trivy-results.outputs.critical_count }}
          STEPS_GRYPE_RESULTS_OUTPUTS_STATUS: ${{ steps.grype-results.outputs.status }}
          STEPS_TRIVY_RESULTS_OUTPUTS_STATUS: ${{ steps.trivy-results.outputs.status }}
          STEPS_GRYPE_OUTPUTS_JSON: ${{ steps.grype.outputs.json }}
          INPUTS_SECURITY_SCAN_MODE: ${{ inputs.security_scan_mode }}

      - name: Upload ISO artifacts
        if: inputs.iso
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ steps.setup.outputs.artifact_name }}.iso.zip
          path: |
            artifacts/*.iso
            artifacts/*.sha256
          if-no-files-found: error

      - name: Upload test keys
        # The UKI upgrade test signs its upgrade image with the db and PCR
        # keys of the build whose ISO it installs. They are throwaway keys,
        # kept for one day.
        if: inputs.generate_test_keys && inputs.iso
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ steps.setup.outputs.artifact_name }}.test-keys
          path: ${{ steps.test-artifacts.outputs.keys_dir }}
          retention-days: 1
          if-no-files-found: error

      - name: Upload RAW artifacts
        if: inputs.raw
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ steps.setup.outputs.artifact_name }}.raw.zip
          path: |
            artifacts/*.raw
            artifacts/*.sha256
          if-no-files-found: error
