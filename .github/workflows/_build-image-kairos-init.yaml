name: Build kairos-init image

# Reusable step: multi-arch (linux/amd64 + linux/arm64) container image
# for kairos-init, built from the kairos-init tarball that
# _build-kairos-init.yaml uploaded per arch.
#
# On PR the caller typically pushes to ghcr.io/kairos-io/kairos with a
# pr-<N> tag; on master to :master(-scratch); on release tags to
# quay.io/kairos at :<tag> and :latest. `push=false` builds without
# pushing (compile-verify).

on:
  workflow_call:
    inputs:
      image_registry:
        description: 'Container image registry prefix, e.g. quay.io/kairos'
        type: string
        required: true

      image_tag:
        description: 'Primary image tag'
        type: string
        required: true

      image_extra_tag:
        description: 'Optional second image tag (e.g. "latest" on release), empty otherwise'
        type: string
        default: ''

      push:
        description: 'true to push to the registry, false to only build (verify)'
        type: boolean
        default: false

      registry_login:
        description: '"ghcr" | "quay" | "" (no login; only valid when push is false)'
        type: string
        default: ''

      oci_artifact:
        description: |
          When set, also export the image as an OCI layout tarball and
          upload it as a workflow artifact of this name. The PR pipeline
          uses this to hand kairos-init to _build-iso.yaml without a
          registry, because a plain pull_request run has no credentials
          to push with. Only valid when push is false.
        type: string
        default: ''

      matrix_scope:
        description: |
          Same scope the caller passed to _build-kairos-init.yaml, so the
          image is built for exactly the arches that were built there.
          "pr" -> amd64 only (slim PR pipeline). Anything else -> amd64 +
          arm64 (riscv64 has no kairos-init image).
        type: string
        default: 'ci'

      ref:
        description: 'git ref to check out (defaults to the trigger event ref)'
        type: string
        required: false
        default: ''
      caller-vetted-ref:
        description: |
          Caller assertion required to unlock actions/checkout's
          `allow-unsafe-pr-checkout` opt-in. Set to `true` ONLY if
          the caller has its own authorization gate in front of
          this workflow -- e.g. a `pull_request_target` pipeline
          whose `authorize` job pins the run to a GitHub
          Environment that requires maintainer review before the
          fork's `ref` is fetched. Without such a gate, leaving
          this false keeps the `pull_request_target` + fork-ref
          combination blocked at checkout time (the guard
          described at https://gh.io/securely-using-pull_request_target).
        type: boolean
        required: false
        default: false
    secrets:
      QUAY_USERNAME:
        description: 'quay.io user, needed only when pushing to quay.io'
        required: false
      QUAY_PASSWORD:
        description: 'quay.io password, needed only when pushing to quay.io'
        required: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
          allow-unsafe-pr-checkout: ${{ inputs.caller-vetted-ref }}
          persist-credentials: false

      - name: Pick arches
        id: arches
        env:
          SCOPE: ${{ inputs.matrix_scope }}
        run: |
          if [[ "$SCOPE" == "pr" ]]; then
            echo "list=amd64" >> "$GITHUB_OUTPUT"
            echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"
          else
            echo "list=amd64 arm64" >> "$GITHUB_OUTPUT"
            echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          fi

      # Download by exact name, into the same per-artifact directory a
      # multi-artifact pattern download would use, so the layout below is
      # the same either way.
      - name: Download kairos-init artifact (amd64)
        if: inputs.matrix_scope == 'pr'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: kairos-init-linux-amd64
          path: dist/download/kairos-init-linux-amd64

      - name: Download kairos-init artifacts (amd64 + arm64)
        if: inputs.matrix_scope != 'pr'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: 'kairos-init-linux-@(amd64|arm64)'
          path: dist/download

      - name: Reassemble dist/linux-<arch>/
        # The Dockerfile consumes dist/linux-${TARGETARCH}/kairos-init.
        env:
          ARCHES: ${{ steps.arches.outputs.list }}
        run: |
          set -euo pipefail
          read -ra arches <<< "$ARCHES"
          for arch in "${arches[@]}"; do
            mkdir -p "dist/linux-$arch"
            found=0
            for tarball in "dist/download/kairos-init-linux-$arch"/*.tar.gz; do
              [ -f "$tarball" ] || continue
              tar -xzf "$tarball" -C "dist/linux-$arch"
              found=1
            done
            if [ "$found" -eq 0 ]; then
              echo "::error::no kairos-init artifact for $arch"
              exit 1
            fi
            ls -l "dist/linux-$arch"
          done

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a  # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Login to ghcr.io
        if: inputs.push && inputs.registry_login == 'ghcr'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to quay.io
        if: inputs.push && inputs.registry_login == 'quay'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build & (optionally) push kairos-init
        env:
          REGISTRY: ${{ inputs.image_registry }}
          TAG: ${{ inputs.image_tag }}
          EXTRA_TAG: ${{ inputs.image_extra_tag }}
          PUSH: ${{ inputs.push }}
          OCI_ARTIFACT: ${{ inputs.oci_artifact }}
          PLATFORMS: ${{ steps.arches.outputs.platforms }}
        run: |
          set -euo pipefail
          if [ "$PUSH" = "true" ] && [ -n "$OCI_ARTIFACT" ]; then
            echo "::error::oci_artifact and push are mutually exclusive"
            exit 1
          fi
          args=(--platform "$PLATFORMS" -f kairos-init/Dockerfile
                -t "$REGISTRY/kairos-init:$TAG")
          [ -n "$EXTRA_TAG" ] && args+=(-t "$REGISTRY/kairos-init:$EXTRA_TAG")
          [ "$PUSH" = "true" ] && args+=(--push)
          [ -n "$OCI_ARTIFACT" ] && args+=(--output "type=oci,dest=$RUNNER_TEMP/kairos-init-oci.tar")
          docker buildx build "${args[@]}" .

      - name: Upload OCI layout
        if: inputs.oci_artifact != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ inputs.oci_artifact }}
          path: ${{ runner.temp }}/kairos-init-oci.tar
          if-no-files-found: error
          retention-days: 3
