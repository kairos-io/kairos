name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: |
          git fetch --prune --unshallow
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean --parallelism=1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build-linux-amd64:
    runs-on: 'ubuntu-24.04'
    # The push to the temp registry has hung for hours more than once. With no
    # timeout the job sits until the 6 hour default, and GitHub serves no log
    # while a run is in progress, so the cause stays unreadable.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build the docker image
        uses: docker/build-push-action@v7
        id: build-linux-amd64
        with:
          provenance: false
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ttl.sh/kairos:${{ github.sha }}-amd64 # This are just temp images to build the final one
  build-linux-arm64:
    runs-on: 'ubuntu-24.04-arm'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build the docker image
        uses: docker/build-push-action@v7
        id: build-linux-amr64
        with:
          provenance: false
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: ttl.sh/kairos:${{ github.sha }}-arm64 # This are just temp images to build the final one
  build-linux-riscv64:
    # No native riscv64 runner available; build stage cross-compiles natively via
    # --platform=$BUILDPLATFORM in the Dockerfile so QEMU is only needed for
    # platform registration, not for actual execution.
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: riscv64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build the docker image
        uses: docker/build-push-action@v7
        id: build-linux-riscv64
        with:
          provenance: false
          context: .
          file: Dockerfile
          platforms: linux/riscv64
          build-args: |
            SKIP_UPX=1
          push: true
          tags: ttl.sh/kairos:${{ github.sha }}-riscv64 # This are just temp images to build the final one
  build:
    needs:
      - build-linux-amd64
      - build-linux-arm64
      - build-linux-riscv64
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      - uses: docker/metadata-action@v6
        id: metadata
        with:
          images: quay.io/kairos/kairos-init
      - uses: int128/docker-manifest-create-action@v2
        id: build
        with:
          index-annotations: ${{ steps.metadata.outputs.labels }}
          tags: ${{ steps.metadata.outputs.tags }}
          sources: |
            ttl.sh/kairos:${{ github.sha }}-arm64
            ttl.sh/kairos:${{ github.sha }}-amd64
            ttl.sh/kairos:${{ github.sha }}-riscv64
