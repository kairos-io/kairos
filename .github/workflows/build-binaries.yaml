name: Build binaries
on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-build-${{ github.head_ref || github.ref }}-${{ github.repository }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history so `git describe` in the Makefile produces the
          # real version string.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      # Builds kairos (full), kairos-slim (initramfs variant, no
      # kairos-agent linked), and kcrypt-challenger. Fails the job on
      # compile errors and lets us watch binary sizes in the log.
      - name: Build all binaries
        run: make all

      - name: Sizes
        run: ls -lh bin/
