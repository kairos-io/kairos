name: PR

# The default PR pipeline: a small smoke run that needs no secrets and
# no approval.
#
# The full matrix (every ISO cell, arm64, the flavor matrix, every qemu
# suite) runs on each push to master in master.yaml. On a pull request
# it runs only when a maintainer adds the `ci/full` label, see
# pr-full.yaml. Most pull requests here are opened by agents and get QA
# on a real boot before they merge, so a full matrix on every push was
# mostly cost: it held each fork PR in a deployment approval queue, and
# every approved push started about 60 jobs. See issue #4296.
#
# Trigger: plain pull_request. GitHub gives a run from a fork a
# read-only GITHUB_TOKEN and no repository secrets, so this workflow
# never pushes anything, and the fork's code runs with no more access
# than any public CI gives a drive-by contributor. That is why there is
# no `authorize` gate here and no `caller-vetted-ref` on the calls
# below: every checkout is the event's own merge ref.
#
# What it proves: unit tests and lint pass, the binaries and the
# kairos-init image build, and one amd64 Hadron core ISO built from this
# PR's kairos-init installs and boots (qemu `install` and `acceptance`).
# kairos-init reaches the ISO build as an OCI layout artifact instead of
# a registry image, because there is no registry this run can push to.
#
# merge_group: the same smoke run on each merge queue branch
# (gh-readonly-queue/master/...), so the queue gets the checks it waits
# for. Without this trigger nothing reports on a queue branch and every
# queued PR is dropped with `checks_timed_out`. A merge_group run is not
# a fork run: it gets a read-write token and the repository secrets. It
# runs only code that is already approved and queued, and no job here
# pushes or logs in to a registry.

on:
  merge_group:
  # No paths-ignore: a workflow that never starts never reports its checks, so
  # a docs-only PR (#5871) could never enter the merge queue. The heavy jobs
  # skip themselves instead, see `changes` and the `pr-gate` job.
  pull_request:

permissions:
  contents: read

concurrency:
  # Not `ci-pr-...`: that was the old pull_request_target pipeline's
  # group, and sharing it lets a run of one workflow cancel the other.
  group: ci-pr-smoke-${{ github.head_ref || github.ref }}-${{ github.repository }}
  cancel-in-progress: true

jobs:
  unit-tests:
    uses: ./.github/workflows/_unit-tests.yaml

  lint:
    uses: ./.github/workflows/_lint.yaml

  # Says which parts the change reaches. A change that only touches Markdown,
  # the docs, or the AuroraBoot web UI or Helm chart cannot change a Kairos
  # image, so the image builds and the boot tests skip themselves. A job that
  # needs a skipped job skips too. The merge queue waits for `pr-gate` below and
  # not for the checks of these jobs, because a skipped job of a reusable
  # workflow reports none of the check names it declares.
  changes:
    uses: ./.github/workflows/_changes.yaml

  # Every ISO in this pipeline is built by this image, and the AuroraBoot tests
  # run on it, so it is built when either of them runs.
  build-image-auroraboot:
    needs: changes
    if: needs.changes.outputs.kairos == 'true' || needs.changes.outputs.auroraboot == 'true'
    uses: ./.github/workflows/_build-image-auroraboot.yaml
    permissions:
      contents: read
      packages: write
    with:
      oci_artifact: auroraboot-image

  # The AuroraBoot tests run only when the change can affect AuroraBoot. Only
  # the fast ones (unit tests, vet, Helm chart) run here: the e2e, raw disk, UI
  # and phone-home jobs boot the image and run on master only (master.yaml).
  auroraboot-tests:
    needs: [changes, build-image-auroraboot]
    if: needs.changes.outputs.auroraboot == 'true'
    uses: ./.github/workflows/_auroraboot-tests.yaml
    permissions:
      contents: read
    with:
      image_artifact: auroraboot-image-amd64
      e2e: false

  # The slim pipeline only builds and tests a non-FIPS amd64 ISO, so the
  # builds below skip arm64 and FIPS (pr-full.yaml keeps both).
  build-kairos:
    needs: changes
    if: needs.changes.outputs.kairos == 'true'
    uses: ./.github/workflows/_build-kairos.yaml
    with:
      matrix_scope: pr

  build-kairos-init:
    needs: build-kairos
    uses: ./.github/workflows/_build-kairos-init.yaml
    with:
      matrix_scope: pr

  build-kcrypt-challenger:
    needs: changes
    if: needs.changes.outputs.kairos == 'true'
    uses: ./.github/workflows/_build-kcrypt-challenger.yaml
    with:
      matrix_scope: pr

  # Builds the kairos-init image (amd64 only here) and uploads it as an OCI
  # layout instead of pushing it. The tag is only a local name.
  build-image-kairos-init:
    needs: [build-kairos-init, unit-tests, lint]
    uses: ./.github/workflows/_build-image-kairos-init.yaml
    permissions:
      contents: read
      packages: write
    with:
      image_registry: local
      image_tag: pr
      push: false
      oci_artifact: kairos-init-oci
      matrix_scope: pr

  # One ISO cell. registry_domain is empty, so the factory builds and
  # loads the OS image into the runner's docker and never logs in or
  # pushes. `kairos-init-local` is the build context name the
  # kairos-init OCI layout is bound to; nothing is pulled by that name.
  build-iso:
    needs: [build-image-kairos-init, build-image-auroraboot]
    name: build-iso / amd64-core
    uses: ./.github/workflows/_build-iso.yaml
    # _build-iso.yaml declares these, and a caller has to cover what its
    # callee declares. On a fork PR GitHub still hands out a read-only
    # token, whatever is written here.
    permissions:
      contents: write
      packages: write
      id-token: write
      security-events: write
      actions: read
    with:
      name: amd64-core
      kairos_init_image: kairos-init-local
      auroraboot_artifact: auroraboot-image
      kairos_init_artifact: kairos-init-oci
      arch: amd64
      base_image: 'ghcr.io/kairos-io/hadron:v0.6.3'
      model: generic
      iso: true
      trusted_boot: false
      kubernetes_distro: ''
      registry_domain: ''
      sbom: false
      security_scans: false
      test_sysext_overlay: true
      release: false

  test-core:
    needs: build-iso
    strategy:
      fail-fast: false
      matrix:
        include:
          - {test: 'install'}
          - {test: 'acceptance'}
    name: test-core / ${{ matrix.test }}
    uses: ./.github/workflows/reusable-qemu-test.yaml
    # reusable-qemu-test.yaml declares packages: write for its bundles
    # cell, so the caller has to cover it. Neither cell here uses it.
    permissions:
      contents: read
      packages: write
    with:
      test: ${{ matrix.test }}
      base_image: 'ghcr.io/kairos-io/hadron:v0.6.3'
      variant: 'core'
      arch: 'amd64'
      model: 'generic'
      secureboot: false
      container_image_prefix: 'ghcr.io/kairos-io/kairos/${flavor}'

  # Tests for the scripts the release workflows run. They need only
  # bash, git and jq, so they do not wait for any build.
  release-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Test the release version script
        run: scripts/release-version_test.sh
      - name: Test the green commit script
        run: scripts/green-commit_test.sh
      - name: Test the advisory severity script
        run: scripts/osv-findings_test.sh
      - name: Test the approval notification script
        run: scripts/notify-approval_test.sh
      - name: Test the changed parts script
        run: scripts/changed-parts_test.sh
      - name: Test the AuroraBoot chart release values script
        run: scripts/auroraboot-release-values_test.sh
      - name: Test the factory base_image parsing
        run: scripts/factory-base-image_test.sh

  # Per-PR ISO size signal against the last green master run. It is an
  # informational report and never gates the PR. This run builds no UKI
  # ISO, so the UKI size gate lives in pr-full.yaml; the script's own
  # test still runs here, on every PR.
  size-diff:
    name: iso-size-diff
    needs: build-iso
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install xorriso and mtools
        # The test builds small UKI ISOs and reads them back.
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso mtools
      - name: Test the size diff script
        run: scripts/iso-size-diff_test.sh
      - name: Download PR ISOs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: "kairos-hadron-*-amd64-generic.iso.zip"
          path: candidate
      - name: Download last master ISOs
        # A hiccup finding or fetching the baseline should never fail the
        # PR; the script falls back to a PR-only report when baseline is
        # empty.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow master.yaml --branch master --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [[ -z "$run_id" ]]; then
            echo "No successful master build found; reporting PR sizes only."
            exit 0
          fi
          echo "Using master build $run_id as the size baseline."
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
            --pattern "kairos-hadron-*-amd64-generic.iso.zip" \
            --dir baseline || echo "Baseline artifacts unavailable (expired?)."
      - name: Compare ISO sizes
        run: scripts/iso-size-diff.sh baseline candidate | tee -a "$GITHUB_STEP_SUMMARY"

  # The one check the merge queue waits for. It runs whatever happened to the
  # jobs above, and passes when each of them succeeded or was skipped, which is
  # what a change that skips the image builds produces. A failed or cancelled
  # job fails it. Keep every job of this workflow in `needs`.
  pr-gate:
    if: always()
    needs:
      - unit-tests
      - lint
      - changes
      - build-image-auroraboot
      - auroraboot-tests
      - build-kairos
      - build-kairos-init
      - build-kcrypt-challenger
      - build-image-kairos-init
      - build-iso
      - test-core
      - release-scripts
      - size-diff
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have succeeded or been skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          if jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS" >/dev/null; then
            echo "All jobs succeeded or were skipped."
          else
            echo "::error::A job failed or was cancelled."
            exit 1
          fi
