name: PR

# TEMPORARY, drop this commit before the pull request leaves draft. It
# trims the PR pipeline to the build and the diff-upgrade suite, and the
# other workflows that run on pull requests are deleted in the same
# commit, so iterating on kairos-io/kairos#5574 does not start the rest.

# The default PR pipeline: a small smoke run that needs no secrets and
# no approval.
#
# The full matrix (every ISO cell, arm64, the flavor matrix, every qemu
# suite) runs on each push to master in master.yaml. On a pull request
# it runs only when a maintainer adds the `ci/full` label, see
# pr-full.yaml. Most pull requests here are opened by agents and get QA
# on a real boot before they merge, so a full matrix on every push was
# mostly cost: it held each fork PR in a deployment approval queue, and
# every approved push started about 60 jobs. See issue #4296.
#
# Trigger: plain pull_request. GitHub gives a run from a fork a
# read-only GITHUB_TOKEN and no repository secrets, so this workflow
# never pushes anything, and the fork's code runs with no more access
# than any public CI gives a drive-by contributor. That is why there is
# no `authorize` gate here and no `caller-vetted-ref` on the calls
# below: every checkout is the event's own merge ref.
#
# What it proves: unit tests and lint pass, the binaries and the
# kairos-init image build, and one amd64 Hadron core ISO built from this
# PR's kairos-init installs and boots (qemu `install` and `acceptance`).
# kairos-init reaches the ISO build as an OCI layout artifact instead of
# a registry image, because there is no registry this run can push to.

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/CODEOWNERS'

permissions:
  contents: read

concurrency:
  # Not `ci-pr-...`: that was the old pull_request_target pipeline's
  # group, and sharing it lets a run of one workflow cancel the other.
  group: ci-pr-smoke-${{ github.head_ref || github.ref }}-${{ github.repository }}
  cancel-in-progress: true

jobs:
  # The slim pipeline only builds and tests a non-FIPS amd64 ISO, so the
  # builds below skip arm64 and FIPS (pr-full.yaml keeps both).
  build-kairos:
    uses: ./.github/workflows/_build-kairos.yaml
    with:
      matrix_scope: pr

  build-kairos-init:
    needs: build-kairos
    uses: ./.github/workflows/_build-kairos-init.yaml
    with:
      matrix_scope: pr

  # Builds the kairos-init image (amd64 only here) and uploads it as an OCI
  # layout instead of pushing it. The tag is only a local name.
  build-image-kairos-init:
    needs: build-kairos-init
    uses: ./.github/workflows/_build-image-kairos-init.yaml
    permissions:
      contents: read
      packages: write
    with:
      image_registry: local
      image_tag: pr
      push: false
      oci_artifact: kairos-init-oci
      matrix_scope: pr

  # One ISO cell. registry_domain is empty, so the factory builds and
  # loads the OS image into the runner's docker and never logs in or
  # pushes. `kairos-init-local` is the build context name the
  # kairos-init OCI layout is bound to; nothing is pulled by that name.
  build-iso:
    needs: build-image-kairos-init
    name: build-iso / amd64-core
    uses: ./.github/workflows/_build-iso.yaml
    # _build-iso.yaml declares these, and a caller has to cover what its
    # callee declares. On a fork PR GitHub still hands out a read-only
    # token, whatever is written here.
    permissions:
      contents: write
      packages: write
      id-token: write
      security-events: write
      actions: read
    with:
      name: amd64-core
      kairos_init_image: kairos-init-local
      kairos_init_artifact: kairos-init-oci
      arch: amd64
      base_image: 'ghcr.io/kairos-io/hadron:v0.6.3'
      model: generic
      iso: true
      trusted_boot: false
      kubernetes_distro: ''
      registry_domain: ''
      sbom: false
      security_scans: false
      test_sysext_overlay: true
      release: false

  test-core:
    needs: build-iso
    strategy:
      fail-fast: false
      matrix:
        include:
          - {test: 'diff-upgrade'}
    name: test-core / ${{ matrix.test }}
    uses: ./.github/workflows/reusable-qemu-test.yaml
    # reusable-qemu-test.yaml declares packages: write for its bundles
    # cell, so the caller has to cover it. Neither cell here uses it.
    permissions:
      contents: read
      packages: write
    with:
      test: ${{ matrix.test }}
      base_image: 'ghcr.io/kairos-io/hadron:v0.6.3'
      variant: 'core'
      arch: 'amd64'
      model: 'generic'
      secureboot: false
      container_image_prefix: 'ghcr.io/kairos-io/kairos/${flavor}'
