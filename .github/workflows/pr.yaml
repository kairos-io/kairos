name: PR

# The PR pipeline. Every downstream job (image push, ISO build,
# qemu tests) lives under this workflow.
#
# Trigger: pull_request_target. GitHub does not pass secrets to a
# pull_request workflow triggered from a fork, so an outside
# contributor's build would fail at registry login and every
# downstream job would skip. pull_request_target passes them, which
# is why every job below `needs: authorize` and every reusable is
# passed an explicit `ref: refs/pull/<N>/head`. Same pattern the
# old image-pr.yaml used before we retired it (issue #4307).
#
# CodeQL flags this trigger as "Checkout of untrusted code in a
# privileged context" (codeql rules 441212, 441213, 441214). The
# mitigation is the `authorize` job below -- fork PRs land in the
# fork-pr-builds environment and wait for a maintainer to review
# the diff before any secret-bearing job runs. Do NOT drop the
# authorize job or those findings become real.
#
# Every reusable call below sets `caller-vetted-ref: true`. That
# is what unlocks actions/checkout's `allow-unsafe-pr-checkout`
# opt-in inside each reusable. It is honest to assert here because
# `needs: authorize` puts every fork PR through the fork-pr-builds
# environment approval before its ref is fetched. Removing the
# `authorize` gate without also removing these assertions turns
# the codeql-flagged "pwn request" attack surface real.

on:
  pull_request_target:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/CODEOWNERS'

permissions:
  # See _build-iso.yaml for the reusable-workflow permission
  # rationale (callers must cover callee).
  contents: write
  packages: write
  id-token: write
  security-events: write
  actions: read

concurrency:
  group: ci-pr-${{ github.head_ref || github.ref }}-${{ github.repository }}
  cancel-in-progress: true

jobs:
  # Fork-PR review gate. Nothing else starts until this job does.
  # A PR from a fork lands in the `fork-pr-builds` environment and
  # waits for a maintainer; a same-repo PR lands in `internal` and
  # goes straight through, so maintainer / renovate branches keep
  # running unattended.
  #
  # `fork-pr-builds` was set up on 2026-08-13 with the maintainers
  # team as required reviewers. `internal` intentionally carries no
  # protection rules; it exists only because the environment name
  # has to resolve on both paths. Do NOT rename either to something
  # that does not exist -- GitHub creates a referenced environment
  # implicitly with no protection rules, so a typo fails open.
  authorize:
    name: authorize
    environment: ${{ github.event.pull_request.head.repo.full_name != github.repository && 'fork-pr-builds' || 'internal' }}
    runs-on: ubuntu-latest
    steps:
      - run: 'true'

  unit-tests:
    needs: authorize
    uses: ./.github/workflows/_unit-tests.yaml
    with:
      ref: refs/pull/${{ github.event.pull_request.number }}/head
      caller-vetted-ref: true
    secrets: inherit

  lint:
    needs: authorize
    uses: ./.github/workflows/_lint.yaml
    with:
      ref: refs/pull/${{ github.event.pull_request.number }}/head
      caller-vetted-ref: true
    secrets: inherit

  # The kairos-init pipe (multi-call kairos -> kairos-init -> image ->
  # iso -> qemu). This is the critical path for the qemu suites below.
  build-kairos:
    needs: authorize
    uses: ./.github/workflows/_build-kairos.yaml
    with:
      matrix_scope: ci
      ref: refs/pull/${{ github.event.pull_request.number }}/head
      caller-vetted-ref: true
    secrets: inherit

  build-kairos-init:
    needs: build-kairos
    uses: ./.github/workflows/_build-kairos-init.yaml
    with:
      matrix_scope: ci
      ref: refs/pull/${{ github.event.pull_request.number }}/head
      caller-vetted-ref: true
    secrets: inherit

  # unit-tests + lint gate any image push (visible outside the run).
  # The kairos-init image is what build-iso consumes.
  build-image-kairos-init:
    needs: [build-kairos-init, unit-tests, lint]
    uses: ./.github/workflows/_build-image-kairos-init.yaml
    with:
      image_registry: ghcr.io/kairos-io/kairos
      image_tag: pr-${{ github.event.pull_request.number }}
      push: true
      registry_login: ghcr
      ref: refs/pull/${{ github.event.pull_request.number }}/head
      caller-vetted-ref: true
    secrets: inherit

  # The kcrypt-challenger pipe runs in parallel to the kairos pipe.
  # Nothing on the build-iso / qemu-tests path depends on it -- the
  # encryption tests today pin a published kcrypt-challenger tag, not
  # the just-built one -- so it only gates promote / upload-release.
  build-kcrypt-challenger:
    needs: authorize
    uses: ./.github/workflows/_build-kcrypt-challenger.yaml
    with:
      matrix_scope: ci
      ref: refs/pull/${{ github.event.pull_request.number }}/head
      caller-vetted-ref: true
    secrets: inherit

  build-image-kcrypt-challenger:
    needs: [build-kcrypt-challenger, unit-tests, lint]
    uses: ./.github/workflows/_build-image-kcrypt-challenger.yaml
    with:
      image_registry: ghcr.io/kairos-io/kairos
      image_tag: pr-${{ github.event.pull_request.number }}
      push: true
      registry_login: ghcr
      ref: refs/pull/${{ github.event.pull_request.number }}/head
      caller-vetted-ref: true
    secrets: inherit

  # ISO matrix is split into two jobs so qemu-tests-* start as soon
  # as the amd64 cells they consume are ready, without waiting for
  # the slow arm64/nvidia builds that no test consumes.
  #
  # build-iso: amd64 core, amd64 standard, amd64 standard-uki,
  # amd64 core-uki -- everything the qemu suites boot.
  # build-iso-arm: arm64 core + rpi3 + rpi4 + both nvidia jetson
  # cells -- build-only smoke coverage (no qemu on arm64 in CI).
  #
  # Nothing downstream in PR waits on build-iso-arm; a failure there
  # still fails the whole PR, but qemu proceeds in parallel.

  build-iso:
    needs: build-image-kairos-init
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: 'pr-amd64-core', arch: 'amd64', base_image: 'ghcr.io/kairos-io/hadron:v0.5.1', model: 'generic', iso: true, trusted_boot: false, kubernetes_distro: ''}
          - {name: 'pr-amd64-standard', arch: 'amd64', base_image: 'ghcr.io/kairos-io/hadron:v0.5.1', model: 'generic', iso: true, trusted_boot: false, kubernetes_distro: 'k3s'}
          # UKI cells feed qemu-tests-uki. hadron-trusted is a distinct
          # base image from hadron (extra tpm/measured-boot bits); the
          # -uki suffix on the artifact/tag comes from the $UKI token
          # in _build-iso.yaml's custom formats.
          - {name: 'pr-amd64-standard-uki', arch: 'amd64', base_image: 'ghcr.io/kairos-io/hadron-trusted:v0.5.1', model: 'generic', iso: true, trusted_boot: true, kubernetes_distro: 'k3s'}
          - {name: 'pr-amd64-core-uki', arch: 'amd64', base_image: 'ghcr.io/kairos-io/hadron-trusted:v0.5.1', model: 'generic', iso: true, trusted_boot: true, kubernetes_distro: ''}
    uses: ./.github/workflows/_build-iso.yaml
    with:
      name: ${{ matrix.name }}
      kairos_init_image: ghcr.io/kairos-io/kairos/kairos-init:pr-${{ github.event.pull_request.number }}
      arch: ${{ matrix.arch }}
      base_image: ${{ matrix.base_image }}
      model: ${{ matrix.model }}
      iso: ${{ matrix.iso }}
      trusted_boot: ${{ matrix.trusted_boot }}
      kubernetes_distro: ${{ matrix.kubernetes_distro }}
      # All cells here are hadron/ghcr; nvidia + ubuntu-based ones
      # live in build-iso-arm below and override the registry there.
      registry_domain: 'ghcr.io'
      registry_namespace: 'kairos-io/kairos'
      # UKI-only: bake an extra `testentry` EFI entry so the
      # install-upgrade qemu test has something to upgrade.
      # Factory-action ignores it on non-UKI cells.
      single_efi_cmdline: 'testentry: nothing'
      release: false
      ref: refs/pull/${{ github.event.pull_request.number }}/head
      caller-vetted-ref: true
    secrets: inherit

  build-iso-arm:
    needs: build-image-kairos-init
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: 'pr-arm64-core', arch: 'arm64', base_image: 'ghcr.io/kairos-io/hadron:v0.5.1', model: 'generic', iso: true, trusted_boot: false, kubernetes_distro: ''}
          # rpi cells: raw disk image, no ISO. Still on hadron base.
          - {name: 'pr-arm64-rpi3', arch: 'arm64', base_image: 'ghcr.io/kairos-io/hadron:v0.5.1', model: 'rpi3', iso: false, trusted_boot: false, kubernetes_distro: ''}
          - {name: 'pr-arm64-rpi4', arch: 'arm64', base_image: 'ghcr.io/kairos-io/hadron:v0.5.1', model: 'rpi4', iso: false, trusted_boot: false, kubernetes_distro: ''}
          # NVIDIA Jetson cells. base_image=ubuntu:22.04 -- L4T rootfs
          # only builds on that. Model-derived knobs (grype/sbom/
          # cleanup) turn off scans and enable disk cleanup; see
          # _build-iso.yaml's caller expression. Push destination
          # switches to quay.io/kairos/ci-temp-images because the
          # ghcr.io/kairos-io/kairos/ubuntu package does not exist yet
          # and needs the same seed dance hadron got; ci-temp-images
          # is already public and existing.
          - name: 'pr-arm64-nvidia-agx-orin'
            arch: 'arm64'
            base_image: 'ubuntu:22.04'
            model: 'nvidia-jetson-agx-orin'
            iso: false
            trusted_boot: false
            kubernetes_distro: ''
            registry_domain: 'quay.io'
            registry_namespace: 'kairos'
            registry_repository: 'ci-temp-images'
          - name: 'pr-arm64-nvidia-orin-nx'
            arch: 'arm64'
            base_image: 'ubuntu:22.04'
            model: 'nvidia-jetson-orin-nx'
            iso: false
            trusted_boot: false
            kubernetes_distro: ''
            registry_domain: 'quay.io'
            registry_namespace: 'kairos'
            registry_repository: 'ci-temp-images'
    uses: ./.github/workflows/_build-iso.yaml
    with:
      name: ${{ matrix.name }}
      kairos_init_image: ghcr.io/kairos-io/kairos/kairos-init:pr-${{ github.event.pull_request.number }}
      arch: ${{ matrix.arch }}
      base_image: ${{ matrix.base_image }}
      model: ${{ matrix.model }}
      iso: ${{ matrix.iso }}
      trusted_boot: ${{ matrix.trusted_boot }}
      kubernetes_distro: ${{ matrix.kubernetes_distro }}
      registry_domain: ${{ matrix.registry_domain || 'ghcr.io' }}
      registry_namespace: ${{ matrix.registry_namespace || 'kairos-io/kairos' }}
      registry_repository: ${{ matrix.registry_repository || '' }}
      raw: ${{ matrix.model == 'rpi3' || matrix.model == 'rpi4' }}
      grype: ${{ !startsWith(matrix.model, 'nvidia-jetson') }}
      sbom: ${{ !startsWith(matrix.model, 'nvidia-jetson') }}
      cleanup: ${{ startsWith(matrix.model, 'nvidia-jetson') }}
      release: false
      ref: refs/pull/${{ github.event.pull_request.number }}/head
      caller-vetted-ref: true
    secrets: inherit

  # QEMU test suites. Matrix at THIS level (caller side) calling
  # reusable-qemu-test.yaml directly, because matrix + uses on a
  # leaf reusable is a supported pattern; matrix + uses on an
  # intermediate reusable that itself calls another reusable is
  # the shape that broke earlier (see _build-iso.yaml).
  #
  # Each test cell downloads the ISO artifact factory-action
  # produced during build-iso and boots it under qemu. Test labels
  # match the ginkgo labels in tests/.

  qemu-tests-core:
    needs: build-iso
    strategy:
      fail-fast: false
      matrix:
        include:
          - {test: 'custom-partitioning'}
          - {test: 'acceptance'}
          - {test: 'install'}
          - {test: 'install-target'}
          - {test: 'insecure-registry'}
          - {test: 'partition-validation'}
          - {test: 'reset'}
          - {test: 'upgrade-with-cli'}
          - {test: 'bundles'}
          - {test: 'ssh-hardening'}
          - {test: 'upgrade-latest-with-cli', release-matcher: 'kairos-hadron-*-core-amd64-generic-v*.iso'}
    uses: ./.github/workflows/reusable-qemu-test.yaml
    with:
      test: ${{ matrix.test }}
      base_image: 'ghcr.io/kairos-io/hadron:v0.5.1'
      variant: 'core'
      arch: 'amd64'
      model: 'generic'
      secureboot: false
      container_image_prefix: 'ghcr.io/kairos-io/kairos/${flavor}'
      release-matcher: ${{ matrix.release-matcher || '' }}
      ref: refs/pull/${{ github.event.pull_request.number }}/head
      caller-vetted-ref: true
    secrets: inherit

  qemu-tests-standard:
    needs: build-iso
    strategy:
      fail-fast: false
      matrix:
        include:
          - {test: 'provider-qrcode-install'}
          - {test: 'provider-upgrade-k8s'}
          - {test: 'provider-decentralized-k8s'}
          - {test: 'provider-k3s-disabled'}
          - {test: 'provider-upgrade-latest-k8s-with-kubernetes', release-matcher: 'kairos-hadron-*-standard-amd64-generic-*k3sv*.iso'}
    uses: ./.github/workflows/reusable-qemu-test.yaml
    with:
      test: ${{ matrix.test }}
      base_image: 'ghcr.io/kairos-io/hadron:v0.5.1'
      variant: 'standard'
      arch: 'amd64'
      model: 'generic'
      secureboot: false
      container_image_prefix: 'ghcr.io/kairos-io/kairos/${flavor}'
      release-matcher: ${{ matrix.release-matcher || '' }}
      ref: refs/pull/${{ github.event.pull_request.number }}/head
      caller-vetted-ref: true
    secrets: inherit

  # encryption-* tests spin up a k3s cluster with a kcrypt-challenger
  # Deployment, and that deployment now runs the image this PR just
  # built. Split out from qemu-tests-standard so only these cells gate
  # on build-image-kcrypt-challenger.
  qemu-tests-standard-encryption:
    needs: [build-iso, build-image-kcrypt-challenger]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {test: 'encryption-local'}
          - {test: 'encryption-remote-auto'}
          - {test: 'encryption-remote-static'}
          - {test: 'encryption-remote-https-pinned'}
          - {test: 'encryption-remote-https-bad-cert'}
          - {test: 'encryption-kcrypt-cli'}
    uses: ./.github/workflows/reusable-qemu-test.yaml
    with:
      test: ${{ matrix.test }}
      base_image: 'ghcr.io/kairos-io/hadron:v0.5.1'
      variant: 'standard'
      arch: 'amd64'
      model: 'generic'
      secureboot: false
      container_image_prefix: 'ghcr.io/kairos-io/kairos/${flavor}'
      kcrypt_challenger_image: ghcr.io/kairos-io/kairos/kcrypt-challenger:pr-${{ github.event.pull_request.number }}
      ref: refs/pull/${{ github.event.pull_request.number }}/head
      caller-vetted-ref: true
    secrets: inherit

  # UKI qemu tests. `generic` needs the standard (k3s) UKI ISO plus a
  # dynamically-built upgrade image; `boot-assessment` runs against
  # the core UKI ISO and only checks boot slots. Both live in
  # _uki-test.yaml since their shape diverges from the regular
  # reusable-qemu-test.yaml.
  qemu-tests-uki:
    needs: build-iso
    strategy:
      fail-fast: false
      matrix:
        include:
          - {test: 'install-upgrade', variant: 'standard'}
          - {test: 'boot-assessment', variant: 'core'}
    uses: ./.github/workflows/_uki-test.yaml
    with:
      test: ${{ matrix.test }}
      variant: ${{ matrix.variant }}
      base_image: 'ghcr.io/kairos-io/hadron-trusted:v0.5.1'
      arch: 'amd64'
      model: 'generic'
      container_image_prefix: 'ghcr.io/kairos-io/kairos/${flavor}'
      ref: refs/pull/${{ github.event.pull_request.number }}/head
      caller-vetted-ref: true
    secrets: inherit
