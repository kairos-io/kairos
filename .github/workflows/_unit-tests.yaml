name: Unit tests (step)

# Reusable step: `go test ./...` for the whole monorepo. Same
# invocation as the standalone unit-tests.yaml; extracted so both the
# PR pipeline and the release pipeline share one source of truth for
# how tests are run.
#
# e2e- and integration-tagged suites are skipped by default and get
# their own reusables (once we wire them up).

on:
  workflow_call:
    inputs:
      ref:
        description: 'git ref to check out (defaults to the trigger event ref)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      - name: Unit tests
        run: make test
