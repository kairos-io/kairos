name: Unit tests
on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-unit-${{ github.head_ref || github.ref }}-${{ github.repository }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      # `make test` runs `go test ./...` with no extra build tags, so the
      # e2e- and integration-tagged suites (agent/tests/e2e, kcrypt/tests,
      # sdk/bundles) are skipped here. Those need environmental setup
      # (QEMU + ISO, luet) and belong in dedicated workflows.
      - name: Unit tests
        run: make test
