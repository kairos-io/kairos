name: release (next)

# Thin release pipeline. Runs alongside the existing release.yaml /
# release-arm.yaml during the validation period. Retired once we
# converge and cut an rc tag against it.
#
# Trigger: push tags matching v*. Same shape as next-pr.yaml and
# next-master.yaml, differing in the matrix (full release matrix
# including FIPS and riscv64), the registry (quay.io/kairos instead of
# ghcr), and the presence of the upload-release step that attaches
# binary archives to the GH Release the tag created.

on:
  push:
    tags:
      - 'v*'

permissions:
  # Match _next-build-iso.yaml's permission demand; see next-pr.yaml
  # for the rationale. contents:write is also required to attach
  # artifacts to the GitHub Release the tag created.
  contents: write
  packages: write
  id-token: write
  security-events: write
  actions: read

concurrency:
  group: ci-next-release-${{ github.ref }}-${{ github.repository }}
  cancel-in-progress: false   # do NOT cancel a release run mid-way

jobs:
  unit-tests:
    uses: ./.github/workflows/_next-unit-tests.yaml
    secrets: inherit

  vulnerability-scan:
    uses: ./.github/workflows/release-scan.yml

  build-binaries:
    uses: ./.github/workflows/_next-build-binaries.yaml
    with:
      matrix_scope: release
    secrets: inherit

  build-images:
    needs: build-binaries
    uses: ./.github/workflows/_next-build-images.yaml
    with:
      image_registry: quay.io/kairos
      image_tag: ${{ github.ref_name }}
      image_extra_tag: latest
      push_images: true
      registry_login: quay
    secrets: inherit

  upload-release:
    needs: build-binaries
    uses: ./.github/workflows/_next-upload-release.yaml
    secrets: inherit

  # Release ISO matrix: hadron with trusted_boot on/off. The per-k8s-version
  # k3s/k0s matrix from release.yaml is not yet wired here (needs a dynamic-
  # matrix pre-step); it will be added before we retire release.yaml.
  build-iso:
    needs: [build-images, vulnerability-scan]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: 'next-release-core-amd64-generic', arch: 'amd64', base_image: 'ghcr.io/kairos-io/hadron:v0.5.1', model: 'generic', iso: true, trusted_boot: false}
          - {name: 'next-release-core-amd64-generic-uki', arch: 'amd64', base_image: 'ghcr.io/kairos-io/hadron:v0.5.1', model: 'generic', iso: false, trusted_boot: true}
    uses: ./.github/workflows/_next-build-iso.yaml
    with:
      name: ${{ matrix.name }}
      kairos_init_image: quay.io/kairos/kairos-init:${{ github.ref_name }}
      arch: ${{ matrix.arch }}
      base_image: ${{ matrix.base_image }}
      model: ${{ matrix.model }}
      iso: ${{ matrix.iso }}
      trusted_boot: ${{ matrix.trusted_boot }}
      registry_domain: quay.io
      registry_namespace: kairos
      release: true
    secrets: inherit
