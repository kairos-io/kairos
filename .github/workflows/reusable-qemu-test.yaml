name: Reusable workflow that runs tests with qemu

on:
  workflow_call:
    inputs:
      test:
        required: true
        type: string
      base_image:
        required: true
        type: string
      variant:
        required: true
        type: string
      secureboot:
        required: false
        type: boolean
        default: false
      arch:
        required: true
        type: string
      model:
        required: false
        type: string
        default: "generic"
      kubernetes_distro:
        required: false
        type: string
      release-matcher:
        description: "The release matcher to use for the latest release. Full regex match"
        required: false
        type: string
        default: ""
      use_bridge_network:
        description: "Enable bridge networking for VM-to-VM communication"
        required: false
        type: boolean
        default: false
      ref:
        description: |
          Git ref to check out. Leave empty for the ref that triggered the
          calling workflow, which is right for every ordinary caller.

          Set it only when the caller must test something other than its own
          trigger ref. The motivating case is a `pull_request_target` workflow,
          whose context is the base branch: without this the tests would run
          the base branch's test code against an image built from the pull
          request. Pass `refs/pull/<n>/head`.
        required: false
        type: string
        default: ''
      caller-vetted-ref:
        description: |
          Caller assertion required to unlock actions/checkout's
          `allow-unsafe-pr-checkout` opt-in. Set to `true` ONLY if
          the caller has its own authorization gate in front of
          this workflow -- e.g. a `pull_request_target` pipeline
          whose `authorize` job pins the run to a GitHub
          Environment that requires maintainer review before the
          fork's `ref` is fetched. Without such a gate, leaving
          this false keeps the `pull_request_target` + fork-ref
          combination blocked at checkout time (the guard
          described at https://gh.io/securely-using-pull_request_target).
        required: false
        type: boolean
        default: false
      container_image_prefix:
        description: |
          Registry path (registry/namespace/repo, no tag) where the Kairos
          OS container image was pushed. Combined with the tag suffix
          `<flavor>-<flavor_release>-<variant>-<arch>-<model>-<sha>` to
          form the IMAGE_NAME ginkgo tests docker-pull from inside the VM.

          The literal `${flavor}` (bash brace syntax) is expanded to the
          flavor derived from base_image; use it when each flavor lives
          in its own repo, e.g.
              container_image_prefix: 'ghcr.io/kairos-io/kairos/${flavor}'
          which produces ghcr.io/kairos-io/kairos/hadron for the hadron
          base image and ghcr.io/kairos-io/kairos/ubuntu for ubuntu.

          Default matches the pre-monorepo image-pr.yaml / release.yaml
          shape, which puts every flavor in one ci-temp-images repo and
          disambiguates via the tag.
        required: false
        type: string
        default: 'quay.io/kairos/ci-temp-images'
      kcrypt_challenger_image:
        description: |
          Fully-qualified image reference for the kcrypt-challenger
          Deployment the encryption suite spins up (e.g.
          `ghcr.io/kairos-io/kairos/kcrypt-challenger:pr-1234`). Only
          consumed by encryption-* tests; the script errors out if the
          test is encryption-* and this is empty.
        required: false
        type: string
        default: ''

    secrets:
      QUAY_USERNAME:
        description: |
          Registry user for quay.io/kairos/ci-temp-images. Needs WRITE, not just
          read: this workflow pulls the image under test and also pushes a
          bundles-test image back to the same repository.
        required: true
      QUAY_PASSWORD:
        description: "Registry token matching QUAY_USERNAME. Same write scope."
        required: true

jobs:
  test:  # decentralized k8s needs to run in github hosted workers for network stuff to work
    runs-on: ${{ inputs.test == 'provider-decentralized-k8s' && 'ubuntu-24.04' || 'fast' }}
    name: ${{ inputs.test }}${{ inputs.secureboot == true && ' - SecureBoot' || '' }}
    steps:
      - name: Split base image
        id: split
        run: |
          # Split base image for tag generation
          BASE_IMAGE=$(echo "${{ inputs.base_image }}" | cut -d ':' -f 1)
          BASE_TAG=$(echo "${{ inputs.base_image }}" | cut -d ':' -f 2 || echo 'latest')
          # Handle special cases for base images with slashes
          # Handle base images with slashes (registry paths)
          # Examples:
          # - ubuntu:24.04 -> FLAVOR=ubuntu, FLAVOR_RELEASE=24.04
          # - opensuse/leap:15.6 -> FLAVOR=opensuse, FLAVOR_RELEASE=leap-15.6
          # - ghcr.io/kairos-io/hadron:main -> FLAVOR=hadron, FLAVOR_RELEASE=main
          if [[ "$BASE_IMAGE" == *"/"* ]]; then
            DISTRO=$(echo "$BASE_IMAGE" | cut -d '/' -f 1)
            SUB_DISTRO=$(echo "$BASE_IMAGE" | cut -d '/' -f 2)
            FLAVOR="$DISTRO"
            FLAVOR_RELEASE="$SUB_DISTRO-$BASE_TAG"
            # Count number of slashes to determine if it's a registry path
            SLASH_COUNT=$(echo "$BASE_IMAGE" | tr -cd '/' | wc -c)
            if [[ $SLASH_COUNT -eq 1 ]]; then
              # Simple case: distro/subdistro (preserve existing behavior)
              DISTRO=$(echo "$BASE_IMAGE" | cut -d '/' -f 1)
              SUB_DISTRO=$(echo "$BASE_IMAGE" | cut -d '/' -f 2)
              FLAVOR="$DISTRO"
              FLAVOR_RELEASE="$SUB_DISTRO-$BASE_TAG"
            else
              # Registry path with multiple slashes: extract last component as FLAVOR
              # e.g., ghcr.io/kairos-io/hadron -> FLAVOR=hadron
              FLAVOR=$(echo "$BASE_IMAGE" | awk -F'/' '{print $NF}')
              FLAVOR_RELEASE="$BASE_TAG"
            fi
          else
            # No slashes: simple image name
            FLAVOR="$BASE_IMAGE"
            FLAVOR_RELEASE="$BASE_TAG"
          fi

          # For latest download remove the 'v' prefix if present
          FLAVOR_RELEASE_LATEST=$(echo "$FLAVOR_RELEASE" | sed 's/^v//')
          echo "flavor_release_latest=$FLAVOR_RELEASE_LATEST" >> $GITHUB_OUTPUT
          echo "flavor=$FLAVOR" >> $GITHUB_OUTPUT
          echo "flavor_release=$FLAVOR_RELEASE" >> $GITHUB_OUTPUT

          echo "Flavor: $FLAVOR"
          echo "Flavor Release: $FLAVOR_RELEASE"
          echo "Flavor Release Latest: $FLAVOR_RELEASE_LATEST"
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
          allow-unsafe-pr-checkout: ${{ inputs.caller-vetted-ref }}
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        timeout-minutes: 5
        with:
          go-version-file: tests/go.mod
          cache-dependency-path: tests/go.sum
          cache: ${{ runner.environment == 'self-hosted' && 'false' || 'true' }}
      - name: Set up Docker Buildx for public runners
        if: runner.environment == 'github-hosted'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          driver-opts: network=host
      - name: Set up Docker Buildx for custom runners
        if: runner.environment == 'self-hosted'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["registry.docker-mirror.svc.cluster.local:5000"]
            [registry."registry.docker-mirror.svc.cluster.local:5000"]
              insecure = true
              http = true
      - name: Login to Quay Registry
        # Only the bundles test actually pushes to quay -- it builds
        # a per-run bundles-test image and pushes it to
        # quay.io/kairos/ci-temp-images:bundles-test (see "Prepare
        # test bundle" step below). Every other cell either pulls
        # nothing at CI level or reaches public quay repos
        # (luet's quay.io/kairos/packages) which need no login. The
        # OS image lives at ghcr.io/kairos-io/kairos/${flavor} now,
        # not at ci-temp-images, so IMAGE_NAME pulls from ghcr
        # inside the VM and needs no CI-level quay creds either.
        if: inputs.test == 'bundles'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      - name: Block all traffic to metadata ip  # For cloud runners, the metadata ip can interact with our test machines
        if: runner.environment == 'self-hosted'
        run: |
          sudo iptables -I INPUT -s 169.254.169.254 -j DROP
          sudo iptables -I OUTPUT -d 169.254.169.254 -j DROP
      - name: Enable KVM group perms
        run: |
          sudo apt-get update
          sudo apt-get install -y libvirt-clients libvirt-daemon-system libvirt-daemon virtinst bridge-utils qemu-system-x86 qemu-utils acl udev mkisofs swtpm ovmf curl
          sudo setfacl -m u:runner:rwx /dev/kvm
      - name: Encryption deps
        if: ${{ startsWith(inputs.test, 'encryption-') }}
        run: |
          curl -L  https://github.com/mudler/luet/releases/download/0.33.0/luet-0.33.0-linux-amd64 -o luet
          chmod +x luet
          sudo mv luet /usr/bin/luet
          sudo mkdir -p /etc/luet/repos.conf.d/
          sudo luet repo add -y kairos --url quay.io/kairos/packages --type docker
          LUET_NOLOCK=true sudo -E luet install -y container/kubectl utils/k3d
      - name: Install cinc-auditor and openssh-client for the DevSec ssh-baseline profile
        # cinc-auditor is a FOSS drop-in for chef/inspec (InSpec >= 5 is no
        # longer under an OSS licence). It runs the profile from
        # https://github.com/dev-sec/ssh-baseline against the booted VM over
        # SSH; nothing gets installed inside the image. openssh-client
        # gives us ssh-keygen (for the ephemeral test key) and ssh (for
        # the post-install readiness probe) — the self-hosted runners
        # don't ship it by default.
        if: ${{ inputs.test == 'ssh-hardening' }}
        run: |
          sudo apt-get install -y openssh-client
          curl -L https://omnitruck.cinc.sh/install.sh | sudo bash -s -- -P cinc-auditor
          cinc-auditor --version
      - name: Setup bridge network for VM-to-VM communication
        if: inputs.use_bridge_network
        run: |
          # Start libvirtd service
          sudo systemctl start libvirtd
          # Start the default network (creates virbr0)
          sudo virsh net-start default || true
          # Allow virbr0 in QEMU bridge helper
          sudo mkdir -p /etc/qemu
          echo "allow virbr0" | sudo tee /etc/qemu/bridge.conf
          # Set setuid on qemu-bridge-helper so it can create tap devices
          sudo chmod u+s /usr/lib/qemu/qemu-bridge-helper
          # Verify virbr0 exists
          ip link show virbr0
      - name: Find OVMF firmware
        if: inputs.secureboot == true
        uses: ./.github/actions/find-ovmf-firmware
        with:
          prefer_secboot: true
        id: find_ovmf
      - name: Set Image tag
        env:
          PREFIX_TEMPLATE: ${{ inputs.container_image_prefix }}
          FLAVOR: ${{ steps.split.outputs.flavor }}
          FLAVOR_RELEASE: ${{ steps.split.outputs.flavor_release }}
          VARIANT: ${{ inputs.variant }}
          ARCH: ${{ inputs.arch }}
          MODEL: ${{ inputs.model }}
          SHA: ${{ github.sha }}
        run: |
          # Expand the literal `${flavor}` token in the caller-provided
          # prefix. Callers that don't use the token (or take the
          # default) pass through unchanged.
          PREFIX="${PREFIX_TEMPLATE//\$\{flavor\}/$FLAVOR}"
          echo "IMAGE_NAME=${PREFIX}:${FLAVOR}-${FLAVOR_RELEASE}-${VARIANT}-${ARCH}-${MODEL}-${SHA}" >> "$GITHUB_ENV"
      - name: Download artifacts
        if: ${{ inputs.test != 'upgrade-latest-with-cli' && inputs.test != 'provider-upgrade-latest-k8s-with-kubernetes' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kairos-${{ steps.split.outputs.flavor }}-${{ steps.split.outputs.flavor_release }}-${{ inputs.variant }}-${{ inputs.arch }}-${{ inputs.model }}.iso.zip
      - name: Download latest release
        uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f # v1.13
        if: ${{ (inputs.test == 'upgrade-latest-with-cli' || inputs.test == 'provider-upgrade-latest-k8s-with-kubernetes') && inputs.release-matcher == '' }}
        with:
          latest: true
          fileName: kairos-${{ steps.split.outputs.flavor }}-${{ steps.split.outputs.flavor_release_latest }}-${{ inputs.test == 'provider-upgrade-latest-k8s-with-kubernetes' && 'standard' || 'core'}}-${{ inputs.arch }}-${{ inputs.model }}-*${{ inputs.test == 'provider-upgrade-latest-k8s-with-kubernetes' && 'k3sv*' || ''}}.iso
          out-file-path: ""
      - name: Download latest release with release matcher
        uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f # v1.13
        if: ${{ (inputs.test == 'upgrade-latest-with-cli' || inputs.test == 'provider-upgrade-latest-k8s-with-kubernetes') && inputs.release-matcher != '' }}
        with:
          latest: true
          fileName: ${{ inputs.release-matcher }}
          out-file-path: ""
      - name: Prepare test bundle
        if: ${{ inputs.test == 'bundles' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: examples/bundle/Dockerfile
          platforms: linux/${{ inputs.arch }}
          push: true
          tags: quay.io/kairos/ci-temp-images:bundles-test
          # https://docs.redhat.com/en/documentation/red_hat_quay/3.4/html/use_red_hat_quay/working_with_tags#tag-expiration
          labels: |
            quay.expires-after=6h
      - name: Run tests
        if: ${{ !startsWith(inputs.test, 'encryption-') }}
        env:
          MEMORY: 5000
          DRIVE_SIZE: 50000
          CPUS: 4
          CONTAINER_IMAGE: ${{ env.IMAGE_NAME }}
          USE_BRIDGE_NETWORK: ${{ inputs.use_bridge_network && '1' || '' }}
        run: |
          if [ "${{ inputs.secureboot }}" = "true" ]; then
            export FIRMWARE=${{ steps.find_ovmf.outputs.firmware }}
            echo "Secure boot enabled, setting firmware to $FIRMWARE"
          fi
          export ISO=$PWD/$(ls *.iso|grep -v ipxe | head -1 )
          echo "ISO is: $ISO"
          pushd tests
          go mod download
          go run github.com/onsi/ginkgo/v2/ginkgo -v --label-filter "${{ inputs.test }}" --fail-fast -r ./...
          popd
      - name: Run encryption tests
        if: ${{ startsWith(inputs.test, 'encryption-') }}
        env:
          LABEL: ${{ inputs.test }}
          MEMORY: 6000
          CPUS: 2
          DRIVE_SIZE: 50000
          CONTAINER_IMAGE: ${{ env.IMAGE_NAME }}
          KCRYPT_CHALLENGER_IMAGE: ${{ inputs.kcrypt_challenger_image }}
        run: |
          # Pick a k3s image
          export ISO=$PWD/$(ls *.iso|grep -v ipxe | grep k3s | head -1 )
          .github/encryption-tests.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: ${{ steps.split.outputs.flavor }}-${{ steps.split.outputs.flavor_release }}-${{ inputs.variant }}-${{ inputs.test }}.logs.zip
          path: tests/**/logs/*
          if-no-files-found: warn
