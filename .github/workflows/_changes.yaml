name: Detect changes

# Reusable step: says which parts of the repository a pull request or merge
# queue entry reaches, so that the jobs that only matter for one part can be
# skipped. The rules live in scripts/changed-parts.sh.
#
# kairos: the change can affect the Kairos images and their tests. It is false
# for Markdown, the docs, the license and templates, and the AuroraBoot web UI
# and Helm chart, none of which ends up in an image or an ISO.
#
# auroraboot: the change can affect AuroraBoot: auroraboot/ itself, the root
# packages it imports, tests included (sdk/, agent/pkg/, agent/tests/ and
# internal/version/, see `go list -deps -test` in auroraboot/), the root go.mod
# and go.sum, and the workflows and actions that run its tests.
#
# A skipped job of a reusable workflow does not report the check names it
# declares, so a branch rule must wait for the single job that gates the whole
# workflow (pr.yaml has one) and not for the checks of the jobs skipped here.

on:
  workflow_call:
    outputs:
      kairos:
        description: '"true" when the Kairos image and test jobs have to run'
        value: ${{ jobs.changes.outputs.kairos }}
      auroraboot:
        description: '"true" when the AuroraBoot jobs have to run'
        value: ${{ jobs.changes.outputs.auroraboot }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      kairos: ${{ steps.filter.outputs.kairos }}
      auroraboot: ${{ steps.filter.outputs.auroraboot }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: List the changed files
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ]; then
            echo "No base commit for this event, running everything."
            { echo "kairos=true"; echo "auroraboot=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed files:"
          git diff --name-only --no-renames "$BASE_SHA" HEAD
          scripts/changed-parts.sh "$BASE_SHA" | tee -a "$GITHUB_OUTPUT"
