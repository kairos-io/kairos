name: Build Examples

on:
  push:
    paths:
      - 'examples/builds/**'

# This workflow only checks out code and builds a Dockerfile locally
# (push: is not set on docker/build-push-action, so nothing is
# pushed). It needs no write scope at all.
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.example-dir }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example-dir:
          - "fedora-fips"
          - "rockylinux-fips"
          - "ubuntu-non-hwe"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4
        with:
          driver-opts: network=host
      - name: Build Dockerfile
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          file: examples/builds/${{ matrix.example-dir }}/Dockerfile
          context: examples/builds/${{ matrix.example-dir }}
