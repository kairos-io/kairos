name: Lint

# Reusable step: workflow-file linting via the in-tree
# reusable-linting.yaml (absorbed from the archived
# kairos-io/linting-composite-action repo), extended with a `ref`
# input so the composite's own checkout can be pointed at the PR
# HEAD when this pipeline runs under pull_request_target. Wired as
# a hard gate before the image-build jobs in every pipeline; a red
# lint suite blocks image push, same shape unit-tests has.

on:
  workflow_call:
    inputs:
      ref:
        description: 'git ref to check out (defaults to the trigger event ref)'
        type: string
        required: false
        default: ''
      caller-vetted-ref:
        description: |
          Caller assertion required to unlock actions/checkout's
          `allow-unsafe-pr-checkout` opt-in inside the nested lint
          reusable. Set to `true` ONLY if the caller has its own
          authorization gate in front of this workflow -- e.g. a
          `pull_request_target` pipeline whose `authorize` job pins
          the run to a GitHub Environment that requires maintainer
          review before the fork's `ref` is fetched. Without such a
          gate, leaving this false keeps the `pull_request_target`
          + fork-ref combination blocked at checkout time (the
          guard described at
          https://gh.io/securely-using-pull_request_target).
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/reusable-linting.yaml
    with:
      yamldirs: '.github/workflows/'
      is-go: false
      ref: ${{ inputs.ref }}
      caller-vetted-ref: ${{ inputs.caller-vetted-ref }}
