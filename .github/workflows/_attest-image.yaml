name: Sign and attest image

# Reusable step: signs a pushed image by digest with cosign (keyless,
# through the Sigstore public instance) and attests its build provenance
# with a GitHub artifact attestation. Part of kairos-io/kairos#215, items
# 1.5 and 2.2.
#
# This is the only job that holds an OIDC token. The build job that
# pushed the image has none, and this job checks out and runs no code
# from the repository, so build steps never reach the signing material.
#
# Call it from the top workflow, not from inside a build workflow: GitHub
# checks the permissions of a nested job when the run starts, even if an
# `if:` skips it, so callers that do not grant `id-token: write` (the PR
# pipelines) would fail to start.
#
# Verify with:
#   cosign verify <image>:<tag> \
#     --certificate-identity-regexp '^https://github.com/kairos-io/kairos/.github/workflows/_attest-image.yaml@' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#   gh attestation verify oci://<image>:<tag> --owner kairos-io \
#     --signer-workflow kairos-io/kairos/.github/workflows/_attest-image.yaml

on:
  workflow_call:
    inputs:
      image:
        description: 'Image name without tag or digest, e.g. quay.io/kairos/kairos-init'
        type: string
        required: true

      digest:
        description: 'Digest of the pushed image index, as sha256:<hex>'
        type: string
        required: true

      registry_login:
        description: '"ghcr" | "quay": registry to log in to, to push the signature and attestation'
        type: string
        required: true
    secrets:
      QUAY_USERNAME:
        description: 'quay.io user, needed only for quay.io'
        required: false
      QUAY_PASSWORD:
        description: 'quay.io password, needed only for quay.io'
        required: false

permissions: {}

jobs:
  attest:
    permissions:
      id-token: write  # keyless cosign signature and attestation
      attestations: write
      artifact-metadata: write  # storage record for push-to-registry
      packages: write  # push signature and attestation to ghcr.io
    runs-on: ubuntu-latest
    steps:
      - name: Check inputs
        env:
          DIGEST: ${{ inputs.digest }}
          REGISTRY_LOGIN: ${{ inputs.registry_login }}
        run: |
          set -euo pipefail
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::digest must be sha256:<64 hex>, got '$DIGEST'"
            exit 1
          fi
          if [[ "$REGISTRY_LOGIN" != "ghcr" && "$REGISTRY_LOGIN" != "quay" ]]; then
            echo "::error::registry_login must be ghcr or quay, got '$REGISTRY_LOGIN'"
            exit 1
          fi

      - name: Login to ghcr.io
        if: inputs.registry_login == 'ghcr'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to quay.io
        if: inputs.registry_login == 'quay'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3
        with:
          cosign-release: "v3.1.4"

      # By digest, so a tag moved between push and sign cannot get the
      # signature.
      - name: Sign image with cosign
        env:
          COSIGN_YES: true
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ inputs.digest }}
        run: cosign sign "$IMAGE@$DIGEST"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ inputs.image }}
          subject-digest: ${{ inputs.digest }}
          push-to-registry: true
