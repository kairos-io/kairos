name: 'Build AMD64 images (PR)'

# GitHub does not pass secrets to a workflow triggered by `pull_request` from a
# fork, so an outside contributor's build fails at the registry login and every
# job after it skips. `pull_request_target` does pass them, which is why the
# approval gate below has to come with it. Background: issue #4307.
#
# `fork-pr-builds` already exists with the maintainers team as required
# reviewers. It was created on 2026-08-13, alongside the factory `ref` input
# this depends on, and this workflow is what finally uses it.
#
# Do not rename it to something that does not exist. GitHub creates a
# referenced environment implicitly and with no protection rules, so a typo
# here fails open: every fork pull request would get the secrets and nothing
# would gate it.

on:
  pull_request_target:

permissions:
  contents: write
  security-events: write
  id-token: write
  actions: read
concurrency:
  group: ci-pr-amd64-${{ github.head_ref || github.ref }}-${{ github.repository }}
  cancel-in-progress: true
jobs:
  # Nothing else in this workflow starts until this job does. A pull request
  # from a fork lands in `fork-pr-builds` and waits for a maintainer; a
  # same-repo pull request lands in `internal` and goes straight through, so
  # maintainer and renovate branches keep running unattended.
  #
  # `internal` carries no protection rules on purpose. It exists only because
  # the environment name has to resolve to something on both paths.
  #
  # The job itself does nothing. The environment is the gate, and a reviewer
  # approving it is a person saying they have read the diff they are about to
  # run with the ci-temp-images credentials.
  authorize:
    name: authorize
    environment: ${{ github.event.pull_request.head.repo.full_name != github.repository && 'fork-pr-builds' || 'internal' }}
    runs-on: ubuntu-latest
    steps:
      - run: 'true'

  build:
    name: ${{ matrix.image_name }}
    needs: authorize
    uses: kairos-io/kairos-factory-action/.github/workflows/reusable-factory.yaml@9bf6ee71187036eb832f28c29f0c699507bc1ca3 # v1.4.1
    secrets:
      # The PR path only ever writes quay.io/kairos/ci-temp-images, so it uses
      # the kairos+prci robot, which has Write on that repository and nothing
      # else. QUAY_USERNAME/QUAY_PASSWORD is the credential release.yaml uses to
      # publish permanent images and does not belong on a PR path.
      registry_username: ${{ secrets.QUAY_PR_USERNAME }}
      registry_password: ${{ secrets.QUAY_PR_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: "hadron"
            base_image: "ghcr.io/kairos-io/hadron:v0.5.1"
            kubernetes_distro: ""
            custom_job_name_format: "core-amd64-generic"
          - image_name: "hadron"
            base_image: "ghcr.io/kairos-io/hadron:v0.5.1"
            kubernetes_distro: "k3s"
            custom_job_name_format: "standard-amd64-generic-k3s"
    with:
      # pull_request_target's context is the base branch, so the ref has to be
      # named explicitly or this would build master and test nothing.
      ref: refs/pull/${{ github.event.pull_request.number }}/head
      auroraboot_version: "v0.26.2"
      dockerfile_path: "images/Dockerfile"
      base_image: ${{ matrix.base_image }}
      model: "generic"
      arch: "amd64"
      version: "auto"
      iso: true
      grype: true
      # Report-only: the scan still runs and reports, but criticals from the
      # upstream base image must not block PRs. Mirrors master / release builds.
      security_scan_mode: "report-only"
      registry_domain: "quay.io"
      registry_namespace: "kairos"
      registry_repository: "ci-temp-images"
      custom_tag_format: "$FLAVOR-$FLAVOR_RELEASE-$VARIANT-$ARCH-$MODEL-$COMMIT_SHA"
      custom_artifact_format: "kairos-$FLAVOR-$FLAVOR_RELEASE-$VARIANT-$ARCH-$MODEL"
      custom_job_name_format: ${{ matrix.custom_job_name_format }}
      image_labels: "quay.expires-after=6h"
      summary_artifacts: true
      kubernetes_distro: ${{ matrix.kubernetes_distro }}
  core-tests:
    name: ${{ format('core-tests (hadron, amd64, generic) {0}', matrix.test) }}
    # Explicit rather than `secrets: inherit`, and scoped to the ci-temp-images
    # robot. These jobs boot an image built from the pull request under review;
    # they pull it from ci-temp-images and push a bundles-test image back there,
    # so Write on that one repository is all they need.
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_PR_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PR_PASSWORD }}
    uses: ./.github/workflows/reusable-qemu-test.yaml
    with:
      ref: refs/pull/${{ github.event.pull_request.number }}/head
      base_image: "ghcr.io/kairos-io/hadron:v0.5.1"
      test: ${{ matrix.test }}
      secureboot: false
      release-matcher: ${{ matrix.release-matcher || '' }}
      variant: "core"
      arch: "amd64"
      model: "generic"
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        include:
          - test: "custom-partitioning"
          - test: "acceptance"
          - test: "install"
          - test: "install-target"
          - test: "reset"
          - test: "upgrade-with-cli"
          - test: "bundles"
          - test: "ssh-hardening"
          - test: "upgrade-latest-with-cli"
            release-matcher: "kairos-hadron-*-core-amd64-generic-v*.iso"
  standard-tests:
    name: ${{ format('standard-tests (hadron, amd64, generic) {0}', matrix.test) }}
    uses: ./.github/workflows/reusable-qemu-test.yaml
    # Explicit rather than `secrets: inherit`, and scoped to the ci-temp-images
    # robot. These jobs boot an image built from the pull request under review;
    # they pull it from ci-temp-images and push a bundles-test image back there,
    # so Write on that one repository is all they need.
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_PR_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PR_PASSWORD }}
    permissions:
      contents: write
      security-events: write
      id-token: write
      actions: read
      attestations: read
      checks: read
      deployments: read
      discussions: read
      issues: read
      packages: read
      pages: read
      pull-requests: read
      repository-projects: read
      statuses: read
    with:
      ref: refs/pull/${{ github.event.pull_request.number }}/head
      base_image: "ghcr.io/kairos-io/hadron:v0.5.1"
      test: ${{ matrix.test }}
      variant: "standard"
      arch: "amd64"
      model: "generic"
      kubernetes_distro: "k3s"
      use_bridge_network: ${{ matrix.test == 'provider-decentralized-k8s' }}
      release-matcher: ${{ matrix.release-matcher || '' }}
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        include:
          - test: "provider-qrcode-install"
          - test: "provider-upgrade"
          - test: "provider-upgrade-k8s"
          - test: "provider-decentralized-k8s"
          - test: "provider-k3s-disabled"
          - test: "encryption-local"
          - test: "encryption-remote-auto"
          - test: "encryption-remote-static"
          - test: "encryption-remote-https-pinned"
          - test: "encryption-remote-https-bad-cert"
          - test: "encryption-kcrypt-cli"
          - test: "provider-upgrade-latest-k8s-with-kubernetes"
            release-matcher: "kairos-hadron-*-standard-amd64-generic-*k3sv*.iso"
  size-diff:
    name: iso-size-diff
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Download PR ISOs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "kairos-hadron-*-amd64-generic.iso.zip"
          path: candidate
      - name: Download last master ISOs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow image-master.yaml --branch master --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [[ -z "$run_id" ]]; then
            echo "No successful master build found; reporting PR sizes only."
            exit 0
          fi
          echo "Using master build $run_id as the size baseline."
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
            --pattern "kairos-hadron-*-amd64-generic.iso.zip" \
            --dir baseline || echo "Baseline artifacts unavailable (expired?)."
      - name: Compare ISO sizes
        run: scripts/iso-size-diff.sh baseline candidate | tee -a "$GITHUB_STEP_SUMMARY"
