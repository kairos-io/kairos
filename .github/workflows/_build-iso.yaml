name: Build ISO

# Reusable step: build a single Kairos OS ISO/UKI via the in-tree
# reusable-factory.yaml (absorbed from the archived
# kairos-io/kairos-factory-action repo), using the caller-supplied
# kairos-init container image. This is the "connect the fresh
# kairos-init to the ISO build" step -- the caller passes the exact
# image reference the build-image-kairos-init step just published,
# and this step overrides images/Dockerfile's KAIROS_INIT_IMAGE ARG
# so the ISO embeds it.
#
# Single-cell by design: the caller expands the matrix over base_image
# / kubernetes_distro / trusted_boot / iso-vs-uki with a strategy.matrix
# on its own job that `uses:` this reusable, which is the shape GitHub
# Actions supports cleanly.

on:
  workflow_call:
    inputs:
      name:
        description: 'Display name for this cell in the workflow run UI'
        type: string
        required: true

      kairos_init_image:
        description: 'Full image reference for kairos-init, e.g. quay.io/kairos/kairos-init:v4.4.0 or ghcr.io/kairos-io/kairos/kairos-init:pr-42'
        type: string
        required: true

      kairos_init_artifact:
        description: |
          Name of a workflow artifact holding kairos-init as an OCI layout
          tarball (_build-image-kairos-init.yaml's oci_artifact). When
          set, `kairos_init_image` is not pulled: it becomes the build
          context name the layout is bound to, so any name works, e.g.
          `kairos-init-local`. The PR pipeline uses this because it has
          no registry to pull from.
        type: string
        default: ''

      security_scans:
        description: |
          Run the trivy and grype scans and upload their SARIF reports.
          The PR pipeline turns this off: a pull_request run from a fork
          gets a read-only token, so the SARIF upload cannot succeed, and
          master already scans every image that lands.
        type: boolean
        default: true

      arch:
        description: 'linux/<arch>: amd64, arm64, or riscv64'
        type: string
        required: true

      base_image:
        description: 'Base OCI image the Kairos flavor is built on top of'
        type: string
        required: true

      model:
        description: 'Kairos model: generic, rpi4, etc.'
        type: string
        default: 'generic'

      iso:
        description: 'Produce an ISO artifact'
        type: boolean
        default: false

      trusted_boot:
        description: 'Build a trusted-boot UKI instead of the standard ISO layout'
        type: boolean
        default: false

      kubernetes_distro:
        description: 'k3s | k0s | empty'
        type: string
        default: ''

      kubernetes_version:
        description: 'Specific k8s version or "auto"'
        type: string
        default: 'auto'

      registry_domain:
        type: string
        default: 'quay.io'

      registry_namespace:
        type: string
        default: 'kairos'

      registry_repository:
        description: |
          Optional override for the repository segment of the push
          target. Factory-action defaults it to the base_image FLAVOR
          (e.g. "hadron" -> ghcr.io/kairos-io/kairos/hadron), which
          creates a per-flavor org package. For flavors whose
          per-flavor package does not exist yet (e.g. ubuntu-based
          NVIDIA cells), the caller can point this at an existing
          catch-all repo like "ci-temp-images" on quay.
        type: string
        default: ''

      release:
        description: 'Whether factory-action should attach ISO artifacts to the GH Release'
        type: boolean
        default: false

      # Model-specific factory-action knobs. Defaults match what
      # the generic amd64/arm64 cells want; the rpi and nvidia
      # cells override.
      raw:
        description: 'Produce a raw disk image (rpi3/rpi4 need this)'
        type: boolean
        default: false
      grype:
        description: 'Run grype security scan (nvidia bases have too many L4T vulns to enforce)'
        type: boolean
        default: true
      sbom:
        description: 'Attach an SBOM to the image (nvidia jetson bases contain non-cataloguable binaries)'
        type: boolean
        default: true
      cleanup:
        description: 'Have factory-action free space on the runner before building (nvidia builds need this because L4T rootfs is huge)'
        type: boolean
        default: false

      fips:
        description: |
          Build the FIPS-flavored image. Passes FIPS=fips to
          images/Dockerfile so kairos-init installs the FIPS variant of
          the multi-call kairos binary. Caller must also point base_image
          at a FIPS-hardened base (e.g. ghcr.io/kairos-io/hadron-fips)
          for the resulting image to be end-to-end FIPS-capable; passing
          this flag alone against a non-FIPS base produces a partial-FIPS
          image and defeats the point.
        type: boolean
        default: false

      test_sysext_overlay:
        description: |
          Bake the CI-only sysext test extensions onto the ISO as
          auroraboot's --overlay-iso tree. Explicit opt-in: default
          false so a release caller cannot accidentally leak the test
          extensions into a shipped ISO. The extensions are generated per
          build. Trusted boot cells get a work extension signed with the
          key set generated for the run (the UKI cell enrolls its
          certificate into the Secure Boot db, so the kernel accepts the
          verity root-hash signature) plus the hello-broke extension the
          image policy rejects; a plain GRUB cell enrolls nothing, so it
          gets a verity-only work extension.
          The extensions are what tests/sysext_live_media_test.go and
          tests/uki_test.go's boot-assessment spec assert on.
        type: boolean
        default: false

      single_efi_cmdline:
        description: |
          Bake an extra single-EFI boot entry into the UKI, in
          `name: kernel-cmdline` form. The install-upgrade qemu test
          upgrades this entry to verify UKI upgrade semantics; pass
          `testentry: nothing` on PR/master so the test finds the
          entry. Release builds leave it empty so no test-only boot
          entry ships in a released ISO. Factory-action ignores
          this input when trusted_boot is false.
        type: string
        default: ''

      custom_tag_format:
        description: |
          Factory-action custom_tag_format for the pushed OS image.
          The default matches what reusable-qemu-test.yaml and
          _uki-test.yaml resolve to (`$FLAVOR-` prefix so tests find
          the fresh image); release.yaml overrides this to drop the
          prefix and match the tag shape v4.2.0 shipped.
          $K8S expands to `-$KUBERNETES_DISTRO-$SANITIZED_KUBERNETES_VERSION`
          when a k8s pair is set and empty otherwise; $VERSION is
          factory-action's `git describe --tags --dirty --always`.
        type: string
        default: '$FLAVOR-$FLAVOR_RELEASE-$VARIANT-$ARCH-$MODEL$K8S-$VERSION$UKI'

      custom_artifact_format:
        description: |
          Factory-action custom_artifact_format for the ISO/RAW files
          produced by the build. The default matches what
          reusable-qemu-test.yaml downloads
          (kairos-$FLAVOR-$FLAVOR_RELEASE-$VARIANT-$ARCH-$MODEL$UKI).
          release.yaml overrides this to add $K8S and $VERSION so
          per-k8s-version cells no longer collide on the same filename
          (v4.3.0-rc3 had every k3s/k0s cell writing to
          `kairos-hadron-v0.5.1-standard-amd64-generic.iso.zip`), and
          the release page names match v4.2.0's shape.
        type: string
        default: 'kairos-$FLAVOR-$FLAVOR_RELEASE-$VARIANT-$ARCH-$MODEL$UKI'

      ref:
        description: 'git ref to check out (passthrough to factory-action)'
        type: string
        required: false
        default: ''
      caller-vetted-ref:
        description: |
          Caller assertion required to unlock actions/checkout's
          `allow-unsafe-pr-checkout` opt-in inside factory-action.
          Set to `true` ONLY if the caller has its own authorization
          gate in front of this workflow -- e.g. a `pull_request_target`
          pipeline whose `authorize` job pins the run to a GitHub
          Environment that requires maintainer review before the fork's
          `ref` is fetched. Without such a gate, leaving this false keeps
          the `pull_request_target` + fork-ref combination blocked at
          checkout time (the guard described at
          https://gh.io/securely-using-pull_request_target).
        type: boolean
        required: false
        default: false

# No `secrets:` block on workflow_call: registry credentials are
# derived from inputs.registry_domain inside the job (ghcr.io ->
# github.actor + GITHUB_TOKEN, quay.io -> QUAY_USERNAME + QUAY_PASSWORD),
# which only works when the caller uses `secrets: inherit` so this
# reusable can see the org-level QUAY_* secrets.

permissions:
  # packages: write is required for factory-action's push to ghcr:
  # the GITHUB_TOKEN a reusable workflow receives is capped at the
  # permissions THIS workflow declares, not what the caller has, so
  # omitting it here scopes the token to packages:none and ghcr
  # answers "installation not allowed to Write organization package"
  # even when the linked package's Manage Actions access already
  # grants the repo write.
  contents: write
  packages: write
  id-token: write
  security-events: write
  actions: read

jobs:
  iso:
    name: ${{ inputs.name }}
    uses: ./.github/workflows/reusable-factory.yaml
    secrets:
      # ghcr.io accepts github.actor + GITHUB_TOKEN; the token is
      # write-scoped only for same-repo events (push, same-repo PR).
      # Fork PR jobs are gated off at the caller with an if: check.
      # quay.io uses the repo-level QUAY_USERNAME/QUAY_PASSWORD, which
      # reach this reusable only because callers pass `secrets: inherit`.
      registry_username: ${{ inputs.registry_domain == 'ghcr.io' && github.actor || secrets.QUAY_USERNAME }}
      registry_password: ${{ inputs.registry_domain == 'ghcr.io' && secrets.GITHUB_TOKEN || secrets.QUAY_PASSWORD }}
    with:
      ref: ${{ inputs.ref }}
      caller-vetted-ref: ${{ inputs.caller-vetted-ref }}
      auroraboot_version: 'v0.27.1'
      dockerfile_path: 'images/Dockerfile'
      # Point images/Dockerfile at the caller-supplied kairos-init.
      # This is what makes PRs / releases exercise the freshly-built
      # kairos-init rather than the ARG default in images/Dockerfile.
      # When `fips` is true the FIPS=fips build_arg switches
      # kairos-init to embed the FIPS variant of the multi-call binary.
      build_args: |
        KAIROS_INIT_IMAGE=${{ inputs.kairos_init_image }}
        ${{ inputs.fips && 'FIPS=fips' || '' }}
      oci_context_artifact: ${{ inputs.kairos_init_artifact }}
      oci_context_name: ${{ inputs.kairos_init_artifact != '' && inputs.kairos_init_image || '' }}
      base_image: ${{ inputs.base_image }}
      arch: ${{ inputs.arch }}
      model: ${{ inputs.model }}
      version: 'auto'
      no_cache: true
      registry_domain: ${{ inputs.registry_domain }}
      registry_namespace: ${{ inputs.registry_namespace }}
      registry_repository: ${{ inputs.registry_repository }}
      # Both formats are caller-supplied. Defaults keep the shape
      # reusable-qemu-test.yaml and _uki-test.yaml expect (tests
      # resolve by `$FLAVOR-`-prefixed tag and by kairos-$FLAVOR-...
      # filename). release.yaml overrides both to drop the prefix and
      # add $K8S/$VERSION so per-k8s-version cells no longer collide.
      custom_tag_format: ${{ inputs.custom_tag_format }}
      custom_artifact_format: ${{ inputs.custom_artifact_format }}
      trusted_boot: ${{ inputs.trusted_boot }}
      # Trusted boot test builds sign with a key set generated for this run,
      # and the test system extensions are built for this run too (signed
      # with that key set on trusted boot builds). Release builds never
      # enable trusted boot (internal/ciguard/release_test.go) and never
      # get the CI-only extensions, because test_sysext_overlay is pinned
      # off in release.yaml.
      generate_test_keys: ${{ inputs.trusted_boot && !inputs.release }}
      generate_test_sysext: ${{ inputs.test_sysext_overlay }}
      single_efi_cmdline: ${{ inputs.single_efi_cmdline }}
      iso: ${{ inputs.iso }}
      kubernetes_distro: ${{ inputs.kubernetes_distro }}
      kubernetes_version: ${{ inputs.kubernetes_version }}
      raw: ${{ inputs.raw }}
      grype: ${{ inputs.security_scans && inputs.grype }}
      grype_sarif: ${{ inputs.security_scans && inputs.grype }}
      trivy: ${{ inputs.security_scans }}
      trivy_sarif: ${{ inputs.security_scans }}
      sbom: ${{ inputs.sbom }}
      security_scan_mode: 'report-only'
      grype_sarif_fail_build: false
      cleanup: ${{ inputs.cleanup }}
      custom_job_name_format: ${{ inputs.name }}
      list_release_artifacts: ${{ inputs.release && inputs.iso }}
      cosign: ${{ inputs.release }}
      release: ${{ inputs.release && inputs.iso }}
