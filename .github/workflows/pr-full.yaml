name: PR full matrix

# The full test matrix on a pull request, on demand. This is the same
# pipeline master.yaml runs on every push to master; on a pull request
# it runs only when a maintainer asks for it. The default PR pipeline
# is pr.yaml, a secret-free smoke run that needs no approval.
#
# How to ask for it: add the `ci/full` label. The run builds and tests
# the head commit the PR had when the label was added. The `authorize`
# job removes the label again, so the label works as a button: add it
# again to test a later push.
#
# Trigger: pull_request_target, so that the jobs below get the registry
# secrets they need even for a PR from a fork. CodeQL flags this trigger
# as "Checkout of untrusted code in a privileged context" (codeql rules
# 441212, 441213, 441214). The mitigation is in three parts:
#
#   - only the `labeled` event starts this workflow. A push to the PR
#     does not, so nothing runs that a maintainer did not ask for;
#   - the `authorize` job fails unless the person who added the label
#     has write, maintain or admin access to this repository. The triage
#     role can add labels too, and it must not be enough;
#   - every checkout uses `github.event.pull_request.head.sha`, the
#     commit that was current when the label was added. A push after the
#     label changes refs/pull/<N>/head, but not what this run builds.
#
# Adding the label is the review. Read the diff before you add it, in
# particular any change under .github/, Makefile, scripts/ and Dockerfiles.
#
# Every reusable call below sets `caller-vetted-ref: true`. That is what
# unlocks actions/checkout's `allow-unsafe-pr-checkout` opt-in inside
# each reusable, and it is honest only because of the `authorize` gate.
# Do NOT drop the authorize job, or the codeql findings become real.

on:
  pull_request_target:
    types: [labeled]

permissions:
  # Least-privilege baseline. A job that calls a reusable workflow
  # needing more declares its own job-level `permissions:` matching
  # exactly what that callee needs -- see _build-iso.yaml for the
  # reusable-workflow rationale (callers must cover callee).
  contents: read

concurrency:
  # Deliberately a different group from pr.yaml's, so a push to the PR
  # does not cancel a full run that is in progress.
  group: ci-pr-full-${{ github.event.pull_request.number }}-${{ github.repository }}
  cancel-in-progress: true

jobs:
  # The gate. Nothing else starts until this job passes. It does not
  # check out any code from the PR.
  authorize:
    name: authorize
    if: github.event.label.name == 'ci/full'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Check the labeler has write access
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          set -euo pipefail
          perm=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$SENDER/permission" --jq .permission)
          echo "$SENDER has '$perm' access"
          case "$perm" in
            admin|maintain|write) ;;
            *)
              echo "::error::ci/full was added by $SENDER, who has '$perm' access. Only write, maintain or admin can start the full matrix."
              exit 1
              ;;
          esac
      - name: Remove the label
        # The label is a one-shot request for this commit. Removing it
        # lets the next maintainer add it again for a later push.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr edit --repo "$GITHUB_REPOSITORY" "$PR_NUMBER" --remove-label ci/full || true

  # Cheap change detector for the flavor pipe. The wide base-image
  # matrix in build-flavors is expensive per PR and only meaningful
  # when a PR touches the kairos-init binary, the provider binary it
  # invokes during standard-variant cells, the sdk/bus contract they
  # exchange, its build machinery, or the workflow files that drive
  # its build. This job outputs a single boolean the flavor pipe
  # gates on; everything else is unaffected.
  changes:
    needs: authorize
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      flavor: ${{ steps.filter.outputs.flavor }}
    steps:
      - name: Detect flavor-relevant paths
        id: filter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          changed=$(gh pr diff --repo "$GITHUB_REPOSITORY" "$PR_NUMBER" --name-only)
          echo "Changed files:"
          echo "$changed"
          # Paths whose diff can plausibly change what the flavor
          # matrix builds:
          #   - kairos-init/ : the binary being tested;
          #   - provider/    : agent-provider-kairos is invoked
          #                    over the go-pluggable bus for
          #                    standard-variant (k3s/k0s) cells
          #                    during kairos-init's build run;
          #   - sdk/         : the bus event payloads the provider
          #                    and kairos-init exchange;
          #   - scripts/, Makefile, go.mod, go.sum : root build
          #                    machinery and Go module state;
          #   - the flavor / kairos / kairos-init reusable
          #     workflows themselves.
          if echo "$changed" | grep -qE '^(kairos-init/|provider/|sdk/|scripts/|Makefile$|go\.(mod|sum)$|\.github/workflows/_build-(flavors|kairos|kairos-init)\.yaml$)'; then
            echo "flavor=true" >> "$GITHUB_OUTPUT"
          else
            echo "flavor=false" >> "$GITHUB_OUTPUT"
          fi

  unit-tests:
    needs: authorize
    uses: ./.github/workflows/_unit-tests.yaml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      caller-vetted-ref: true
    secrets: inherit

  lint:
    needs: authorize
    uses: ./.github/workflows/_lint.yaml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      caller-vetted-ref: true
    secrets: inherit

  # The kairos-init pipe (multi-call kairos -> kairos-init -> image ->
  # iso -> qemu). This is the critical path for the qemu suites below.
  build-kairos:
    needs: authorize
    uses: ./.github/workflows/_build-kairos.yaml
    with:
      matrix_scope: ci
      ref: ${{ github.event.pull_request.head.sha }}
      caller-vetted-ref: true
    secrets: inherit

  build-kairos-init:
    needs: build-kairos
    uses: ./.github/workflows/_build-kairos-init.yaml
    with:
      matrix_scope: ci
      ref: ${{ github.event.pull_request.head.sha }}
      caller-vetted-ref: true
    secrets: inherit

  # Flavor smoke matrix. For every supported base OS (ubuntu
  # 24.04/25.10/26.04, debian 12/13, fedora 42/43, alpine, opensuse
  # leap/tumbleweed, rockylinux/almalinux/oracle 9+10, centos stream,
  # sle-micro) plus variant cells (k3s/k0s, FIPS, trusted-boot, nvidia
  # jetson, rpi4, hadron main/v0.5.1), run kairos-init against the
  # base image as a build-only smoke. No ISO, no qemu. Splits after
  # build-kairos-init and runs in parallel with build-image-kairos-init
  # / build-iso / test-* so a flavor breakage does not gate the
  # release path and a bug on the release path does not mask a
  # flavor regression.
  build-flavors:
    needs: [build-kairos-init, changes]
    if: needs.changes.outputs.flavor == 'true'
    uses: ./.github/workflows/_build-flavors.yaml
    with:
      matrix_scope: ci
      ref: ${{ github.event.pull_request.head.sha }}
      caller-vetted-ref: true
    secrets: inherit

  # unit-tests + lint gate any image push (visible outside the run).
  # The kairos-init image is what build-iso consumes.
  build-image-kairos-init:
    needs: [build-kairos-init, unit-tests, lint]
    uses: ./.github/workflows/_build-image-kairos-init.yaml
    permissions:
      contents: read
      packages: write
    with:
      image_registry: ghcr.io/kairos-io/kairos
      image_tag: pr-${{ github.event.pull_request.number }}
      push: true
      registry_login: ghcr
      ref: ${{ github.event.pull_request.head.sha }}
      caller-vetted-ref: true
    secrets: inherit

  # The kcrypt-challenger pipe runs in parallel to the kairos pipe.
  # Nothing on the build-iso / tests path depends on it -- the
  # encryption tests today pin a published kcrypt-challenger tag, not
  # the just-built one -- so it only gates promote / upload-release.
  build-kcrypt-challenger:
    needs: authorize
    uses: ./.github/workflows/_build-kcrypt-challenger.yaml
    with:
      matrix_scope: ci
      ref: ${{ github.event.pull_request.head.sha }}
      caller-vetted-ref: true
    secrets: inherit

  build-image-kcrypt-challenger:
    needs: [build-kcrypt-challenger, unit-tests, lint]
    uses: ./.github/workflows/_build-image-kcrypt-challenger.yaml
    permissions:
      contents: read
      packages: write
    with:
      image_registry: ghcr.io/kairos-io/kairos
      image_tag: pr-${{ github.event.pull_request.number }}
      push: true
      registry_login: ghcr
      ref: ${{ github.event.pull_request.head.sha }}
      caller-vetted-ref: true
    secrets: inherit

  # ISO matrix is split into two jobs so test-* start as soon
  # as the amd64 cells they consume are ready, without waiting for
  # the slow arm64/nvidia builds that no test consumes.
  #
  # build-iso: amd64 core, amd64 standard, amd64 standard-uki,
  # amd64 core-uki -- everything the qemu suites boot -- plus
  # amd64 standard-k0s, which is image-only (iso: false) and boots
  # nowhere; it exists so the k0s provider's build-time work runs
  # on every PR instead of first on a release tag.
  # build-iso-arm: arm64 core + rpi3 + rpi4 + both nvidia jetson
  # cells -- build-only smoke coverage (no qemu on arm64 in CI).
  #
  # Nothing downstream in PR waits on build-iso-arm; a failure there
  # still fails the whole PR, but qemu proceeds in parallel.

  build-iso:
    needs: build-image-kairos-init
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: 'amd64-core', arch: 'amd64', base_image: 'ghcr.io/kairos-io/hadron:v0.5.3', model: 'generic', iso: true, trusted_boot: false, kubernetes_distro: '', fips: false}
          - {name: 'amd64-standard', arch: 'amd64', base_image: 'ghcr.io/kairos-io/hadron:v0.5.3', model: 'generic', iso: true, trusted_boot: false, kubernetes_distro: 'k3s', fips: false}
          # k0s build coverage. iso: false on purpose -- the k0s provider
          # does its work at image build time (runs the k0s installer,
          # relocates the binary out of /usr/local/bin, writes the service
          # units), so pushing the OS container image is enough to exercise
          # it. That is the whole class of defect #4299 was: k0s
          # control-plane components fell back to root because the native
          # system users were never created, and nothing built a k0s image
          # outside release.yaml so it shipped. Runtime k0s coverage (does
          # the cluster come up) is a separate, larger gap; this cell does
          # not claim to close it. Skipping the ISO also keeps the cost of
          # the extra cell off the critical path the test-* jobs wait on:
          # no auroraboot run, so it is the amd64-standard cell's work
          # minus the slowest step.
          - {name: 'amd64-standard-k0s', arch: 'amd64', base_image: 'ghcr.io/kairos-io/hadron:v0.5.3', model: 'generic', iso: false, trusted_boot: false, kubernetes_distro: 'k0s', fips: false}
          # FIPS core cell. hadron-fips is a distinct base image from
          # hadron (FIPS-hardened kernel + userspace); passing fips:true
          # additionally flips the FIPS=fips build_arg in images/Dockerfile
          # so kairos-init installs the FIPS variant of the multi-call
          # kairos binary. Both switches are required for an
          # end-to-end FIPS image; either alone is a footgun.
          - {name: 'amd64-core-fips', arch: 'amd64', base_image: 'ghcr.io/kairos-io/hadron-fips:v0.5.1', model: 'generic', iso: true, trusted_boot: false, kubernetes_distro: '', fips: true}
          # UKI cells feed test-uki. hadron-trusted is a distinct
          # base image from hadron (extra tpm/measured-boot bits); the
          # -uki suffix on the artifact/tag comes from the $UKI token
          # in _build-iso.yaml's custom formats.
          - {name: 'amd64-standard-uki', arch: 'amd64', base_image: 'ghcr.io/kairos-io/hadron-trusted:v0.5.1', model: 'generic', iso: true, trusted_boot: true, kubernetes_distro: 'k3s', fips: false}
          - {name: 'amd64-core-uki', arch: 'amd64', base_image: 'ghcr.io/kairos-io/hadron-trusted:v0.5.1', model: 'generic', iso: true, trusted_boot: true, kubernetes_distro: '', fips: false}
          # Ubuntu 20.04: non-Hadron initramfs builder coverage for
          # the multi-call kairos symlinks. Feeds test-core-ubuntu-20.
          - {name: 'amd64-core-ubuntu-20.04', arch: 'amd64', base_image: 'ubuntu:20.04', model: 'generic', iso: true, trusted_boot: false, kubernetes_distro: '', fips: false}
          # Rocky 9
          - {name: 'amd64-core-rocky-9', arch: 'amd64', base_image: 'rockylinux/rockylinux:9', model: 'generic', iso: true, trusted_boot: false, kubernetes_distro: '', fips: false}
          # openSUSE leap
          - {name: 'amd64-core-leap', arch: 'amd64', base_image: 'opensuse/leap:16.0', model: 'generic', iso: true, trusted_boot: false, kubernetes_distro: '', fips: false}
    name: build-iso / ${{ matrix.name }}
    uses: ./.github/workflows/_build-iso.yaml
    permissions:
      contents: write
      packages: write
      id-token: write
      security-events: write
      actions: read
    with:
      name: ${{ matrix.name }}
      kairos_init_image: ghcr.io/kairos-io/kairos/kairos-init:pr-${{ github.event.pull_request.number }}
      arch: ${{ matrix.arch }}
      base_image: ${{ matrix.base_image }}
      model: ${{ matrix.model }}
      iso: ${{ matrix.iso }}
      trusted_boot: ${{ matrix.trusted_boot }}
      kubernetes_distro: ${{ matrix.kubernetes_distro }}
      fips: ${{ matrix.fips }}
      # All cells here are hadron/ghcr; nvidia + ubuntu-based ones
      # live in build-iso-arm below and override the registry there.
      registry_domain: 'ghcr.io'
      registry_namespace: 'kairos-io/kairos'
      # UKI-only: bake an extra `testentry` EFI entry so the
      # install-upgrade qemu test has something to upgrade.
      # Factory-action ignores it on non-UKI cells.
      single_efi_cmdline: 'testentry: nothing'
      # Opt in to the CI-only sysext overlay. The extensions are generated
      # per build: signed on UKI cells, verity-only on the rest. Release
      # cells do not set this and therefore ship no test extensions.
      test_sysext_overlay: true
      release: false
      ref: ${{ github.event.pull_request.head.sha }}
      caller-vetted-ref: true
    secrets: inherit

  build-iso-arm:
    needs: build-image-kairos-init
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: 'arm64-core', arch: 'arm64', base_image: 'ghcr.io/kairos-io/hadron:v0.5.3', model: 'generic', iso: true, trusted_boot: false, kubernetes_distro: ''}
          # rpi cells: raw disk image, no ISO. Still on hadron base.
          - {name: 'arm64-rpi3', arch: 'arm64', base_image: 'ghcr.io/kairos-io/hadron:v0.5.3', model: 'rpi3', iso: false, trusted_boot: false, kubernetes_distro: ''}
          - {name: 'arm64-rpi4', arch: 'arm64', base_image: 'ghcr.io/kairos-io/hadron:v0.5.3', model: 'rpi4', iso: false, trusted_boot: false, kubernetes_distro: ''}
          # NVIDIA Jetson cells. base_image=ubuntu:22.04 -- L4T rootfs
          # only builds on that. Model-derived knobs (grype/sbom/
          # cleanup) turn off scans and enable disk cleanup; see
          # _build-iso.yaml's caller expression. Push destination
          # switches to quay.io/kairos/ci-temp-images because the
          # ghcr.io/kairos-io/kairos/ubuntu package does not exist yet
          # and needs the same seed dance hadron got; ci-temp-images
          # is already public and existing.
          - name: 'arm64-nvidia-agx-orin'
            arch: 'arm64'
            base_image: 'ubuntu:22.04'
            model: 'nvidia-jetson-agx-orin'
            iso: false
            trusted_boot: false
            kubernetes_distro: ''
            registry_domain: 'quay.io'
            registry_namespace: 'kairos'
            registry_repository: 'ci-temp-images'
          - name: 'arm64-nvidia-orin-nx'
            arch: 'arm64'
            base_image: 'ubuntu:22.04'
            model: 'nvidia-jetson-orin-nx'
            iso: false
            trusted_boot: false
            kubernetes_distro: ''
            registry_domain: 'quay.io'
            registry_namespace: 'kairos'
            registry_repository: 'ci-temp-images'
    name: build-iso-arm / ${{ matrix.name }}
    uses: ./.github/workflows/_build-iso.yaml
    permissions:
      contents: write
      packages: write
      id-token: write
      security-events: write
      actions: read
    with:
      name: ${{ matrix.name }}
      kairos_init_image: ghcr.io/kairos-io/kairos/kairos-init:pr-${{ github.event.pull_request.number }}
      arch: ${{ matrix.arch }}
      base_image: ${{ matrix.base_image }}
      model: ${{ matrix.model }}
      iso: ${{ matrix.iso }}
      trusted_boot: ${{ matrix.trusted_boot }}
      kubernetes_distro: ${{ matrix.kubernetes_distro }}
      registry_domain: ${{ matrix.registry_domain || 'ghcr.io' }}
      registry_namespace: ${{ matrix.registry_namespace || 'kairos-io/kairos' }}
      registry_repository: ${{ matrix.registry_repository || '' }}
      raw: ${{ matrix.model == 'rpi3' || matrix.model == 'rpi4' }}
      grype: ${{ !startsWith(matrix.model, 'nvidia-jetson') }}
      sbom: ${{ !startsWith(matrix.model, 'nvidia-jetson') }}
      cleanup: ${{ startsWith(matrix.model, 'nvidia-jetson') }}
      test_sysext_overlay: true
      release: false
      ref: ${{ github.event.pull_request.head.sha }}
      caller-vetted-ref: true
    secrets: inherit

  # QEMU test suites. Matrix at THIS level (caller side) calling
  # reusable-qemu-test.yaml directly, because matrix + uses on a
  # leaf reusable is a supported pattern; matrix + uses on an
  # intermediate reusable that itself calls another reusable is
  # the shape that broke earlier (see _build-iso.yaml).
  #
  # Each test cell downloads the ISO artifact factory-action
  # produced during build-iso and boots it under qemu. Test labels
  # match the ginkgo labels in tests/.

  test-core:
    needs: build-iso
    strategy:
      fail-fast: false
      matrix:
        include:
          - {test: 'custom-partitioning'}
          - {test: 'acceptance'}
          - {test: 'install'}
          - {test: 'install-target'}
          - {test: 'insecure-registry'}
          - {test: 'partition-validation'}
          - {test: 'reset'}
          - {test: 'upgrade-with-cli'}
          - {test: 'bundles'}
          - {test: 'ssh-hardening'}
          - {test: 'sysext'}
          - {test: 'upgrade-latest-with-cli', release-matcher: 'kairos-hadron-*-core-amd64-generic-v*.iso'}
    name: test-core / ${{ matrix.test }}
    uses: ./.github/workflows/reusable-qemu-test.yaml
    # The 'bundles' matrix entry above needs packages: write -- it logs in
    # to ghcr.io and pushes a bundles-test image (reusable-qemu-test.yaml's
    # "Login to GitHub Container Registry" step, gated on that one test).
    # A matrix job shares one permissions block across every entry, so the
    # whole job needs it even though the other ten entries don't use it.
    permissions:
      contents: read
      packages: write
    with:
      test: ${{ matrix.test }}
      base_image: 'ghcr.io/kairos-io/hadron:v0.5.3'
      variant: 'core'
      arch: 'amd64'
      model: 'generic'
      secureboot: false
      container_image_prefix: 'ghcr.io/kairos-io/kairos/${flavor}'
      bundle_image_tag: pr-${{ github.event.pull_request.number }}
      release-matcher: ${{ matrix.release-matcher || '' }}
      ref: ${{ github.event.pull_request.head.sha }}
      caller-vetted-ref: true
    secrets: inherit

  # FIPS smoke coverage. install + acceptance is the cheapest signal
  # that the FIPS variant of the multi-call kairos binary boots and
  # cloud-config installs land the way the default variant does; a
  # deeper matrix here would double a slow build for no extra signal.
  # Consumes pr-amd64-core-fips's ISO artifact (base_image = hadron-fips,
  # variant computed as core because kubernetes_distro is empty).
  test-core-fips:
    needs: build-iso
    strategy:
      fail-fast: false
      matrix:
        include:
          - {test: 'install'}
          - {test: 'acceptance'}
    name: test-core-fips / ${{ matrix.test }}
    uses: ./.github/workflows/reusable-qemu-test.yaml
    # reusable-qemu-test.yaml's own permissions block requests packages:
    # write unconditionally (its bundles-test push step needs it), so
    # every caller must grant it too, regardless of which test value it
    # passes -- same reason test-core has it below.
    permissions:
      contents: read
      packages: write
    with:
      test: ${{ matrix.test }}
      base_image: 'ghcr.io/kairos-io/hadron-fips:v0.5.1'
      variant: 'core'
      arch: 'amd64'
      model: 'generic'
      secureboot: false
      container_image_prefix: 'ghcr.io/kairos-io/kairos/${flavor}'
      ref: ${{ github.event.pull_request.head.sha }}
      caller-vetted-ref: true
    secrets: inherit

  # Same smoke shape as test-core-fips.
  test-core-ubuntu-20:
    needs: build-iso
    strategy:
      fail-fast: false
      matrix:
        include:
          - {test: 'install'}
          - {test: 'acceptance'}
    name: test-core-ubuntu-20 / ${{ matrix.test }}
    uses: ./.github/workflows/reusable-qemu-test.yaml
    # See test-core-fips above.
    permissions:
      contents: read
      packages: write
    with:
      test: ${{ matrix.test }}
      base_image: 'ubuntu:20.04'
      variant: 'core'
      arch: 'amd64'
      model: 'generic'
      secureboot: false
      container_image_prefix: 'ghcr.io/kairos-io/kairos/${flavor}'
      ref: ${{ github.event.pull_request.head.sha }}
      caller-vetted-ref: true
    secrets: inherit

  test-core-rocky-9:
    needs: build-iso
    strategy:
      fail-fast: false
      matrix:
        include:
          - {test: 'selinux'}
    name: test-core-rocky-9 / ${{ matrix.test }}
    uses: ./.github/workflows/reusable-qemu-test.yaml
    # See test-core-fips above.
    permissions:
      contents: read
      packages: write
    with:
      test: ${{ matrix.test }}
      base_image: 'rockylinux/rockylinux:9'
      variant: 'core'
      arch: 'amd64'
      model: 'generic'
      secureboot: false
      container_image_prefix: 'ghcr.io/kairos-io/kairos/${flavor}'
      ref: ${{ github.event.pull_request.head.sha }}
      caller-vetted-ref: true
    secrets: inherit

  test-core-leap:
    needs: build-iso
    strategy:
      fail-fast: false
      matrix:
        include:
          - {test: 'selinux'}
    name: test-core-leap / ${{ matrix.test }}
    uses: ./.github/workflows/reusable-qemu-test.yaml
    # See test-core-fips above.
    permissions:
      contents: read
      packages: write
    with:
      test: ${{ matrix.test }}
      base_image: 'opensuse/leap:16.0'
      variant: 'core'
      arch: 'amd64'
      model: 'generic'
      secureboot: false
      container_image_prefix: 'ghcr.io/kairos-io/kairos/${flavor}'
      ref: ${{ github.event.pull_request.head.sha }}
      caller-vetted-ref: true
    secrets: inherit

  test-standard:
    needs: build-iso
    strategy:
      fail-fast: false
      matrix:
        include:
          - {test: 'provider-qrcode-install'}
          - {test: 'provider-upgrade-k8s'}
          - {test: 'provider-decentralized-k8s'}
          - {test: 'provider-k3s-disabled'}
          - {test: 'provider-upgrade-latest-k8s-with-kubernetes', release-matcher: 'kairos-hadron-*-standard-amd64-generic-*k3sv*.iso'}
    name: test-standard / ${{ matrix.test }}
    uses: ./.github/workflows/reusable-qemu-test.yaml
    # See test-core-fips above.
    permissions:
      contents: read
      packages: write
    with:
      test: ${{ matrix.test }}
      base_image: 'ghcr.io/kairos-io/hadron:v0.5.3'
      variant: 'standard'
      arch: 'amd64'
      model: 'generic'
      secureboot: false
      container_image_prefix: 'ghcr.io/kairos-io/kairos/${flavor}'
      # These cells consume the amd64-standard build cell's image, which
      # is a k3s one. The pushed tag carries the distro, so the test side
      # has to name it: `standard` alone does not identify a k3s image,
      # since a k0s cell computes the same variant.
      kubernetes_distro: 'k3s'
      release-matcher: ${{ matrix.release-matcher || '' }}
      ref: ${{ github.event.pull_request.head.sha }}
      caller-vetted-ref: true
    secrets: inherit

  # encryption-* tests spin up a k3s cluster with a kcrypt-challenger
  # Deployment, and that deployment now runs the image this PR just
  # built. Split out from test-standard so only these cells gate
  # on build-image-kcrypt-challenger.
  test-standard-encryption:
    needs: [build-iso, build-image-kcrypt-challenger]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {test: 'encryption-local'}
          - {test: 'encryption-remote-auto'}
          - {test: 'encryption-remote-static'}
          - {test: 'encryption-remote-https-pinned'}
          - {test: 'encryption-remote-https-bad-cert'}
          - {test: 'encryption-remote-complete-workflow'}
          - {test: 'encryption-remote-ek-only'}
          - {test: 'encryption-remote-selective-pcr'}
          - {test: 'encryption-remote-ek-reenroll'}
          - {test: 'encryption-remote-mixed-modes'}
          - {test: 'encryption-kcrypt-cli'}
          - {test: 'encryption-on-boot'}
          - {test: 'encryption-on-boot-no-tpm'}
          - {test: 'encryption-on-boot-remote'}
          - {test: 'encryption-reset-parity'}
    name: test-standard-encryption / ${{ matrix.test }}
    uses: ./.github/workflows/reusable-qemu-test.yaml
    # See test-core-fips above.
    permissions:
      contents: read
      packages: write
    with:
      test: ${{ matrix.test }}
      base_image: 'ghcr.io/kairos-io/hadron:v0.5.3'
      variant: 'standard'
      arch: 'amd64'
      model: 'generic'
      secureboot: false
      container_image_prefix: 'ghcr.io/kairos-io/kairos/${flavor}'
      # Same amd64-standard (k3s) image test-standard consumes.
      kubernetes_distro: 'k3s'
      kcrypt_challenger_image: ghcr.io/kairos-io/kairos/kcrypt-challenger:pr-${{ github.event.pull_request.number }}
      ref: ${{ github.event.pull_request.head.sha }}
      caller-vetted-ref: true
    secrets: inherit

  # UKI qemu tests. `generic` needs the standard (k3s) UKI ISO plus a
  # dynamically-built upgrade image; `boot-assessment` runs against
  # the core UKI ISO and only checks boot slots. Both live in
  # _uki-test.yaml since their shape diverges from the regular
  # reusable-qemu-test.yaml.
  test-uki:
    needs: build-iso
    strategy:
      fail-fast: false
      matrix:
        include:
          - {test: 'install-upgrade', variant: 'standard', kubernetes_distro: 'k3s'}
          - {test: 'boot-assessment', variant: 'core', kubernetes_distro: ''}
    name: test-uki / ${{ matrix.test }}
    uses: ./.github/workflows/_uki-test.yaml
    permissions:
      contents: read
      # _uki-test.yaml pushes the dynamically-built UKI upgrade image
      # from the install-upgrade cell, so the callee declares
      # packages: write and this caller has to cover it.
      packages: write
    with:
      test: ${{ matrix.test }}
      variant: ${{ matrix.variant }}
      # Mirrors the kubernetes_distro of the build-iso UKI cell each test
      # consumes: amd64-standard-uki is k3s, amd64-core-uki is neither.
      kubernetes_distro: ${{ matrix.kubernetes_distro }}
      base_image: 'ghcr.io/kairos-io/hadron-trusted:v0.5.1'
      arch: 'amd64'
      model: 'generic'
      container_image_prefix: 'ghcr.io/kairos-io/kairos/${flavor}'
      ref: ${{ github.event.pull_request.head.sha }}
      caller-vetted-ref: true
    secrets: inherit

  # Per-PR ISO size signal. Downloads the amd64/generic ISOs this PR
  # just built, UKI ones included, grabs the same set from the last green
  # master run as a baseline, and writes a size delta table to the job
  # summary. The ISO table is informational: a missing or expired
  # baseline just degrades to a PR-only listing.
  #
  # The UKI table is a gate. Every .efi inside a UKI ISO has to stay
  # under a ceiling and, when there is a baseline, must not grow past a
  # percentage against master. Both limits and the reasoning behind them
  # live at the top of scripts/iso-size-diff.sh. It lives here and not in
  # pr.yaml because the smoke run there builds no UKI ISO.
  #
  # This only lives in pr.yaml. The durable "sizes over time" history
  # (the hadron size-history.sh pattern ported to ISOs) is tracked
  # separately in #3816 and will land as its own follow-up.
  size-diff:
    name: iso-size-diff
    needs: build-iso
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      # pull_request_target checks out the base branch by default, which
      # would not have this PR's script yet. build-iso already sits
      # behind the authorize gate, so pulling the PR ref here is the same
      # vetted-ref deal the rest of the workflow makes.
      #
      # actions/checkout refuses a fork ref under pull_request_target
      # unless the caller opts in, so this is the inline equivalent of
      # the `caller-vetted-ref: true` every reusable above passes. It
      # rests on the same `needs: authorize` chain: size-diff needs
      # build-iso, which needs build-image-kairos-init, which needs
      # authorize. Without it the job fails at checkout on every fork
      # PR and never reaches the comparison.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          allow-unsafe-pr-checkout: true
      - name: Install xorriso and mtools
        # Needed to read the .efi files out of the UKI ISOs.
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso mtools
      - name: Download PR ISOs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          # The trailing * also picks up the -uki.iso.zip artifacts.
          pattern: "kairos-hadron-*-amd64-generic*.iso.zip"
          path: candidate
      - name: Download last master ISOs
        # A hiccup finding or fetching the baseline should never fail the
        # PR; the script falls back to a PR-only report when baseline is
        # empty.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow master.yaml --branch master --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [[ -z "$run_id" ]]; then
            echo "No successful master build found; reporting PR sizes only."
            exit 0
          fi
          echo "Using master build $run_id as the size baseline."
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
            --pattern "kairos-hadron-*-amd64-generic*.iso.zip" \
            --dir baseline || echo "Baseline artifacts unavailable (expired?)."
      - name: Compare ISO sizes and check UKI sizes
        # An explicit bash shell runs with pipefail, so a failed UKI check
        # is not hidden behind tee's exit status.
        shell: bash
        run: scripts/iso-size-diff.sh --require-uki baseline candidate | tee -a "$GITHUB_STEP_SUMMARY"
