name: Release Notes Diff

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)generate notes for"
        required: true
        type: string

permissions:
  contents: read

jobs:
  generate-diff:
    permissions:
      contents: write
    if: ${{ !github.event.release.prerelease && !github.event.release.draft }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CURRENT_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve previous final release tag
        id: prev
        run: |
          # NOTE: per_page=100 reliably times out (HTTP 504) on this repo's releases
          # endpoint and returns an HTML error page instead of JSON. Releases are
          # returned newest-first, so a smaller page is enough to find the relevant
          # releases. We also guard against a non-JSON response so a transient API
          # hiccup skips diff generation instead of failing the release.
          releases_json=$(gh api "repos/${{ github.repository }}/releases?per_page=50") || {
            echo "Could not fetch releases (API error). Skipping diff generation."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if ! echo "$releases_json" | jq -e 'type == "array"' > /dev/null 2>&1; then
            echo "Unexpected releases response (not a JSON array). Skipping diff generation."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Resolve the final release that immediately precedes CURRENT_TAG in the
          # newest-first list. This works for both the release:published trigger
          # (where CURRENT_TAG is the newest release) and manual workflow_dispatch
          # runs that target an older tag. If CURRENT_TAG is not among the recent
          # final releases (e.g. too old for this page), we skip rather than diff
          # against the wrong base.
          previous_tag=$(echo "$releases_json" | jq -r --arg current "$CURRENT_TAG" '[.[] | select(.draft == false and .prerelease == false) | .tag_name] as $finals | ($finals | index($current)) as $i | (if $i == null then empty else $finals[$i + 1] end) // empty')

          if [ -z "$previous_tag" ] || [ "$previous_tag" = "null" ]; then
            echo "No previous final release found for $CURRENT_TAG. Skipping diff generation."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Previous final release: $previous_tag"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$previous_tag" >> "$GITHUB_OUTPUT"

      - name: Generate release diff markdown
        if: ${{ steps.prev.outputs.skip == 'false' }}
        run: |
          output_file="RELEASE_DIFF_${CURRENT_TAG}.md"
          ./scripts/kairos-diff.sh "${STEPS_PREV_OUTPUTS_TAG}" "$CURRENT_TAG" --output "$output_file"
          echo "output_file=$output_file" >> "$GITHUB_ENV"
        env:
          STEPS_PREV_OUTPUTS_TAG: ${{ steps.prev.outputs.tag }}

      - name: Generate security fixes section
        # OpenSSF Best Practices `release_notes_vulns`: release notes must
        # explicitly list the publicly known vulnerabilities (CVEs) fixed in
        # each release, or say plainly that there are none. This scans the
        # diff already generated above for CVE identifiers in PR titles and
        # commit subjects across kairos, kairos-init, and every tracked
        # component, so a security-fix PR is picked up automatically as long
        # as its title names the CVE it fixes.
        if: ${{ steps.prev.outputs.skip == 'false' }}
        id: security
        run: |
          security_file="SECURITY_FIXES_${CURRENT_TAG}.md"
          cve_lines="$(grep -oE '^- .*CVE-[0-9]{4}-[0-9]+.*$' "${output_file}" | sort -u || true)"

          {
            echo "## Security fixes"
            echo
            if [ -n "$cve_lines" ]; then
              printf '%s\n' "$cve_lines"
            else
              echo "No security fixes in this release."
            fi
          } > "$security_file"

          echo "security_file=$security_file" >> "$GITHUB_OUTPUT"

      - name: Prepend security fixes section to release description
        if: ${{ steps.prev.outputs.skip == 'false' }}
        run: |
          security_header="## Security fixes"

          gh release view "$CURRENT_TAG" --repo "${{ github.repository }}" --json body --jq '.body // ""' > current_body.md

          if grep -Fq "$security_header" current_body.md; then
            echo "Security fixes section already present in release body. Skipping."
            exit 0
          fi

          {
            cat current_body.md
            echo
            cat "${STEPS_SECURITY_OUTPUTS_SECURITY_FILE}"
          } > with_security_body.md

          gh release edit "$CURRENT_TAG" --repo "${{ github.repository }}" --notes-file with_security_body.md
        env:
          STEPS_SECURITY_OUTPUTS_SECURITY_FILE: ${{ steps.security.outputs.security_file }}

      - name: Append diff to release description
        if: ${{ steps.prev.outputs.skip == 'false' }}
        id: append
        run: |
          header="# Changes since previous version (${STEPS_PREV_OUTPUTS_TAG})"

          gh release view "$CURRENT_TAG" --repo "${{ github.repository }}" --json body --jq '.body // ""' > current_body.md

          if grep -Fq "$header" current_body.md; then
            echo "Header already present in release body. Skipping append."
            echo "appended=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            cat current_body.md
            echo
            echo "$header"
            echo
            cat "${output_file}"
          } > combined_body.md

          # GitHub rejects a release body over 125000 characters with HTTP 422
          # (v4.3.0 did). Byte count is an upper bound on the character count.
          # When the diff does not fit, attach it as a release asset and link it.
          if [ "$(wc -c < combined_body.md)" -gt 125000 ]; then
            echo "Release body would exceed 125000 characters. Attaching ${output_file} as an asset instead."
            gh release upload "$CURRENT_TAG" "${output_file}" --repo "${{ github.repository }}" --clobber
            {
              cat current_body.md
              echo
              echo "$header"
              echo
              echo "The full list is too long for the release description. See [${output_file}](${{ github.server_url }}/${{ github.repository }}/releases/download/${CURRENT_TAG}/${output_file})."
            } > combined_body.md
          fi

          gh release edit "$CURRENT_TAG" --repo "${{ github.repository }}" --notes-file combined_body.md
          echo "appended=true" >> "$GITHUB_OUTPUT"
        env:
          STEPS_PREV_OUTPUTS_TAG: ${{ steps.prev.outputs.tag }}

      - name: Write workflow summary
        if: ${{ steps.prev.outputs.skip == 'false' }}
        run: |
          {
            echo "## Release diff generated"
            echo
            echo "- Current release: \`${CURRENT_TAG}\`"
            echo "- Previous final release: \`${STEPS_PREV_OUTPUTS_TAG}\`"
            if [ "${STEPS_APPEND_OUTPUTS_APPENDED}" = "true" ]; then
              echo "- Release description updated: \`yes\`"
            else
              echo "- Release description updated: \`no (already contained section header)\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          STEPS_PREV_OUTPUTS_TAG: ${{ steps.prev.outputs.tag }}
          STEPS_APPEND_OUTPUTS_APPENDED: ${{ steps.append.outputs.appended }}
