name: weekly-release

# Cuts a release from the newest green master commit every Monday at
# 06:00 UTC. A maintainer can also start it by hand, choosing the bump
# and whether it is a dry run.
#
# What it does, in order:
#   - picks the newest master commit whose push runs have a finished
#     verdict (scripts/green-commit.sh)
#   - picks the next version from the commits since the last final
#     release reachable from that commit (scripts/release-version.sh);
#     a prerelease that waits for approval or was rejected is not a
#     base, so its commits go into the next release
#   - stops with an error when quay.io/kairos/kairos-init already has
#     an image for that version, which means the version was released
#     before and its tag was deleted
#   - creates the tag and a GitHub prerelease together with
#     `gh release create --target`, so the tag is made through the API
#     on exactly the chosen commit
#   - starts release.yaml on the new tag, then posts to Slack that the
#     release is building
#
# The release stays a prerelease until a maintainer approves the
# promote job of its release.yaml run. That job also starts
# release-notes-diff.yaml, which works only on a final release.
#
# The release.yaml run is started with `gh workflow run` because a tag
# created with the workflow's GITHUB_TOKEN does not trigger the
# release.yaml push trigger: GitHub starts no workflow for events made
# with that token, except workflow_dispatch.
#
# A red master, no commit with a verdict, nothing landed since the last
# release, and a breaking change under bump=auto all skip the release
# and end the job successfully, with a Slack message where a maintainer
# needs to know. In auto mode "nothing landed" counts from the newest
# release tag the commit contains, so a prerelease that waits for
# approval is not cut again every Monday. ci-doctor scans every
# failed run on master, scheduled ones included, and would try to
# fix this workflow when the failure it reports belongs to some other
# workflow. A breaking change waits for a maintainer, who runs this
# workflow with bump=major.
#
# On a schedule run there are no inputs, so bump is auto and dry_run
# is false. A dry run stops after writing the job summary, creates
# nothing and posts nothing to Slack: the notify helper writes its
# text to the job summary and prints a notice instead.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump; auto reads the commit subjects"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto
      dry_run:
        description: "Pick the commit and version, create nothing"
        type: boolean
        default: false

permissions:
  contents: read

env:
  # A schedule run has no inputs, so it is never a dry run.
  DRY_RUN: ${{ inputs.dry_run || false }}

# Two runs at once could pick the same version and race to create it.
concurrency:
  group: weekly-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # gh release create makes the tag and the prerelease.
      contents: write
      # gh workflow run starts release.yaml.
      actions: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Write the Slack notify helper
        # Posts its argument to Slack, or prints it as a warning when the
        # webhook secret is not set. On a dry run it posts nothing and
        # writes the text to the job summary and a notice instead.
        run: |
          cat > "$RUNNER_TEMP/notify.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          if [ "${DRY_RUN:-false}" = true ]; then
            echo "Dry run, not posted to Slack: $1" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Dry run, not posted to Slack: $1"
            exit 0
          fi
          if [ -z "${SLACK_RELEASE_WEBHOOK:-}" ]; then
            echo "::warning::$1"
            exit 0
          fi
          curl -fsS -X POST -H 'Content-Type: application/json' \
            --data "$(jq -n --arg t "$1" '{text:$t}')" "$SLACK_RELEASE_WEBHOOK"
          EOF
          chmod +x "$RUNNER_TEMP/notify.sh"

      - name: Fetch master commits and runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/commits?sha=master&per_page=50" > "$RUNNER_TEMP/commits.json"
          gh run list -R "$REPO" --branch master --event push --limit 500 \
            --json workflowName,headSha,status,conclusion,url > "$RUNNER_TEMP/runs.json"

      - name: Pick the newest green commit
        id: green
        env:
          SLACK_RELEASE_WEBHOOK: ${{ secrets.SLACK_RELEASE_WEBHOOK }}
        run: |
          set +e
          out="$(scripts/green-commit.sh "$RUNNER_TEMP/commits.json" "$RUNNER_TEMP/runs.json")"
          rc=$?
          set -e
          echo "$out" >> "$GITHUB_OUTPUT"
          get() { sed -n "s/^$1=//p" <<<"$out"; }
          case "$rc" in
            0)
              echo "Newest green master commit: \`$(get sha)\`." >> "$GITHUB_STEP_SUMMARY"
              ;;
            2)
              msg="Weekly release skipped: \`$(get workflow)\` is red on master since \`$(get since)\`, $(get url)"
              echo "$msg" >> "$GITHUB_STEP_SUMMARY"
              "$RUNNER_TEMP/notify.sh" "$msg"
              ;;
            3)
              msg="Weekly release skipped: no master commit in the last 50 has a finished CI run"
              echo "$msg" >> "$GITHUB_STEP_SUMMARY"
              "$RUNNER_TEMP/notify.sh" "$msg"
              ;;
            *)
              echo "::error::green-commit.sh failed with exit status $rc"
              exit 1
              ;;
          esac

      - name: Pick the next version
        id: version
        if: steps.green.outputs.state == 'green'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BUMP: ${{ inputs.bump || 'auto' }}
          SHA: ${{ steps.green.outputs.sha }}
          SLACK_RELEASE_WEBHOOK: ${{ secrets.SLACK_RELEASE_WEBHOOK }}
        run: |
          # Only a final release can be the base, so the commits of a
          # rejected or pending prerelease are released again.
          gh release list -R "$REPO" --exclude-pre-releases --exclude-drafts --limit 200 \
            --json tagName --jq '.[].tagName' > "$RUNNER_TEMP/final-tags.txt"
          set +e
          out="$(scripts/release-version.sh --bump "$BUMP" --notes "$RUNNER_TEMP/notes.md" \
            --final-tags "$RUNNER_TEMP/final-tags.txt" "$SHA")"
          rc=$?
          set -e
          echo "$out" >> "$GITHUB_OUTPUT"
          get() { sed -n "s/^$1=//p" <<<"$out"; }
          case "$rc" in
            0)
              echo "outcome=release" >> "$GITHUB_OUTPUT"
              ;;
            3)
              echo "outcome=nothing" >> "$GITHUB_OUTPUT"
              if [ "$BUMP" = auto ]; then
                echo "Nothing landed since \`$(get previous)\`." >> "$GITHUB_STEP_SUMMARY"
              else
                echo "Nothing landed since \`$(get base)\`." >> "$GITHUB_STEP_SUMMARY"
              fi
              ;;
            4)
              echo "outcome=breaking" >> "$GITHUB_OUTPUT"
              msg="Weekly release skipped: master has a breaking change since \`$(get base)\`. A maintainer cuts \`$(get version)\` by running weekly-release with bump=major."
              echo "$msg" >> "$GITHUB_STEP_SUMMARY"
              "$RUNNER_TEMP/notify.sh" "$msg"
              ;;
            *)
              echo "::error::release-version.sh failed with exit status $rc"
              exit 1
              ;;
          esac

      - name: Write the job summary
        if: steps.version.outputs.outcome == 'release'
        env:
          SHA: ${{ steps.green.outputs.sha }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          BASE: ${{ steps.version.outputs.base }}
          VERSION: ${{ steps.version.outputs.version }}
          BUMP: ${{ steps.version.outputs.bump }}
          COMMITS: ${{ steps.version.outputs.commits }}
          NEW: ${{ steps.version.outputs.new }}
        run: |
          {
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`$SHA\` |"
            echo "| Previous | \`$PREVIOUS\` |"
            echo "| Base | \`$BASE\` |"
            echo "| Version | \`$VERSION\` |"
            echo "| Bump | $BUMP |"
            echo "| Commits since base | $COMMITS |"
            echo "| New since previous | $NEW |"
            echo "| Dry run | $DRY_RUN |"
            echo
            cat "$RUNNER_TEMP/notes.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check that the version was never released
        # A deleted tag leaves its images on quay.io, and building the
        # same version again would overwrite them. kairos-init is public,
        # so docker manifest inspect needs no login; it fails when the
        # image is absent.
        if: steps.version.outputs.outcome == 'release'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SLACK_RELEASE_WEBHOOK: ${{ secrets.SLACK_RELEASE_WEBHOOK }}
        run: |
          image="quay.io/kairos/kairos-init:$VERSION"
          if ! docker manifest inspect "$image" > /dev/null 2>&1; then
            echo "\`$image\` does not exist, so \`$VERSION\` is unused." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          msg="Weekly release stopped: $image already exists, so $VERSION was released before and its tag was deleted. Recreate the tag or release by hand."
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          "$RUNNER_TEMP/notify.sh" "$msg"
          echo "::error::$msg"
          exit 1

      - name: Create the tag and the prerelease
        if: steps.version.outputs.outcome == 'release' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.green.outputs.sha }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          VERSION: ${{ steps.version.outputs.version }}
          BUMP: ${{ steps.version.outputs.bump }}
        run: |
          {
            echo "Version bump: $BUMP (from $PREVIOUS)"
            echo
            cat "$RUNNER_TEMP/notes.md"
          } > "$RUNNER_TEMP/body.md"
          gh release create "$VERSION" -R "$REPO" --target "$SHA" --prerelease \
            --title "$VERSION" --notes-file "$RUNNER_TEMP/body.md"

      - name: Start the release workflow
        if: steps.version.outputs.outcome == 'release' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh workflow run release.yaml -R "$REPO" --ref "$VERSION"

      - name: Announce the prerelease
        if: steps.version.outputs.outcome == 'release' && inputs.dry_run != true
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SLACK_RELEASE_WEBHOOK: ${{ secrets.SLACK_RELEASE_WEBHOOK }}
        run: |
          msg="Kairos \`$VERSION\` is building as a prerelease. Approve the promote job of its release run to publish it."
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          "$RUNNER_TEMP/notify.sh" "$msg"
