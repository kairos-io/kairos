on:
  workflow_call:
    inputs:
      # Set to a space separated list of directories where yamls should searched
      yamldirs:
        required: false
        type: string
        default: "."

      # Set to "false" for repositories that are not golang applications
      is-go:
        required: false
        type: boolean
        default: true
      timeout:
        required: false
        type: string
        default: "10m"

      # Git ref every lint job should check out. Leave empty for the
      # ref that triggered the calling workflow (right for every
      # ordinary caller). Set it when the caller runs under
      # `pull_request_target` and needs the PR HEAD's code linted
      # rather than the base branch's -- pass
      # `refs/pull/<n>/head`. Same knob and same reasoning as
      # kairos-io/kairos-factory-action's `ref` input.
      ref:
        required: false
        type: string
        default: ""

      # Caller assertion required to unlock actions/checkout's
      # `allow-unsafe-pr-checkout` opt-in. Set to `true` ONLY if
      # the caller has its own authorization gate in front of this
      # workflow -- e.g. a `pull_request_target` pipeline whose
      # `authorize` job pins the run to a GitHub Environment that
      # requires maintainer review before the fork's `ref` is
      # fetched. Without such a gate, leaving this false keeps the
      # `pull_request_target` + fork-ref combination blocked at
      # checkout time (the guard described at
      # https://gh.io/securely-using-pull_request_target).
      caller-vetted-ref:
        required: false
        type: boolean
        default: false

jobs:
  golangci_lint:
    runs-on: ubuntu-latest
    if: ${{ inputs.is-go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
          allow-unsafe-pr-checkout: ${{ inputs.caller-vetted-ref }}
      - name: embed stubs
        # kairos-init/pkg/bundled/bundled.go uses //go:embed
        # binaries/*, and bundled_fips.go uses //go:embed
        # binaries/fips/*. Typechecking the package -- which
        # golangci-lint does when loading /work -- requires those
        # files to exist. The repo does not ship the real binaries
        # (make binaries downloads them at build time), so create
        # empty placeholders so the embed directives resolve.
        #
        # Inlined rather than delegated to `make
        # kairos-init-embed-stubs` on purpose: this workflow can be
        # entered under pull_request_target with the PR HEAD checked
        # out and `secrets: inherit` set upstream (see pr.yaml's
        # `authorize` gate + `caller-vetted-ref: true`), and running
        # the PR's Makefile in that context executes untrusted code
        # from the fork inside a privileged run -- the pattern
        # CodeQL's Untrusted Checkout TOCTOU query flags. Keep this
        # step to shell defined in the workflow (which reviewers
        # gate) rather than shell defined in the PR being linted.
        # The bodies mirror kairos-init-embed-stubs 1:1 -- if that
        # target changes, update here too.
        shell: bash
        run: |
          mkdir -p kairos-init/pkg/bundled/binaries/fips
          for f in kairos provider-kairos kairos-installer edgevpn version-info.yaml; do
            [ -e "kairos-init/pkg/bundled/binaries/$f" ] || : > "kairos-init/pkg/bundled/binaries/$f"
          done
          for f in kairos provider-kairos kairos-installer; do
            [ -e "kairos-init/pkg/bundled/binaries/fips/$f" ] || : > "kairos-init/pkg/bundled/binaries/fips/$f"
          done
      - name: golangci-lint
        shell: bash
        env:
          TIMEOUT: ${{ inputs.timeout }}
        # Version pin lives in .golangci-version at the repo root so
        # the `make lint-go` local target and this CI step always run
        # the same golangci-lint. `latest-alpine` moves without a
        # commit in this repo and drops surprise findings into
        # unrelated PRs; a pinned tag rolls forward only when the
        # file changes.
        #
        # CGO_ENABLED=0 keeps typecheck off the cgo path in
        # github.com/google/go-tpm-tools/simulator (pulled transitively
        # by kcrypt via kairos-io/tpm-helpers), which needs openssl-dev
        # headers the golangci-lint alpine image does not ship. The
        # simulator has a `//go:build !cgo` fallback that typechecks
        # cleanly, so this only affects what golangci-lint parses,
        # not what any build job compiles.
        run: |
          VERSION=$(cat .golangci-version)
          docker run -e CGO_ENABLED=0 -v "$PWD":/work -w /work \
            "golangci/golangci-lint:${VERSION}" \
            golangci-lint -v --timeout="${TIMEOUT}" run

  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          allow-unsafe-pr-checkout: ${{ inputs.caller-vetted-ref }}
      - name: hadolint
        env:
          HADOLINT_VERSION: 2.12.0-alpine
        shell: bash
        run: find . -path "./examples" -prune -o -name "Dockerfile.*" -print | xargs -r -n1 docker run -v "$PWD":/work -w /work "hadolint/hadolint:${HADOLINT_VERSION}" hadolint

  renovate-validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          allow-unsafe-pr-checkout: ${{ inputs.caller-vetted-ref }}
      - name: renovate-validate
        env:
          RENOVATE_VERSION: "35"
        shell: bash
        run: docker run -v "$PWD":/work -w /work renovate/renovate renovate-config-validator

  shellcheck-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          allow-unsafe-pr-checkout: ${{ inputs.caller-vetted-ref }}
      - name: shellcheck-lint
        env:
          SHELLCHECK_VERSION: v0.9.0
        shell: bash
        run: find . -path "./examples" -prune -o -name "*.sh" -print | xargs -r -n1 docker run -v "$PWD":/work -w /work "koalaman/shellcheck-alpine:${SHELLCHECK_VERSION}" shellcheck

  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          allow-unsafe-pr-checkout: ${{ inputs.caller-vetted-ref }}
      - name: yamllint
        shell: bash
        run: find ${{ inputs.yamldirs }} -path "./examples" -prune -o -name "*.yml" -or -name "*.yaml" -print  | xargs -r -n1 docker run -v "$PWD":/work -w /work cytopia/yamllint --strict
