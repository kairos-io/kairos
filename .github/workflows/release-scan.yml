---
name: 'Release vulnerability scan'

# Scans the binaries Kairos actually ships, built from this tree.
# Refs https://github.com/kairos-io/kairos/issues/3985.
#
# `make binaries` produces the multi-call kairos, kairos-installer and
# provider-kairos for both variants and populates
# kairos-init/pkg/bundled/binaries/ with them plus edgevpn, which is the exact
# set kairos-init embeds into an image. Nothing here is UPX-compressed, so the
# module metadata a scanner needs is readable as built.
#
# This used to clone the archived kairos-io/kairos-init at the tag pinned in
# images/Dockerfile and scan the binaries THAT release had downloaded from the
# archived per-component repos. Once every component moved into this repo, that
# scanned a bundle we no longer ship: it reported advisories against published
# binaries that had been replaced, and would have missed advisories in the ones
# we now build. The findings have to come from this tree or the gate is
# measuring the wrong artifact.

# This is a release gate: release.yaml and release-arm.yaml call it via
# workflow_call, and every publishing job depends on it, so a release with
# unignored advisories never publishes.
#
# The pull_request trigger is scoped to the files that determine the result.
# Now that the bundle is built here, that is the dependency set itself, the
# edgevpn pin in the embed script, the ignore list, and this workflow. A PR
# that changes none of them cannot change the findings.
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'scripts/prepare-kairos-init-binaries.sh'
      - 'osv-scanner.toml'
      - '.github/workflows/release-scan.yml'

permissions:
  contents: read

jobs:
  scan-shipped-bundle:
    name: scan shipped bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kairos
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      # Populates kairos-init/pkg/bundled/binaries/{,fips/} with exactly what
      # kairos-init embeds. amd64 only: the dependency set does not vary by
      # architecture, and building every arch would triple the runtime of a
      # gate that exists to read module metadata.
      - name: Build the shipped bundle
        run: make binaries ARCH=amd64

      - name: Install osv-scanner
        env:
          OSV_SCANNER_VERSION: v2.5.0
        run: |
          set -euo pipefail
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64" \
            -o /usr/local/bin/osv-scanner
          chmod +x /usr/local/bin/osv-scanner
          osv-scanner --version

      # Two flags are load-bearing. Without either, the scan finds nothing and
      # reports success -- a false green, which is worse than no gate at all.
      #
      #   --no-ignore                      kairos-init's .gitignore excludes
      #                                    pkg/bundled/binaries/, and osv-scanner
      #                                    honours .gitignore by default.
      #   --experimental-plugins artifact  the default plugin set
      #                                    (lockfile, sbom, directory) cannot
      #                                    read Go binaries at all.
      #   --all-packages                   without it, a scan with no findings
      #                                    emits an EMPTY results array, which
      #                                    is indistinguishable from a scan that
      #                                    read nothing -- and would trip the
      #                                    false-green guard below on every
      #                                    clean release.
      #
      # continue-on-error because osv-scanner exits non-zero when it finds
      # vulnerabilities; the reporting step below decides what that means.
      - name: Scan
        continue-on-error: true
        run: |
          set -uo pipefail
          osv-scanner scan source \
            --experimental-plugins artifact \
            --no-ignore \
            --recursive \
            --all-packages \
            --config osv-scanner.toml \
            --format json \
            --output-file osv.json \
            kairos-init/pkg/bundled/binaries

      # A clean result only means something if the scanner actually read the
      # binaries. Zero extracted packages is a broken scan, not a pass.
      - name: Guard against a false green
        run: |
          set -euo pipefail
          if [ ! -s osv.json ]; then
            echo "::error::osv-scanner produced no output file"
            exit 1
          fi
          PACKAGES="$(jq '[.results[].packages[]] | length' osv.json)"
          echo "extracted packages: ${PACKAGES}"
          if [ "${PACKAGES}" -eq 0 ]; then
            echo "::error::scanner extracted 0 packages -- it did not read the shipped binaries. Treating as a failure, not as clean."
            exit 1
          fi

      # osv-scanner compares the stdlib version string verbatim. A binary built
      # with a GOEXPERIMENT reports its version with an "-X:<experiment>"
      # suffix, for example "1.27.0-X:boringcrypto" on the FIPS binaries or
      # "1.27.0-X:nodwarf5" on the default ones, and semver orders anything
      # after a hyphen BELOW the plain version because the suffix reads as a
      # prerelease. So every stdlib advisory fixed in 1.27.0 still matches,
      # even though the binary was built from a toolchain that carries the fix.
      #
      # The suffix is matched generically rather than as the literal
      # "boringcrypto" it once was. When this only handled boringcrypto, the
      # default-variant binaries slipped through the moment their toolchain
      # started reporting -X:nodwarf5, and stdlib advisories already fixed in
      # the toolchain we build with failed the gate.
      #
      # This drops exactly that case: a stdlib finding on an -X:-suffixed build
      # whose base version is at or past a published fix on the SAME
      # major.minor track. A genuinely old build, or one whose only published
      # fix sits on another track, is left in place -- the filter fails closed.
      # Whatever it removes is listed in the job summary, so this suppresses
      # nothing silently.
      - name: Normalize GOEXPERIMENT stdlib versions
        run: |
          set -euo pipefail
          cp osv.json osv.raw.json
          jq '
            def strip_pre: sub("-.*$"; "");
            def arr: strip_pre | split(".") | map(tonumber? // 0);
            def covered($base):
              [ .affected[]?.ranges[]?.events[]?.fixed // empty ]
              | map(arr)
              | any(.[0] == $base[0] and .[1] == $base[1] and .[2] <= $base[2]);
            .results |= map(
              .packages |= map(
                if (.package.name == "stdlib"
                    and (.package.version | test("-X:")))
                then
                  (.package.version | arr) as $base
                  | .vulnerabilities = [ .vulnerabilities[]? | select(covered($base) | not) ]
                else . end
              )
            )' osv.raw.json > osv.json

          jq -r '
            [ .results[].packages[]
              | . as $pkg
              | .vulnerabilities[]?
              | "\(.id) \($pkg.package.name)@\($pkg.package.version)"
            ] | unique | .[]' osv.raw.json | sort > all.before
          jq -r '
            [ .results[].packages[]
              | . as $pkg
              | .vulnerabilities[]?
              | "\(.id) \($pkg.package.name)@\($pkg.package.version)"
            ] | unique | .[]' osv.json | sort > all.after
          SUPPRESSED="$(comm -23 all.before all.after || true)"
          if [ -n "${SUPPRESSED}" ]; then
            {
              echo "## GOEXPERIMENT stdlib findings normalized"
              echo
              echo "Fixed on the same major.minor track as the build's base version:"
              echo
              echo '```'
              echo "${SUPPRESSED}"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
            echo "normalized $(echo "${SUPPRESSED}" | wc -l) GOEXPERIMENT stdlib findings"
          else
            echo "no GOEXPERIMENT stdlib findings to normalize"
          fi

      - name: Report and enforce
        run: |
          set -euo pipefail
          # One advisory can affect several module versions in the same bundle
          # (different binaries pin different versions), so a finding is an
          # (advisory, module@version) pair and the two counts differ. Report
          # both rather than calling every row an advisory.
          jq -r '
            [ .results[].packages[]
              | . as $pkg
              | .vulnerabilities[]?
              | "| `\(.id)` | `\($pkg.package.name)@\($pkg.package.version)` |"
            ] | unique | .[]' osv.json > findings.md || true
          FINDINGS="$(wc -l < findings.md)"
          ADVISORIES="$(jq -r '[.results[].packages[].vulnerabilities[]?.id] | unique | length' osv.json)"
          {
            echo "## Vulnerability scan of the shipped bundle"
            echo
            echo "Bundle built from \`${GITHUB_SHA}\`."
            echo
            if [ "${FINDINGS}" -eq 0 ]; then
              echo "No unignored advisories."
            else
              echo "**${ADVISORIES} advisories**, ${FINDINGS} findings across module versions."
              echo
              echo "| advisory | module |"
              echo "|---|---|"
              cat findings.md
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
          if [ "${FINDINGS}" -gt 0 ]; then
            echo "::error::${ADVISORIES} unignored advisories (${FINDINGS} findings) in the shipped bundle. Bump the affected component, or add a dated entry to osv-scanner.toml with a reason."
            exit 1
          fi

      - name: Upload scan output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osv-scan
          path: osv.json
          if-no-files-found: warn
