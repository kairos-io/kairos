name: release

# The release pipeline. Cuts artifacts from a tagged commit and
# publishes them to quay.io/kairos. Does NOT run the qemu suites --
# master gates every commit through the same tests already, so tagging
# a green master and re-testing on release only adds a false-signal
# window where a bad tag can slip out between test-pass and publish.
# If a release artifact ever diverges from what master built, that is
# a bug in the build process, not something re-running tests here
# would catch.
#
# Triggers: a push of a v* tag (manual releases), or workflow_dispatch
# on a tag ref (`gh workflow run release.yaml --ref <tag>`, which the
# weekly release workflow does). The guard job fails the run unless
# github.ref is a release tag (vX.Y.Z) or a release candidate tag
# (vX.Y.Z-rcN), and every other job waits on it, so a dispatch on a
# branch builds and pushes nothing.
#
# What runs:
#   - guard (refuses anything but vX.Y.Z and vX.Y.Z-rcN tags)
#   - create-release (creates the GH Release as a prerelease if it
#     does not exist yet, before any job uploads to it)
#   - unit-tests, lint, vulnerability-scan (fast source-level gates
#     that are still worth pinning at tag time)
#   - build-kairos / build-kairos-init / build-kcrypt-challenger
#     (binaries)
#   - build-image-kairos-init / build-image-kcrypt-challenger
#     (pushed to quay.io/kairos with the tag only)
#   - build-iso / build-iso-arm / build-iso-k3s / build-iso-k0s
#     (OS images pushed directly to quay.io/kairos, ISO/RAW artifacts
#     attached to the GH Release)
#   - upload-release (binary tarballs attached to the GH Release)
#   - promote (waits for a maintainer to approve the `release`
#     environment)
#   - publish (marks the GH Release as a full release; if the tag is
#     the highest final vX.Y.Z release it also copies kairos-init
#     and kcrypt-challenger :<tag> to :latest and marks the GH Release
#     as Latest; last, it starts release-notes-diff.yaml for the now
#     final release)
#
# Until publish runs, the release stays a prerelease and :latest
# keeps pointing at the previous release. A rejected or never
# approved run leaves the prerelease and its tag in place. A release
# candidate (a tag with a hyphen, such as v4.4.0-rc1) skips promote
# and publish, so it never becomes Latest. A backport (v4.3.2 after v4.4.0) is
# promoted to a full release but leaves :latest and Latest on the
# highest release.
#
# Matrix scope vs master: FIPS, UKI, ubuntu-20.04 and the unpinned
# amd64-standard cells all live in master.yaml, not here. They exist
# to feed qemu tests -- nothing about the tagged artifact needs them.
# v4.2.0 also released only Hadron (core amd64/arm64/rpi + per-k8s
# standard + Jetson).
#
# Tag scheme: OS images push directly with $FLAVOR_RELEASE-$VARIANT-
# $ARCH-$MODEL$K8S-$VERSION$UKI (no $FLAVOR- prefix, matches v4.2.0's
# shape). kairos-init and kcrypt-challenger get :<tag> from the build
# and :latest from publish.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  # Least-privilege baseline. A job that calls a reusable workflow
  # needing more declares its own job-level `permissions:` matching
  # exactly what that callee needs -- see _build-iso.yaml for the
  # reusable-workflow rationale (callers must cover callee).
  contents: read

concurrency:
  group: ci-release-${{ github.ref }}-${{ github.repository }}
  cancel-in-progress: false   # do NOT cancel a release run mid-way

jobs:
  # workflow_dispatch can be started on any ref, and the push trigger
  # matches any tag starting with v. Building from a branch would push
  # images tagged with the branch name, so stop here unless the ref is
  # a release tag (vX.Y.Z) or a release candidate tag (vX.Y.Z-rcN).
  guard:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require a release or release candidate tag
        env:
          REF: ${{ github.ref }}
        run: |
          re='^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$'
          if [[ ! "$REF" =~ $re ]]; then
            echo "::error::release.yaml runs only on a vX.Y.Z or vX.Y.Z-rcN tag, not $REF"
            exit 1
          fi
          echo "Releasing $REF"

  # Creates the GH Release as a prerelease, so it is not shown as
  # Latest while the build runs. reusable-factory.yaml and
  # _upload-release.yaml only upload to a release that already exists,
  # which is why every build-iso* job and upload-release need this job.
  # The weekly release workflow creates the prerelease itself; a tag
  # pushed by hand gets it here.
  create-release:
    needs: [guard]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # gh release create
    steps:
      - name: Create the prerelease if missing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" --repo "$REPO" --verify-tag --prerelease --title "$TAG" --notes "Release $TAG"
          fi

  unit-tests:
    needs: [guard]
    uses: ./.github/workflows/_unit-tests.yaml

  lint:
    needs: [guard]
    uses: ./.github/workflows/_lint.yaml

  vulnerability-scan:
    needs: [guard]
    uses: ./.github/workflows/release-scan.yml

  # Dynamic k3s/k0s matrix pre-steps: query the upstream GitHub API
  # for release tags and keep the latest patch of each of the top
  # three minors. Feeds build-iso-k3s / build-iso-k0s below. Same
  # jq expression release-legacy.yaml carried before retirement.
  get-k3s-versions:
    needs: [guard]
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      kubernetes_versions: ${{ steps.get.outputs.kubernetes_versions }}
    steps:
      - name: Install jq + curl
        run: sudo apt-get update && sudo apt-get install -y jq curl
      - name: Fetch latest k3s releases
        id: get
        run: |
          kubernetes_versions=$(curl -s https://api.github.com/repos/k3s-io/k3s/releases | jq -r '
            [.[] | select(.prerelease == false and .draft == false and (.tag_name | test("rc") | not)) | .tag_name]
            | map(select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+\\+k3s[0-9]+$")))
            | map({
               version: .,
               minor: (split(".")[1:2]|join("")),
               patch: (split(".")[2:3]|join("")|split("+")[0]),
               revision: (split("+k3s")[1])
             })
           | group_by(.minor)
           | map(sort_by([(.patch | tonumber), (.revision | tonumber)]) | reverse | .[0])
           | sort_by(.minor | tonumber)
           | reverse
           | .[0:3]
           | map(.version)
          ' | jq -c '.')
          echo "kubernetes_versions=$kubernetes_versions" >> "$GITHUB_OUTPUT"

  get-k0s-versions:
    needs: [guard]
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      kubernetes_versions: ${{ steps.get.outputs.kubernetes_versions }}
    steps:
      - name: Install jq + curl
        run: sudo apt-get update && sudo apt-get install -y jq curl
      - name: Fetch latest k0s releases
        id: get
        run: |
          kubernetes_versions=$(curl -s https://api.github.com/repos/k0sproject/k0s/releases | jq -r '
           [.[] | select(.prerelease == false and .draft == false and (.tag_name | test("rc") | not)) | .tag_name]
           | map(select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+\\+k0s\\.[0-9]+$")))
           | map({
             version: .,
             minor: (split(".")[1:2]|join("")),
             patch: (split(".")[2:3]|join("")|split("+")[0]),
             revision: (split("+k0s.")[1])
           })
           | group_by(.minor)
           | map(sort_by([(.patch | tonumber), (.revision | tonumber)]) | reverse | .[0])
           | sort_by(.minor | tonumber)
           | reverse
           | .[0:3]
           | map(.version)
           ' | jq -c '.')
          echo "kubernetes_versions=$kubernetes_versions" >> "$GITHUB_OUTPUT"

  # kairos-init pipe: gates build-iso + tests.
  #
  # matrix_scope: full -- master.yaml calls these same two reusable
  # workflows with the same value, since master builds riscv64 too
  # (see master.yaml's own comment). "full" names the architecture set
  # this produces, not which workflow calls it.
  build-kairos:
    needs: [guard]
    uses: ./.github/workflows/_build-kairos.yaml
    with:
      matrix_scope: full

  build-kairos-init:
    needs: build-kairos
    uses: ./.github/workflows/_build-kairos-init.yaml
    with:
      matrix_scope: full

  build-image-kairos-init:
    needs: [build-kairos-init, unit-tests, lint]
    uses: ./.github/workflows/_build-image-kairos-init.yaml
    permissions:
      contents: read
      packages: write
    with:
      image_registry: quay.io/kairos
      image_tag: ${{ github.ref_name }}
      push: true
      registry_login: quay
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}

  # kcrypt-challenger pipe: parallel to the kairos pipe. Its image is
  # published for downstream consumers (the encryption story), not for
  # anything else in this pipeline to pull.
  build-kcrypt-challenger:
    needs: [guard]
    uses: ./.github/workflows/_build-kcrypt-challenger.yaml
    with:
      matrix_scope: release

  build-image-kcrypt-challenger:
    needs: [build-kcrypt-challenger, unit-tests, lint]
    uses: ./.github/workflows/_build-image-kcrypt-challenger.yaml
    permissions:
      contents: read
      packages: write
    with:
      image_registry: quay.io/kairos
      image_tag: ${{ github.ref_name }}
      push: true
      registry_login: quay
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}

  # Only the Hadron core cell here. amd64-standard (unpinned k3s),
  # amd64-core-fips, the UKI cells, and amd64-core-ubuntu-20.04 all
  # exist in master.yaml/pr-full.yaml to feed qemu tests and are omitted
  # from the release matrix -- v4.2.0 released none of them. No
  # trusted boot cell is released at all: CI signs UKIs with the test
  # keys in tests/assets/keys, whose private halves are public, so a
  # released UKI would prove nothing about who built it. Users build
  # trusted boot images with keys they control.
  build-iso:
    needs: [create-release, build-image-kairos-init, vulnerability-scan]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: 'amd64-core', arch: 'amd64', base_image: 'ghcr.io/kairos-io/hadron:v0.6.3', model: 'generic', iso: true, trusted_boot: false, kubernetes_distro: '', fips: false}
    name: build-iso / ${{ matrix.name }}
    uses: ./.github/workflows/_build-iso.yaml
    permissions:
      contents: write
      packages: write
      id-token: write
      security-events: write
      actions: read
    with:
      name: ${{ matrix.name }}
      kairos_init_image: quay.io/kairos/kairos-init:${{ github.ref_name }}
      arch: ${{ matrix.arch }}
      base_image: ${{ matrix.base_image }}
      model: ${{ matrix.model }}
      iso: ${{ matrix.iso }}
      trusted_boot: ${{ matrix.trusted_boot }}
      kubernetes_distro: ${{ matrix.kubernetes_distro }}
      fips: ${{ matrix.fips }}
      registry_domain: 'quay.io'
      registry_namespace: 'kairos'
      # Drop the $FLAVOR- prefix so the pushed tag matches v4.2.0's
      # user-facing shape: quay.io/kairos/hadron:v0.6.3-core-amd64-generic-v4.3.0.
      custom_tag_format: '$FLAVOR_RELEASE-$VARIANT-$ARCH-$MODEL-$VERSION$K8S$UKI'
      custom_artifact_format: 'kairos-$FLAVOR-$FLAVOR_RELEASE-$VARIANT-$ARCH-$MODEL-$VERSION$K8S$UKI'
      # Belt and suspenders: the _build-iso.yaml default is already
      # false, but pin it here so a future default flip cannot bake the
      # CI-only sysext test extensions onto a shipped ISO.
      test_sysext_overlay: false
      release: true
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}

  build-iso-arm:
    needs: [create-release, build-image-kairos-init, vulnerability-scan]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: 'arm64-core', arch: 'arm64', base_image: 'ghcr.io/kairos-io/hadron:v0.6.3', model: 'generic', iso: true, trusted_boot: false, kubernetes_distro: ''}
          - {name: 'arm64-rpi3', arch: 'arm64', base_image: 'ghcr.io/kairos-io/hadron:v0.6.3', model: 'rpi3', iso: false, trusted_boot: false, kubernetes_distro: ''}
          - {name: 'arm64-rpi4', arch: 'arm64', base_image: 'ghcr.io/kairos-io/hadron:v0.6.3', model: 'rpi4', iso: false, trusted_boot: false, kubernetes_distro: ''}
          # Nvidia Jetson cells: ship as container images (iso: false)
          # to the same target v4.2.0 used -- factory-action derives the
          # repo segment from the base_image flavor (ubuntu:22.04 ->
          # "ubuntu"), so no registry_repository override. Tag layout is
          # 22.04-core-arm64-<model>-<version>, matching v4.2.0.
          # ci-temp-images is deliberately not used here: that name is
          # scoped to CI runs pushing artifacts too big for ghcr, not to
          # release-tag artifacts.
          - name: 'arm64-nvidia-agx-orin'
            arch: 'arm64'
            base_image: 'ubuntu:22.04'
            model: 'nvidia-jetson-agx-orin'
            iso: false
            trusted_boot: false
            kubernetes_distro: ''
          - name: 'arm64-nvidia-orin-nx'
            arch: 'arm64'
            base_image: 'ubuntu:22.04'
            model: 'nvidia-jetson-orin-nx'
            iso: false
            trusted_boot: false
            kubernetes_distro: ''
    name: build-iso-arm / ${{ matrix.name }}
    uses: ./.github/workflows/_build-iso.yaml
    permissions:
      contents: write
      packages: write
      id-token: write
      security-events: write
      actions: read
    with:
      name: ${{ matrix.name }}
      kairos_init_image: quay.io/kairos/kairos-init:${{ github.ref_name }}
      arch: ${{ matrix.arch }}
      base_image: ${{ matrix.base_image }}
      model: ${{ matrix.model }}
      iso: ${{ matrix.iso }}
      trusted_boot: ${{ matrix.trusted_boot }}
      kubernetes_distro: ${{ matrix.kubernetes_distro }}
      registry_domain: 'quay.io'
      registry_namespace: 'kairos'
      # Drop the $FLAVOR- prefix so the pushed tag matches v4.2.0's shape.
      custom_tag_format: '$FLAVOR_RELEASE-$VARIANT-$ARCH-$MODEL-$VERSION$K8S$UKI'
      custom_artifact_format: 'kairos-$FLAVOR-$FLAVOR_RELEASE-$VARIANT-$ARCH-$MODEL-$VERSION$K8S$UKI'
      # rpi3/rpi4 ship as -img OCI artifacts (raw disk image wrapped in a
      # scratch container so downstream flashers can docker pull + extract).
      # Jetson deliverable is the base container only; the L4T rootfs is
      # large enough that materializing raw OOM-kills the runner during
      # auroraboot's copy-into-tempdir step.
      raw: ${{ matrix.model == 'rpi3' || matrix.model == 'rpi4' }}
      grype: ${{ !startsWith(matrix.model, 'nvidia-jetson') }}
      sbom: ${{ !startsWith(matrix.model, 'nvidia-jetson') }}
      cleanup: ${{ startsWith(matrix.model, 'nvidia-jetson') }}
      # Belt and suspenders: the _build-iso.yaml default is already
      # false, but pin it here so a future default flip cannot bake the
      # CI-only sysext test extensions onto a shipped ISO.
      test_sysext_overlay: false
      release: true
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}

  # Per-k8s-version standard ISOs. Both matrices are dynamic:
  # kubernetes_version is fed by the get-*-versions job's output.
  # A cell per (top-3 minor) x (k3s or k0s), each a full standard ISO
  # pushed to quay with tag layout `v0.5.1-standard-amd64-generic-
  # <k3s|k0s>-<k8s-version>-<version>` (matches v4.2.0).
  build-iso-k3s:
    needs: [create-release, build-image-kairos-init, vulnerability-scan, get-k3s-versions]
    strategy:
      fail-fast: false
      matrix:
        kubernetes_version: ${{ fromJson(needs.get-k3s-versions.outputs.kubernetes_versions) }}
    uses: ./.github/workflows/_build-iso.yaml
    permissions:
      contents: write
      packages: write
      id-token: write
      security-events: write
      actions: read
    with:
      name: 'amd64-standard-k3s-${{ matrix.kubernetes_version }}'
      kairos_init_image: quay.io/kairos/kairos-init:${{ github.ref_name }}
      arch: 'amd64'
      base_image: 'ghcr.io/kairos-io/hadron:v0.6.3'
      model: 'generic'
      iso: true
      trusted_boot: false
      kubernetes_distro: 'k3s'
      kubernetes_version: ${{ matrix.kubernetes_version }}
      registry_domain: 'quay.io'
      registry_namespace: 'kairos'
      custom_tag_format: '$FLAVOR_RELEASE-$VARIANT-$ARCH-$MODEL-$VERSION$K8S$UKI'
      custom_artifact_format: 'kairos-$FLAVOR-$FLAVOR_RELEASE-$VARIANT-$ARCH-$MODEL-$VERSION$K8S$UKI'
      # Belt and suspenders: the _build-iso.yaml default is already
      # false, but pin it here so a future default flip cannot bake the
      # CI-only sysext test extensions onto a shipped ISO.
      test_sysext_overlay: false
      release: true
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}

  # arm64 mirror of build-iso-k3s. v4.2.0 shipped standard-arm64-generic
  # and standard-arm64-rpi4 for each of the top-3 k3s minors. k0s was
  # amd64-only in v4.2.0 -- no arm64 k0s counterpart here.
  build-iso-k3s-arm:
    needs: [create-release, build-image-kairos-init, vulnerability-scan, get-k3s-versions]
    strategy:
      fail-fast: false
      matrix:
        model: ['generic', 'rpi4']
        kubernetes_version: ${{ fromJson(needs.get-k3s-versions.outputs.kubernetes_versions) }}
    uses: ./.github/workflows/_build-iso.yaml
    permissions:
      contents: write
      packages: write
      id-token: write
      security-events: write
      actions: read
    with:
      name: 'arm64-standard-${{ matrix.model }}-k3s-${{ matrix.kubernetes_version }}'
      kairos_init_image: quay.io/kairos/kairos-init:${{ github.ref_name }}
      arch: 'arm64'
      base_image: 'ghcr.io/kairos-io/hadron:v0.6.3'
      model: ${{ matrix.model }}
      # v4.2.0 released the ISO for generic and only the container image
      # for rpi4. rpi4 also gets raw:true so the -img OCI wrapper ships
      # alongside the base image, matching what the core rpi4 cell does.
      iso: ${{ matrix.model == 'generic' }}
      raw: ${{ matrix.model == 'rpi4' }}
      trusted_boot: false
      kubernetes_distro: 'k3s'
      kubernetes_version: ${{ matrix.kubernetes_version }}
      registry_domain: 'quay.io'
      registry_namespace: 'kairos'
      custom_tag_format: '$FLAVOR_RELEASE-$VARIANT-$ARCH-$MODEL-$VERSION$K8S$UKI'
      custom_artifact_format: 'kairos-$FLAVOR-$FLAVOR_RELEASE-$VARIANT-$ARCH-$MODEL-$VERSION$K8S$UKI'
      # Belt and suspenders: the _build-iso.yaml default is already
      # false, but pin it here so a future default flip cannot bake the
      # CI-only sysext test extensions onto a shipped ISO.
      test_sysext_overlay: false
      release: true
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}

  build-iso-k0s:
    needs: [create-release, build-image-kairos-init, vulnerability-scan, get-k0s-versions]
    strategy:
      fail-fast: false
      matrix:
        kubernetes_version: ${{ fromJson(needs.get-k0s-versions.outputs.kubernetes_versions) }}
    uses: ./.github/workflows/_build-iso.yaml
    permissions:
      contents: write
      packages: write
      id-token: write
      security-events: write
      actions: read
    with:
      name: 'amd64-standard-k0s-${{ matrix.kubernetes_version }}'
      kairos_init_image: quay.io/kairos/kairos-init:${{ github.ref_name }}
      arch: 'amd64'
      base_image: 'ghcr.io/kairos-io/hadron:v0.6.3'
      model: 'generic'
      iso: true
      trusted_boot: false
      kubernetes_distro: 'k0s'
      kubernetes_version: ${{ matrix.kubernetes_version }}
      registry_domain: 'quay.io'
      registry_namespace: 'kairos'
      custom_tag_format: '$FLAVOR_RELEASE-$VARIANT-$ARCH-$MODEL-$VERSION$K8S$UKI'
      custom_artifact_format: 'kairos-$FLAVOR-$FLAVOR_RELEASE-$VARIANT-$ARCH-$MODEL-$VERSION$K8S$UKI'
      # Belt and suspenders: the _build-iso.yaml default is already
      # false, but pin it here so a future default flip cannot bake the
      # CI-only sysext test extensions onto a shipped ISO.
      test_sysext_overlay: false
      release: true
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}

  upload-release:
    # Uploads every tarball to the GitHub Release. Waits on the full
    # build fan-out so a broken cell blocks the tag advance.
    needs:
      - create-release
      - unit-tests
      - lint
      - vulnerability-scan
      - build-iso
      - build-iso-arm
      - build-iso-k3s
      - build-iso-k3s-arm
      - build-iso-k0s
      - build-kcrypt-challenger
      - build-image-kairos-init
      - build-image-kcrypt-challenger
    uses: ./.github/workflows/_upload-release.yaml
    permissions:
      contents: write
      id-token: write

  # Waits for a maintainer to approve the `release` environment. Until
  # then the GH Release is a prerelease and :latest points at the
  # previous release. A rejected or expired approval fails this job and
  # skips publish. Release candidates (a hyphen in the tag, such as
  # v4.4.0-rc1) skip this job and stay prereleases. The guard job and
  # the `if:` below together admit only a vX.Y.Z tag here.
  promote:
    needs: [upload-release]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Record the approval
        env:
          TAG: ${{ github.ref_name }}
        run: echo "::notice::$TAG approved"

  # Publishes an approved release. Only the highest final vX.Y.Z
  # release (by `sort -V`), counting this tag, gets :latest and the
  # Latest badge. Any other tag, such as a backport v4.3.2 cut after
  # v4.4.0, becomes a full release with --latest=false and leaves
  # :latest on the highest release. The comparison uses final releases
  # and not all tags, so a higher tag that is pending or was rejected
  # does not keep an approved release off Latest. Releases are read
  # through the API because this job has no checkout. `docker buildx
  # imagetools create` copies the manifest by reference, so :latest has
  # the same digest as :<tag>, as promote-images does in master.yaml.
  #
  # Two approved tags would otherwise publish at the same time, and an
  # older one that read the tag list before a newer tag existed could
  # finish last and move :latest and Latest back to itself. The
  # repository-wide group runs one publish at a time. It lives on this
  # job and not on promote, which can hold a group for days while it
  # waits for approval. GitHub keeps one pending job per group and
  # cancels an older pending one, which takes three approvals within the
  # few seconds a publish lasts.
  publish:
    needs: [promote]
    runs-on: ubuntu-latest
    concurrency:
      group: release-publish-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write  # gh release edit
      # gh workflow run release-notes-diff.yaml. Its release trigger does
      # not fire for a release edited with this job's GITHUB_TOKEN.
      actions: write
    steps:
      - name: Find the highest final release
        id: highest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          finals=$(gh release list --repo "$REPO" \
            --exclude-pre-releases --exclude-drafts --limit 200 \
            --json tagName --jq '.[].tagName')
          highest=$({ printf '%s\n' "$finals"; echo "$TAG"; } \
            | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } \
            | sort -V | tail -n 1)
          echo "highest=$highest" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == "$highest" ]]; then
            echo "is_highest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_highest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG is older than the highest final release $highest, so :latest and Latest stay on $highest"
          fi
      - name: Login to quay.io
        if: steps.highest.outputs.is_highest == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      - name: Point kairos-init and kcrypt-challenger :latest at the tag
        if: steps.highest.outputs.is_highest == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for img in kairos-init kcrypt-challenger; do
            src="quay.io/kairos/${img}:${TAG}"
            dst="quay.io/kairos/${img}:latest"
            echo "Promoting $src -> $dst"
            docker buildx imagetools create -t "$dst" "$src"
          done
      - name: Mark the GH Release as a full release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          IS_HIGHEST: ${{ steps.highest.outputs.is_highest }}
        run: |
          set -euo pipefail
          if [[ "$IS_HIGHEST" == "true" ]]; then
            gh release edit "$TAG" --repo "$REPO" --prerelease=false --latest
          else
            gh release edit "$TAG" --repo "$REPO" --prerelease=false --latest=false
          fi
      - name: Start the release notes diff
        # release-notes-diff.yaml diffs against the previous final release
        # and looks the tag up among final releases, so it runs only once
        # the release is final.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh workflow run release-notes-diff.yaml --repo "$REPO" --ref master -f tag="$TAG"
