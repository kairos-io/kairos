name: AuroraBoot tests

# Reusable step: the test jobs of the auroraboot/ Go module.
#
# unit-tests, vet-tagged and helm-chart need nothing but the source. The e2e,
# raw-disk and UI jobs run the AuroraBoot image that _build-image-auroraboot.yaml
# built from the same commit and uploaded as the artifact named by
# image_artifact, so the caller runs that workflow first and lists it in
# `needs`.
#
# Booting a UKI ISO is not tested here. _uki-test.yaml boots a UKI ISO that is
# produced by `auroraboot build-uki` from the same AuroraBoot build, so a copy
# of that test would run the same thing twice.

on:
  workflow_call:
    inputs:
      image_artifact:
        description: 'Name of the workflow artifact that holds the amd64 AuroraBoot image archive'
        type: string
        default: auroraboot-image-amd64
      e2e:
        description: 'Run the slow jobs that boot or drive the AuroraBoot image (e2e, raw disk, UI, phone-home). The fast jobs always run.'
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    working-directory: auroraboot

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    # The store specs that need concurrent writers run against this server;
    # they are skipped when AURORABOOT_TEST_POSTGRES_DSN is unset.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: auroraboot/go.mod
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: auroraboot/ui/package-lock.json
      - name: Build UI bundle (embedded via go:embed)
        run: make ui-build
      - name: Run UI tests
        run: make ui-test
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          driver-opts: network=host
      - name: Run tests
        env:
          AURORABOOT_TEST_POSTGRES_DSN: postgres://postgres:test@localhost:5432/postgres?sslmode=disable
        run: |
          sudo env AURORABOOT_TEST_POSTGRES_DSN="$AURORABOOT_TEST_POSTGRES_DSN" go run github.com/onsi/ginkgo/v2/ginkgo --tags ui -v -r -p --timeout=2h --skip-package ./e2e ./...

  vet-tagged:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: auroraboot/go.mod
      # Running the suite needs kind, docker and kubectl and takes up to 30
      # minutes, so this type-checks it instead. No other job passes
      # operator_e2e, and go vet applies no build tags of its own, so without
      # this step nothing here compiles test/operator at all. Needs no UI
      # bundle (internal/ui builds from embed_noui.go without the ui tag) and
      # no system packages.
      - name: Type-check build-tagged trees
        run: make vet-tagged

  helm-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e  # v5
        with:
          version: v4.3.2
      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version 1.2.1 --verify=false
      - name: Lint chart
        run: make helm-chart-lint
      - name: Run chart unit tests
        run: make helm-chart-test

  e2e-tests:
    if: inputs.e2e
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: auroraboot/go.mod
      # docker/setup-qemu-action runs the binfmt container on the default bridge,
      # which the former self-hosted runners failed with "bridge port not forwarding after 200ms".
      # binfmt only writes to /proc/sys/fs/binfmt_misc, so give it the host
      # network and never create a bridge port. Same reason as the network=host
      # driver-opt on buildx below.
      # Pinned by digest: this step installs the emulators every cross-arch
      # build then depends on, so it must not change under us.
      # tonistiigi/binfmt:qemu-v9.2.2
      - name: Set up QEMU
        run: docker run --rm --privileged --network host docker.io/tonistiigi/binfmt@sha256:1b804311fe87047a4c96d38b4b3ef6f62fca8cd125265917a9e3dc3c996c39e6 --install all
      - name: Prefer IPv4
        uses: ./.github/actions/prefer-ipv4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          driver-opts: network=host
      - name: Build local image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          push: false
          load: true
          context: auroraboot
          build-contexts: kairos=.
          file: auroraboot/Dockerfile
          platforms: linux/amd64
          tags: auroraboot:test
      - name: Ensure loop device nodes
        # losetup asks the kernel for a free loop index and then opens
        # /dev/loopN. On the former shared kvm runners the loop pool leaked across
        # jobs: a previous run could leave the kernel index free while the
        # /dev/loopN node has been unlinked (LOOP_CTL_DEL, or a container
        # bind-mounting /dev). losetup then fails with
        # "device node /dev/loopN is lost. You may use mknod(1) to recover it."
        # Pre-create the nodes so any recycled index has a matching /dev entry.
        run: |
          sudo bash -c '
            for i in $(seq 0 15); do
              [ -e /dev/loop$i ] || mknod -m 660 /dev/loop$i b 7 $i
              chown root:disk /dev/loop$i 2>/dev/null || true
            done
          '
          ls -la /dev/loop*
      - name: Run e2e tests
        # /tmp is a RAM-backed tmpfs capped at half the memory on 26.04
        # runners, too small for the raw and GCE disks the specs stage there.
        # TMPDIR moves os.MkdirTemp onto the runner's disk.
        # EXTENSIONS_AGENT_IMAGE turns on the extensions agent-flow tier. The
        # `extension` phone-home command shipped in Kairos v4.4.0.
        env:
          TMPDIR: ${{ runner.temp }}
          EXTENSIONS_AGENT_IMAGE: quay.io/kairos/hadron:v0.6.3-core-amd64-generic-v4.4.0
        run: |
          go run github.com/onsi/ginkgo/v2/ginkgo -v -r -p --timeout=2h --label-filter "e2e" ./e2e

  test-bootable-raw-efi:
    if: inputs.e2e
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y ovmf libvirt-clients libvirt-daemon-system libvirt-daemon virtinst bridge-utils qemu-system-x86 qemu-utils acl udev libpcsclite-dev
      - name: Grant access to /dev/kvm
        run: |
          echo "KERNEL==\"kvm\", GROUP=\"$(id -gn)\", MODE=\"0660\", OPTIONS+=\"static_node=kvm\"" | sudo tee /etc/udev/rules.d/99-kvm-access.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          test -w /dev/kvm
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: auroraboot/go.mod
      - name: Prefer IPv4
        uses: ./.github/actions/prefer-ipv4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          driver-opts: network=host
      - name: Download image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ inputs.image_artifact }}
          path: /tmp/
      - name: Load image
        run: docker load -i /tmp/auroraboot-image.tar
      - name: Generate raw image
        run: |
          mkdir build
          docker run --rm --privileged \
          --network=host \
          -v "$PWD/build/":/output \
          auroraboot:ci \
          --debug \
          --set "disable_http_server=true" --set "disable_netboot=true" --set "state_dir=/output" \
          --set "disk.efi=true" \
          --set "disk.size=16000" \
          --set "container_image=oci://quay.io/kairos/ubuntu:24.04-core-amd64-generic-v3.7.2"
      - name: Find OVMF firmware
        uses: ./.github/actions/find-ovmf-firmware
        id: find_ovmf
      - name: Test raw image is bootable
        env:
          KVM: true
          FIRMWARE: ${{ steps.find_ovmf.outputs.firmware }}
          EFIVARS_EMPTY: true
          TMPDIR: ${{ runner.temp }}
        run: |
          export RAW_IMAGE=$(find "$PWD/build" -name '*.raw')
          go run github.com/onsi/ginkgo/v2/ginkgo run --label-filter "raw-bootable" -v --fail-fast -r ./e2e

  test-bootable-raw-efi-boot-active:
    if: inputs.e2e
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - layout: boot-active
            extra_args: --set disk.boot_active=true
            expect_passive: "true"
            no_recovery: "false"
          - layout: single-image
            extra_args: --set disk.boot_active=true --set disk.no_recovery=true --set disk.state_slots=1
            expect_passive: "false"
            no_recovery: "true"
    name: test-bootable-raw-efi-boot-active (${{ matrix.layout }})
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y ovmf libvirt-clients libvirt-daemon-system libvirt-daemon virtinst bridge-utils qemu-system-x86 qemu-utils acl udev libpcsclite-dev
      - name: Grant access to /dev/kvm
        run: |
          echo "KERNEL==\"kvm\", GROUP=\"$(id -gn)\", MODE=\"0660\", OPTIONS+=\"static_node=kvm\"" | sudo tee /etc/udev/rules.d/99-kvm-access.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          test -w /dev/kvm
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: auroraboot/go.mod
      - name: Prefer IPv4
        uses: ./.github/actions/prefer-ipv4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          driver-opts: network=host
      - name: Download image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ inputs.image_artifact }}
          path: /tmp/
      - name: Load image
        run: docker load -i /tmp/auroraboot-image.tar
      - name: Generate raw image
        env:
          EXTRA_ARGS: ${{ matrix.extra_args }}
        run: |
          mkdir build
          # EXTRA_ARGS holds several words on purpose.
          # shellcheck disable=SC2086
          docker run --rm --privileged \
          --network=host \
          -v "$PWD/build/":/output \
          auroraboot:ci \
          --debug \
          --set "disable_http_server=true" --set "disable_netboot=true" --set "state_dir=/output" \
          --set "disk.efi=true" \
          $EXTRA_ARGS \
          --set "disk.size=16000" \
          --set "container_image=oci://quay.io/kairos/ubuntu:24.04-core-amd64-generic-v3.7.2"
      - name: Find OVMF firmware
        uses: ./.github/actions/find-ovmf-firmware
        id: find_ovmf
      - name: Test raw image is bootable
        env:
          KVM: true
          FIRMWARE: ${{ steps.find_ovmf.outputs.firmware }}
          EFIVARS_EMPTY: true
          BOOT_ACTIVE: "true"
          EXPECT_PASSIVE: ${{ matrix.expect_passive }}
          NO_RECOVERY: ${{ matrix.no_recovery }}
        run: |
          export RAW_IMAGE=$(find "$PWD/build" -name '*.raw')
          go run github.com/onsi/ginkgo/v2/ginkgo run --label-filter "raw-bootable" -v --fail-fast -r ./e2e

  test-bootable-raw-bios:
    if: inputs.e2e
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y ovmf libvirt-clients libvirt-daemon-system libvirt-daemon virtinst bridge-utils qemu-system-x86 qemu-utils acl udev libpcsclite-dev
      - name: Grant access to /dev/kvm
        run: |
          echo "KERNEL==\"kvm\", GROUP=\"$(id -gn)\", MODE=\"0660\", OPTIONS+=\"static_node=kvm\"" | sudo tee /etc/udev/rules.d/99-kvm-access.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          test -w /dev/kvm
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: auroraboot/go.mod
      - name: Prefer IPv4
        uses: ./.github/actions/prefer-ipv4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          driver-opts: network=host
      - name: Download image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ inputs.image_artifact }}
          path: /tmp/
      - name: Load image
        run: docker load -i /tmp/auroraboot-image.tar
      - name: Generate raw image
        run: |
          mkdir build
          docker run --rm --privileged \
          --network=host \
          -v "$PWD/build/":/output \
          auroraboot:ci \
          --debug \
          --set "disable_http_server=true" --set "disable_netboot=true" --set "state_dir=/output" \
          --set "disk.bios=true" \
          --set "disk.size=16000" \
          --set "container_image=oci://quay.io/kairos/ubuntu:24.04-core-amd64-generic-v3.7.2"
      - name: Test raw image is bootable
        env:
          KVM: true
          TMPDIR: ${{ runner.temp }}
        run: |
          export RAW_IMAGE=$(find "$PWD/build" -name '*.raw')
          go run github.com/onsi/ginkgo/v2/ginkgo run --label-filter "raw-bootable" -v --fail-fast -r ./e2e

  test-ui-builder:
    if: inputs.e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          driver-opts: network=host
      - name: Download image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ inputs.image_artifact }}
          path: /tmp/
      - name: Load image
        run: docker load -i /tmp/auroraboot-image.tar
      - name: Cypress run
        uses: cypress-io/github-action@0ed14f5d30c4ad6e5e8ffb6f57dbb69150137a3f  # v7.4.10
        with:
          working-directory: auroraboot/e2e/web/
          start: docker run --network=host --rm auroraboot:ci web
          wait-on: 'http://localhost:8080'
          wait-on-timeout: 60
      - name: Upload Cypress screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: cypress-screenshots
          path: auroraboot/e2e/web/cypress/screenshots/

  phonehome-vm:
    if: inputs.e2e
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y ovmf libvirt-clients libvirt-daemon-system libvirt-daemon virtinst bridge-utils qemu-system-x86 qemu-utils acl udev swtpm libpcsclite-dev
      - name: Grant access to /dev/kvm
        run: |
          echo "KERNEL==\"kvm\", GROUP=\"$(id -gn)\", MODE=\"0660\", OPTIONS+=\"static_node=kvm\"" | sudo tee /etc/udev/rules.d/99-kvm-access.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          test -w /dev/kvm
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: auroraboot/go.mod
      - name: Prefer IPv4
        uses: ./.github/actions/prefer-ipv4
      - name: Find OVMF firmware
        uses: ./.github/actions/find-ovmf-firmware
        id: find_ovmf
        with:
          prefer_secboot: false
      - name: Run phonehome VM tier
        env:
          KVM: true
          FIRMWARE: ${{ steps.find_ovmf.outputs.firmware }}
          # /tmp is a RAM-backed tmpfs on these runners, too small for the
          # VM disks and built artifacts.
          TMPDIR: ${{ runner.temp }}
        run: |
          go run github.com/onsi/ginkgo/v2/ginkgo -v --label-filter phonehome-vm --timeout 100m --grace-period 10m ./e2e
      - name: Upload phonehome logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: phonehome-logs
          path: auroraboot/e2e/logs/phonehome
          if-no-files-found: ignore
          retention-days: 7
