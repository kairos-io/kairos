name: QA gate

# The `QA: pass` label marks that QA is done, and merging requires it.
# Make the `qa-gate` job a required status check in the master ruleset:
#
# - the PR has the `QA: pass` label: the job passes
# - it does not: the job fails
# - merge_group: the job passes, because a PR only gets into the queue
#   after the job passed on it, and the queue needs every required check
#   reported on the merge group commit too
#
# It reruns when the label is added or removed and on every push. It
# reads only the event payload, checks nothing out and needs no token
# permissions, so it runs on the plain pull_request trigger.

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  merge_group:

permissions: {}

jobs:
  qa-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Require the QA pass label
        if: "${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'QA: pass') }}"
        run: |
          echo "::error::This pull request does not have the 'QA: pass' label."
          exit 1
      - name: QA pass label present
        run: echo "QA gate passed"
