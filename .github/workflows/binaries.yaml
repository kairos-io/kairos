name: Binaries

# CI-side of the release pipeline: build + archive binaries and container
# images for every PR and every push to master. Delegates to the reusable
# workflow that release.yaml also uses, so PR artifacts and release
# artifacts share the same build steps.
#
# Tag pushes are handled by release.yaml (which needs to sequence the
# image push before the ISO build).

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/CODEOWNERS'
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/CODEOWNERS'

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-binaries-${{ github.head_ref || github.ref }}-${{ github.repository }}
  cancel-in-progress: true

jobs:
  binaries:
    uses: ./.github/workflows/_binaries-reusable.yaml
    with:
      matrix_scope: ci
      image_registry: ghcr.io/kairos-io/kairos
      image_tag: >-
        ${{ github.event_name == 'pull_request'
            && format('pr-{0}', github.event.pull_request.number)
            || 'master' }}
      push_images: ${{ github.event_name == 'push' }}
      # PR builds verify container images compile but do not push. Only
      # same-repo master pushes need registry credentials.
      registry_login: >-
        ${{ github.event_name == 'push' && 'ghcr' || '' }}
    secrets: inherit
