name: CodeQL

# Static analysis of the Go code, the workflows and the JavaScript, on
# every pull request and push to master.
#
# This replaces CodeQL's default setup, which cannot analyze the Go code:
# `go build ./...` fails on a fresh clone until `make
# kairos-init-embed-stubs` creates the files kairos-init embeds, so the
# Go analysis here builds the way the Makefile does. Default setup has to
# be off for this workflow's results to be accepted.

on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    # Weekly, so new queries run against code that has not changed.
    - cron: '30 3 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.head_ref || github.ref }}-${{ github.repository }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build Go code
        if: matrix.language == 'go'
        run: |
          make kairos-init-embed-stubs
          CGO_ENABLED=0 go build ./...

      - name: Analyze
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4.38.0
        with:
          category: /language:${{ matrix.language }}
