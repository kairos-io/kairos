name: Release (legacy)

# This is the pre-monorepo release pipeline. It fires alongside
# release.yaml on every v* tag push, exclusively to keep the
# k3s/k0s per-version ISO matrix building until that dynamic
# pre-step is ported into release.yaml. Once ported, this file
# gets deleted. Everything else in this workflow duplicates
# release.yaml and is expected to; the intent is safety, not
# minimalism.

on:
  push:
    tags:
      - v*
permissions: read-all
jobs:
  # Release gate: refuse to publish artifacts containing known-vulnerable
  # dependencies. Scans the binaries this release will actually ship, for the
  # kairos-init version pinned in images/Dockerfile. See
  # .github/workflows/release-scan.yml and
  # https://github.com/kairos-io/kairos/issues/3985.
  vulnerability-scan:
    uses: ./.github/workflows/release-scan.yml

  # Build every binary (default + FIPS matrix) and push the two container
  # images (kcrypt-challenger, kairos-init) to quay under the release tag.
  # Same reusable workflow the PR / master builds use, just parameterised
  # for the release destination. Downstream jobs `needs: binaries` so no
  # ISO/UKI factory-action job starts until the kairos-init image is
  # available for images/Dockerfile to pull.
  binaries:
    uses: ./.github/workflows/_binaries-reusable.yaml
    with:
      matrix_scope: release
      image_registry: quay.io/kairos
      image_tag: ${{ github.ref_name }}
      image_extra_tag: latest
      push_images: true
      registry_login: quay
    secrets: inherit

  # Attach the per-arch archives + combined checksums to the GitHub Release
  # the tag created.
  release-upload:
    needs: binaries
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Download every arch's archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: 'binaries-linux-*'
          path: dist/download
      - name: Consolidate
        run: |
          set -euo pipefail
          mkdir -p dist/release
          find dist/download -name '*.tar.gz' -exec cp {} dist/release/ \;
          find dist/download -name 'checksums-*.txt' -exec cat {} \; | sort -u > dist/release/checksums.txt
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF#refs/tags/}" dist/release/* --clobber

  core:
    name: ${{ matrix.image_name }}
    uses: kairos-io/kairos-factory-action/.github/workflows/reusable-factory.yaml@38ba03a49cced0fc4173d12e496993774b2f42ea # v1.4.2
    needs:
      - vulnerability-scan
      - binaries
    permissions:
      id-token: write  # OIDC support
      contents: write
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: "hadron"
            base_image: "ghcr.io/kairos-io/hadron:v0.5.1"
            trusted_boot: false
            custom_job_name_format: "core-amd64-generic"
          - image_name: "hadron"
            base_image: "ghcr.io/kairos-io/hadron:v0.5.1"
            trusted_boot: true
            custom_job_name_format: "core-amd64-generic-uki"
    secrets:
      registry_username: ${{ secrets.QUAY_USERNAME }}
      registry_password: ${{ secrets.QUAY_PASSWORD }}
    with:
      auroraboot_version: "v0.26.2"
      dockerfile_path: "images/Dockerfile"
      # Point images/Dockerfile's FROM at the kairos-init image the
      # `binaries` job pushed to quay earlier in the same run, so this
      # release's ISOs use the fresh kairos-init instead of the ARG
      # default pinned in the Dockerfile.
      build_args: KAIROS_INIT=${{ github.ref_name }}
      base_image: ${{ matrix.base_image }}
      arch: "amd64"
      model: "generic"
      version: "auto"
      no_cache: true
      registry_domain: "quay.io"
      registry_namespace: "kairos"
      trusted_boot: ${{ matrix.trusted_boot }}
      iso: ${{ !matrix.trusted_boot }}
      grype: true
      grype_sarif: true
      trivy: true
      trivy_sarif: true
      # Report-only: the scan still runs and reports, but criticals from the
      # upstream base image must not block releases. Mirrors master builds.
      # Both gates must be relaxed: security_scan_mode (the enforce step) AND
      # grype_sarif_fail_build (the SARIF step, which defaults to true).
      security_scan_mode: "report-only"
      grype_sarif_fail_build: false
      custom_job_name_format: ${{ matrix.custom_job_name_format }}
      list_release_artifacts: ${{ !matrix.trusted_boot }}
      cosign: true
      release: ${{ !matrix.trusted_boot }}
  get-k3s-versions:
    runs-on: ubuntu-latest
    outputs:
      kubernetes_versions: ${{ steps.get-k3s-releases.outputs.kubernetes_versions }}
    steps:
      - run: |
          sudo apt update && sudo apt install -y jq curl
      - name: Get latest k3s releases
        id: get-k3s-releases
        run: |
          kubernetes_versions=$(curl -s https://api.github.com/repos/k3s-io/k3s/releases | jq -r '
            [.[] | select(.prerelease == false and .draft == false and (.tag_name | test("rc") | not)) | .tag_name]
            | map(select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+\\+k3s[0-9]+$")))
            | map({
               version: .,
               minor: (split(".")[1:2]|join("")),
               patch: (split(".")[2:3]|join("")|split("+")[0]),
               revision: (split("+k3s")[1])
             })
           | group_by(.minor)
           | map(sort_by([(.patch | tonumber), (.revision | tonumber)]) | reverse | .[0])
           | sort_by(.minor | tonumber)
           | reverse
           | .[0:3]
           | map(.version)
          ' | jq -c '.')
          echo "kubernetes_versions=$kubernetes_versions" >> $GITHUB_OUTPUT

  get-k0s-versions:
    runs-on: ubuntu-latest
    outputs:
      kubernetes_versions: ${{ steps.get-k0s-releases.outputs.kubernetes_versions }}
    steps:
      - run: |
          sudo apt update && sudo apt install -y jq curl
      - name: Get latest k0s releases
        id: get-k0s-releases
        run: |
          kubernetes_versions=$(curl -s https://api.github.com/repos/k0sproject/k0s/releases | jq -r '
           [.[] | select(.prerelease == false and .draft == false and (.tag_name | test("rc") | not)) | .tag_name]
           | map(select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+\\+k0s\\.[0-9]+$")))
           | map({
             version: .,
             minor: (split(".")[1:2]|join("")),
             patch: (split(".")[2:3]|join("")|split("+")[0]),
             revision: (split("+k0s.")[1])
           })
           | group_by(.minor)
           | map(sort_by([(.patch | tonumber), (.revision | tonumber)]) | reverse | .[0])
           | sort_by(.minor | tonumber)
           | reverse
           | .[0:3]
           | map(.version)
           '| jq -c '.')
          echo "kubernetes_versions=$kubernetes_versions" >> $GITHUB_OUTPUT

  standard-k3s:
    name: ${{ matrix.image_name }}
    uses: kairos-io/kairos-factory-action/.github/workflows/reusable-factory.yaml@38ba03a49cced0fc4173d12e496993774b2f42ea # v1.4.2
    needs:
      - vulnerability-scan
      - binaries
      - get-k3s-versions
    permissions:
      id-token: write  # OIDC support
      contents: write
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        image_name:
          - "hadron"
        base_image:
          - "ghcr.io/kairos-io/hadron:v0.5.1"
        kubernetes_version: ${{ fromJson(needs.get-k3s-versions.outputs.kubernetes_versions) }}
    secrets:
      registry_username: ${{ secrets.QUAY_USERNAME }}
      registry_password: ${{ secrets.QUAY_PASSWORD }}
    with:
      auroraboot_version: "v0.26.2"
      dockerfile_path: "images/Dockerfile"
      # Point images/Dockerfile's FROM at the kairos-init image the
      # `binaries` job pushed to quay earlier in the same run, so this
      # release's ISOs use the fresh kairos-init instead of the ARG
      # default pinned in the Dockerfile.
      build_args: KAIROS_INIT=${{ github.ref_name }}
      base_image: ${{ matrix.base_image }}
      arch: "amd64"
      model: "generic"
      version: "auto"
      no_cache: true
      registry_domain: "quay.io"
      registry_namespace: "kairos"
      iso: true
      kubernetes_version: ${{ matrix.kubernetes_version }}
      kubernetes_distro: "k3s"
      grype: true
      grype_sarif: true
      trivy: true
      trivy_sarif: true
      security_scan_mode: "report-only"
      # k3s CVEs come from upstream and are out of our control; the SARIF
      # step must not fail the release. Gating is left to security_scan_mode.
      grype_sarif_fail_build: false
      custom_job_name_format: "standard-amd64-generic-k3s"
      list_release_artifacts: true
      cosign: true
      release: true
  standard-k0s:
    name: ${{ matrix.image_name }}
    uses: kairos-io/kairos-factory-action/.github/workflows/reusable-factory.yaml@38ba03a49cced0fc4173d12e496993774b2f42ea # v1.4.2
    needs:
      - vulnerability-scan
      - binaries
      - get-k0s-versions
    permissions:
      id-token: write  # OIDC support
      contents: write
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        image_name:
          - "hadron"
        base_image:
          - "ghcr.io/kairos-io/hadron:v0.5.1"
        kubernetes_version: ${{ fromJson(needs.get-k0s-versions.outputs.kubernetes_versions) }}
    secrets:
      registry_username: ${{ secrets.QUAY_USERNAME }}
      registry_password: ${{ secrets.QUAY_PASSWORD }}
    with:
      auroraboot_version: "v0.26.2"
      dockerfile_path: "images/Dockerfile"
      # Point images/Dockerfile's FROM at the kairos-init image the
      # `binaries` job pushed to quay earlier in the same run, so this
      # release's ISOs use the fresh kairos-init instead of the ARG
      # default pinned in the Dockerfile.
      build_args: KAIROS_INIT=${{ github.ref_name }}
      base_image: ${{ matrix.base_image }}
      arch: "amd64"
      model: "generic"
      version: "auto"
      no_cache: true
      registry_domain: "quay.io"
      registry_namespace: "kairos"
      iso: true
      kubernetes_version: ${{ matrix.kubernetes_version }}
      kubernetes_distro: "k0s"
      grype: true
      grype_sarif: true
      trivy: true
      trivy_sarif: true
      security_scan_mode: "report-only"
      # k0s CVEs come from upstream and are out of our control; the SARIF
      # step must not fail the release. Gating is left to security_scan_mode.
      grype_sarif_fail_build: false
      custom_job_name_format: "standard-amd64-generic-k0s"
      list_release_artifacts: true
      cosign: true
      release: true
