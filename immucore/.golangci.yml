version: "2"
run:
  tests: false
linters:
  enable:
    - dupl
    - exhaustive
    - ginkgolinter
    - gocheckcompilerdirectives
    - goconst
    - gocyclo
    - godot
    - goheader
    - misspell
    - revive
    - zerologlint
  settings:
    exhaustive:
      # Keep this false. Every switch that missed state.AutoReset in #611 and
      # #613 already had a default arm. Set this to true and the linter stops
      # reporting the exact shape of bug it is here to catch.
      default-signifies-exhaustive: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
