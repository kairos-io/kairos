# ---------------------------------------------------------------------------
# upstream-regression -- a fix exists upstream, but taking it breaks the
# component. This is in the `edgevpn` binary, which ships in every Kairos
# release from mudler/edgevpn.
#
# Bisected against edgevpn's pkg/node suite, which exercises real peer-to-peer
# connectivity: webtransport-go v0.11.1 makes the "nodes can write to the
# ledger" spec time out at 240s where an unmodified checkout passes in
# 10-13s. v0.11.1 pulls quic-go 0.59.1 -> 0.60.0, which alone reproduces it;
# go-libp2p pins quic-go tightly, so this likely needs a go-libp2p bump
# upstream first. See mudler/edgevpn#1075.
#
# Note this is also present in provider-kairos, where it is already fixed
# on main -- cutting a provider-kairos release clears it there, leaving only
# the edgevpn copy this entry covers.
# ---------------------------------------------------------------------------

[[IgnoredVulns]]
id = "GHSA-g35j-m5xg-vh3q"
ignoreUntil = 2026-10-11
reason = "upstream-regression: CVE-2026-57497, webtransport-go in edgevpn. Fix v0.11.1 pulls quic-go 0.60.0, which breaks libp2p peer connectivity. Needs a go-libp2p bump upstream. See mudler/edgevpn#1075."
