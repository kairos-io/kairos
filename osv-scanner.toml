# Vulnerability ignore list for the release gate in
# .github/workflows/release-scan.yml. Refs
# https://github.com/kairos-io/kairos/issues/3985.
#
# Policy
# ------
#   * If a fix is published and can be taken, BUMP THE COMPONENT. Do not add an
#     entry here. This list is for what cannot currently be fixed, not for what
#     is inconvenient to fix.
#   * Every entry states a reason, prefixed with one of the categories below.
#   * An expired entry fails the build. That is deliberate -- it forces a
#     re-look rather than letting an ignore become permanent by neglect.
#
# Categories and their expiry, chosen so the gate stays trustworthy:
#
#   no-fix-available        90 days. Nothing upstream to wait for, so a short
#                           expiry would turn the gate red every week with no
#                           action available. Alarm fatigue is how a blocking
#                           gate becomes one everyone force-merges past.
#   prerelease-only-fix     ~2 weeks. A stable release is expected soon.
#   major-upgrade-required  ~30 days, plus a tracking issue. Needs planned work,
#                           not a decision taken during a release.
#   upstream-regression     ~60 days. A fix exists but taking it breaks the
#                           component; needs work in an upstream project we do
#                           not control, so a short expiry buys nothing.
#   upstream-fix-pending    ~30 days. The fix is written and submitted upstream
#                           but not merged. Shorter clock than the above,
#                           because this one is expected to resolve.
#
# Entries below were produced by a real scan of kairos-init v0.16.3's
# uncompressed bundle on 2026-08-12.


# ---------------------------------------------------------------------------
# no-fix-available -- no fixed version published upstream.
# All reached transitively through provider-kairos.
# ---------------------------------------------------------------------------

[[IgnoredVulns]]
id = "GO-2024-3218"
ignoreUntil = 2027-02-08
reason = "no-fix-available: CVE-2023-26248, github.com/libp2p/go-libp2p-kad-dht. No fixed version published. Transitive via provider-kairos."

[[IgnoredVulns]]
id = "GHSA-q7pp-wcgr-pffx"
ignoreUntil = 2027-02-08
reason = "no-fix-available: CVE-2023-36308, github.com/disintegration/imaging. No fixed version published; upstream is effectively unmaintained."

# ---------------------------------------------------------------------------
# edgevpn -- the one prebuilt binary in the bundle. kairos-init downloads
# mudler/edgevpn (kairos-init/EDGEVPN_VERSION, v0.37.1) instead of building it
# from this tree, so its module versions are whatever that release pinned. The
# latest edgevpn release, v0.37.2, still pins both modules below, so there is
# no edgevpn version to bump to yet.
# ---------------------------------------------------------------------------

[[IgnoredVulns]]
id = "GO-2026-6278"
ignoreUntil = 2026-12-09
reason = "prerelease-only-fix: GHSA-w67g-5rqw-f597, gorilla/websocket weak PRNG for the mask key. In the bundle via edgevpn (websocket v1.5.3; provider-kairos is already on 1.5.4-0.20250319132907). Fixed only in an untagged commit after v1.5.3 (1.5.4-0.20240701034025-d67f41855da4 or later); no tagged release carries it. edgevpn v0.37.2 still pins v1.5.3. Bump edgevpn once it moves off it."

[[IgnoredVulns]]
id = "GO-2026-5932"
ignoreUntil = 2026-12-25
reason = "upstream-fix-pending: golang.org/x/crypto/openpgp is unmaintained. In the bundle via edgevpn (x/crypto v0.58.0; provider-kairos is already on v0.59.0, which carries the fix). edgevpn v0.37.2, the latest release, still pins v0.58.0 and has no open PR bumping it. Bump edgevpn once it releases with x/crypto v0.59.0 or later."


# ---------------------------------------------------------------------------
# major-upgrade-required -- fixed only in a new major version.
# ---------------------------------------------------------------------------

# provider-kairos links labstack/echo/v4 v4.16.1. Both advisories are fixed
# only in echo v5 (no v4 release carries the fix), so clearing them means
# moving provider-kairos to echo/v5. Same advisories as AuroraBoot, tracked
# in https://github.com/kairos-io/kairos/issues/5763.
[[IgnoredVulns]]
id = "GHSA-246p-cpwv-v3jq"
ignoreUntil = 2026-12-03
reason = "major-upgrade-required: labstack/echo/v4 RealIP() trusts client X-Forwarded-For/X-Real-IP when no IPExtractor is set; fixed only in echo v5.1.0. In the bundle via provider-kairos (echo/v4 v4.16.1). Tracking: kairos-io/kairos#5763. AuroraBoot (auroraboot/) is not affected: pkg/server sets Echo#IPExtractor to the TCP peer, or to X-Forwarded-For from --trusted-proxy ranges only."

[[IgnoredVulns]]
id = "GHSA-99jh-6h7p-pp36"
ignoreUntil = 2026-12-03
reason = "major-upgrade-required: labstack/echo/v4 middleware.Proxy issue, fixed only in echo v5.4.0. In the bundle via provider-kairos (echo/v4 v4.16.1). Tracking: kairos-io/kairos#5763. AuroraBoot (auroraboot/) does not use middleware.Proxy or ProxyWithConfig, so it does not reach the vulnerable code."

# minimatch globparts amplification DoS in auroraboot/ui. Every release below
# 11.0.1 is affected, but eslint, @eslint/config-array and @typescript-eslint
# pin it to ^10, so no update they accept clears it. It is a dev dependency of
# the UI lint toolchain only (auroraboot/ui/package-lock.json, "dev": true):
# the globs come from our own eslint config, not from users, and it is not in
# the built UI. Drop this once eslint accepts minimatch 11.
[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2026-11-30
reason = "major-upgrade-required: minimatch below 11.0.1 globparts DoS; eslint and typescript-eslint pin ^10, so no compatible fix. Dev-only lint dependency of auroraboot/ui with repo-controlled globs, not shipped. Re-evaluate before expiry."
