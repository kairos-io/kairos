name: "Datasource handling"
stages:
  rootfs.before:
    - &moveOldUserdata
      name: "Move old datasource to new location"
      # Not on read-only media: /oem is mounted ro there, so this write fails.
      if: '[ -d /oem/userdata ] && [ ! -d /oem/95_userdata ] && [ ! -f /run/cos/write_protected ]' # If old userdata exists and new one does not
      commands:
      - mv -f /oem/userdata /oem/95_userdata
    - &removeOldUserdata
      name: "Remove old userdata"
      # Not on read-only media: /oem is mounted ro there, so this write fails.
      if: '[ -d /oem/userdata ] && [ -d /oem/95_userdata ] && [ ! -f /run/cos/write_protected ]' # If both exist, remove the old one
      commands:
      - rm -rf /oem/userdata
    - &datasource
      # Not on read-only media: the datasource writes its result into /oem,
      # which is mounted ro there. Userdata has to be in place before the disk is
      # write-protected; see the read-only media section of immucore/README.md.
      if: '[ ! -e /oem/95_userdata ] && ([ ! -f /run/cos/uki_boot_mode ] || grep -q "kairos.pull_datasources" /proc/cmdline ) && [ ! -f /run/cos/write_protected ]'
      name: "Pull data from provider"
      datasource:
        providers: ["cdrom", "gcp", "openstack", "aws", "azure", "hetzner", "packet", "vultr", "digitalocean", "metaldata", "vmware", "config-drive", "maas"]
        path: "/oem/95_userdata"
    - if: '[ ! -e /oem/95_userdata ]'
      name: "Sentinel file for userdata"
      files:
      - path: /run/.userdata_load
  initramfs.before:
    - <<: *moveOldUserdata
    - <<: *removeOldUserdata
    - <<: *datasource
    - if: '[ ! -e /oem/95_userdata ]'
      files:
      - path: /run/.userdata_load
  # After network, if no datasource could be pulled, we stop trying
  network:
    - <<: *moveOldUserdata
    - <<: *removeOldUserdata
    - <<: *datasource
    - if: '[ -e /oem/95_userdata ] && [ -f /run/.userdata_load ]'
      name: "Run stages if userdata is found"
      commands:
      - kairos-agent run-stage initramfs --override-cloud-init-paths /oem/95_userdata
      - kairos-agent run-stage boot --override-cloud-init-paths /oem/95_userdata
      - rm -rf /run/.userdata_load
    - if: '[ ! -e /oem/95_userdata ] && [ -f /run/.userdata_load ]'
      name: "Remove userdata sentinel"
      commands:
      - rm -rf /run/.userdata_load
