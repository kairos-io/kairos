name: "Root autologin"
stages:
  initramfs:
    # Autologin applies to every live boot, interactive installs included.
    # There used to be a "not an interactive install" guard here, written as
    # two OR'd `grep -qv`. On a single-line /proc/cmdline each of those
    # succeeds whenever the line lacks that one keyword, so the condition was
    # true for every cmdline and the guard never ran. It is gone rather than
    # repaired: 52_installer.yaml masks getty@tty1 on an interactive boot, so
    # the tty1 override below is already inert there, and the ttyS0 one is the
    # only way to reach a machine whose console is serial.
    #
    # The virtual console override is on the getty@.service template rather
    # than on getty@tty1, so that every VT autologs in and not only the first.
    # logind starts tty2 to tty6 on demand as autovt@ttyN (NAutoVTs=6), and
    # autovt@.service is a symlink to getty@.service, so those instances never
    # saw a getty@tty1 drop-in and presented a login prompt instead. They do
    # inherit this one: systemd resolves autovt@ttyN.service to the
    # getty@.service fragment and records getty@ttyN.service as an alias, and
    # drop-in lookup runs over every alias and widens each instance name to
    # its template directory.
    #
    # This matters most on an interactive install, where 52_installer.yaml
    # masks getty@tty1 to own the console: the mask is on the instance, so it
    # still wins there, while the other VTs stay reachable without a password.
    - if: |
        ([ -f /run/cos/live_mode ] || [ -f /run/cos/uki_install_mode ])
      only_service_manager: "systemd"
      files:
        - path: /etc/systemd/system/serial-getty@ttyS0.service.d/override.conf
          content: |
            [Service]
            ExecStart=
            ExecStart=-/sbin/agetty --autologin root --noclear %I $TERM
          permissions: 0644
        - path: /etc/systemd/system/getty@.service.d/override.conf
          content: |
            [Service]
            ExecStart=
            ExecStart=-/sbin/agetty --autologin root --noclear %I $TERM
          permissions: 0644
    - name: "Autologin on livecd for OpenRC"
      # Same dead guard as above, removed for the same reason.
      if: |
        [ -f /run/cos/live_mode ]
      only_service_manager: "openrc"
      files:
        - path: /etc/motd
          content: |
            You are booting from livecd mode. Run 'kairos-agent install' to install the system.
          permissions: 0644
      commands:
        - sed -i -e 's/tty1.*//g' /etc/inittab
        - sed -i -e 's/ttyS0.*//g' /etc/inittab
        - echo "tty1::respawn:/sbin/agetty --autologin root -i --noclear tty1" >> /etc/inittab
        - echo "ttyS0::respawn:/sbin/agetty --autologin root -i --noclear ttyS0" >> /etc/inittab
