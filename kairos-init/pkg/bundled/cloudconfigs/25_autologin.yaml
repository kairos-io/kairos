name: "Root autologin"
stages:
  initramfs:
    # Autologin applies to every live boot, interactive installs included.
    # There used to be a "not an interactive install" guard here, written as
    # two OR'd `grep -qv`. On a single-line /proc/cmdline each of those
    # succeeds whenever the line lacks that one keyword, so the condition was
    # true for every cmdline and the guard never ran. It is gone rather than
    # repaired: 52_installer.yaml masks getty@tty1 on an interactive boot, so
    # the tty1 override below is already inert there, and the ttyS0 one is the
    # only way to reach a machine whose console is serial.
    - if: |
        ([ -f /run/cos/live_mode ] || [ -f /run/cos/uki_install_mode ])
      only_service_manager: "systemd"
      files:
        - path: /etc/systemd/system/serial-getty@ttyS0.service.d/override.conf
          content: |
            [Service]
            ExecStart=
            ExecStart=-/sbin/agetty --autologin root --noclear %I $TERM
          permissions: 0644
        - path: /etc/systemd/system/getty@tty1.service.d/override.conf
          content: |
            [Service]
            ExecStart=
            ExecStart=-/sbin/agetty --autologin root --noclear %I $TERM
          permissions: 0644
    - name: "Autologin on livecd for OpenRC"
      # Same dead guard as above, removed for the same reason.
      if: |
        [ -f /run/cos/live_mode ]
      only_service_manager: "openrc"
      files:
        - path: /etc/motd
          content: |
            You are booting from livecd mode. Run 'kairos-agent install' to install the system.
          permissions: 0644
      commands:
        # The console the user sees is not always the first one. logind starts
        # tty1 to tty6 on the systemd side and Alpine's stock inittab starts
        # the same six, so every virtual console is covered here, not tty1
        # alone. Only ttyS0 collides with 10_accounting.yaml, which rewrites
        # that one line in the initramfs.after stage.
        - sed -i -e 's/tty[1-6].*//g' -e 's/ttyS0.*//g' /etc/inittab
        - for n in 1 2 3 4 5 6; do echo "tty$n::respawn:/sbin/agetty --autologin root -i --noclear tty$n" >> /etc/inittab; done
        - echo "ttyS0::respawn:/sbin/agetty --autologin root -i --noclear ttyS0" >> /etc/inittab
