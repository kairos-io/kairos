name: "sysext and confext configuration"
stages:
  fs.after:
    - name: "Default sysext/confext extensions dirs"
      only_service_manager: "systemd"
      directories:
        # yip applies this mode verbatim, and chmods the directory even when it
        # already exists, so an omitted permissions: would leave 0000 here on
        # every boot. 0755 is what systemd's own tmpfiles use for these, and it
        # keeps them traversable for a non-root `systemd-sysext status`.
        #
        # systemd also searches /usr/lib/extensions and /usr/lib/confexts, and
        # those are deliberately absent here. /usr is read-only once the rootfs
        # is in place (00_rootfs.yaml sets RW_PATHS to /var /etc /srv and mounts
        # COS_PERSISTENT at /usr/local), so creating them only produces a
        # "read-only file system" error on every boot. Kairos extensions live in
        # /var/lib/extensions since https://github.com/kairos-io/kairos/issues/1821,
        # and systemd skips a search directory that does not exist.
        - path: /etc/extensions
          permissions: 0755
          owner: 0
          group: 0
        - path: /run/confexts
          permissions: 0755
          owner: 0
          group: 0
        - path: /run/extensions
          permissions: 0755
          owner: 0
          group: 0
        - path: /var/lib/extensions
          permissions: 0755
          owner: 0
          group: 0
        - path: /var/lib/confexts
          permissions: 0755
          owner: 0
          group: 0
        - path: /usr/local/lib/extensions
          permissions: 0755
          owner: 0
          group: 0
        - path: /usr/local/lib/confexts
          permissions: 0755
          owner: 0
          group: 0
  initramfs:
    - name: "systemd-sysext/confext uki config"
      if: '[ -e "/run/cos/uki_boot_mode" ] && [ ! -e "/run/cos/recovery_mode" ] && [ ! -e "/run/cos/autoreset_mode" ]'
      only_service_manager: "systemd"
      files:
        - path: /etc/systemd/system/systemd-sysext.service.d/kairos-uki.conf
          permissions: 0644
          owner: 0
          group: 0
          content: |
            [Service]
            # Make it timeout early to avoid blocking boot if keys are not in there to unlock sysext
            TimeoutStartSec=10
            # override exec and reload to set the image policy
            ExecStart=
            ExecStart=systemd-sysext refresh --image-policy="root=signed+absent:usr=signed+absent"
            ExecReload=
            ExecReload=systemd-sysext refresh --image-policy="root=signed+absent:usr=signed+absent"
            # Spell out the hierarchies, and keep every /usr/local path out of
            # them. /usr/local is where COS_PERSISTENT is mounted, and a
            # successful merge makes every hierarchy it covers read-only:
            # merge_hierarchy() mounts the overlay and then calls
            # bind_remount_recursive(..., MS_RDONLY, MS_RDONLY, ...). Listing
            # /usr/local/bin and its siblings was enough to turn the writable
            # half of the persistent partition read-only for the rest of the
            # boot, which breaks bundles and the stages that write scripts
            # into /usr/local/bin.
            Environment="SYSTEMD_SYSEXT_HIERARCHIES=/usr/bin:/usr/share:/usr/lib:/usr/include:/usr/src:/usr/sbin"
            [Unit]
            # Make it timeout early to avoid blocking boot if keys are not in there to unlock sysext
            JobRunningTimeoutSec=5
        - path: /etc/systemd/system/systemd-confext.service.d/kairos-uki.conf
          permissions: 0644
          owner: 0
          group: 0
          content: |
            [Service]
            # Make it timeout early to avoid blocking boot if keys are not in there to unlock sysext
            TimeoutStartSec=10
            # override exec and reload to set the image policy
            ExecStart=
            ExecStart=systemd-confext refresh --image-policy="root=signed+absent:usr=signed+absent"
            ExecReload=
            ExecReload=systemd-confext refresh --image-policy="root=signed+absent:usr=signed+absent"
            [Unit]
            # Make it timeout early to avoid blocking boot if keys are not in there to unlock sysext
            JobRunningTimeoutSec=5
    - name: "systemd-sysext/confext config"
      if: '[ ! -e "/run/cos/uki_boot_mode" ] && [ ! -e "/run/cos/recovery_mode" ] && [ ! -e "/run/cos/autoreset_mode" ]'
      only_service_manager: "systemd"
      files:
        - path: /etc/systemd/system/systemd-sysext.service.d/kairos.conf
          permissions: 0644
          owner: 0
          group: 0
          content: |
            [Service]
            # Make it timeout early to avoid blocking boot if keys are not in there to unlock sysext
            TimeoutStartSec=10
            # override exec and reload to set the image policy
            ExecStart=
            ExecStart=systemd-sysext refresh --image-policy="root=verity+absent:usr=verity+absent"
            ExecReload=
            ExecReload=systemd-sysext refresh --image-policy="root=verity+absent:usr=verity+absent"
            # Spell out the hierarchies, and keep every /usr/local path out of
            # them. /usr/local is where COS_PERSISTENT is mounted, and a
            # successful merge makes every hierarchy it covers read-only:
            # merge_hierarchy() mounts the overlay and then calls
            # bind_remount_recursive(..., MS_RDONLY, MS_RDONLY, ...). Listing
            # /usr/local/bin and its siblings was enough to turn the writable
            # half of the persistent partition read-only for the rest of the
            # boot, which breaks bundles and the stages that write scripts
            # into /usr/local/bin.
            Environment="SYSTEMD_SYSEXT_HIERARCHIES=/usr/bin:/usr/share:/usr/lib:/usr/include:/usr/src:/usr/sbin"
            [Unit]
            # Make it timeout early to avoid blocking boot if keys are not in there to unlock sysext
            JobRunningTimeoutSec=5
        - path: /etc/systemd/system/systemd-confext.service.d/kairos.conf
          permissions: 0644
          owner: 0
          group: 0
          content: |
            [Service]
            # Make it timeout early to avoid blocking boot if keys are not in there to unlock sysext
            TimeoutStartSec=10
            # override exec and reload to set the image policy
            ExecStart=
            ExecStart=systemd-confext refresh --image-policy="root=verity+absent:usr=verity+absent"
            ExecReload=
            ExecReload=systemd-confext refresh --image-policy="root=verity+absent:usr=verity+absent"
            [Unit]
            # Make it timeout early to avoid blocking boot if keys are not in there to unlock sysext
            JobRunningTimeoutSec=5
    - name: "systemd-sysext set hierarchy system-wide"
      if: '[ ! -e "/run/cos/recovery_mode" ] && [ ! -e "/run/cos/autoreset_mode" ]'
      only_service_manager: "systemd"
      files:
        - path: /etc/profile.d/systemd-sysext.sh
          permissions: 0644
          owner: 0
          group: 0
          content: |
            # Same list as the service drop-ins above, so that an interactive
            # `systemd-sysext status` reports on the hierarchies the boot
            # actually merged. /usr/local is deliberately absent: it is the
            # persistent partition mount and must stay writable.
            export SYSTEMD_SYSEXT_HIERARCHIES="/usr/bin:/usr/share:/usr/lib:/usr/include:/usr/src:/usr/sbin"
    - name: "systemd-sysext/confext initramfs settings"
      only_service_manager: "systemd"
      systemctl:
        enable:
          - systemd-sysext
          - systemd-confext
