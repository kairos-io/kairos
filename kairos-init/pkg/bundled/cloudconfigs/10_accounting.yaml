name: "Default user, permissions and serial login"
stages:
  initramfs:
    - name: "Setup groups"
      ensure_entities:
      - entity: |
           kind: "group"
           group_name: "admin"
           password: "x"
           gid: 900
    - name: "Setup users"
      users:
        kairos:
          passwd: "!"
          shell: /bin/bash
          homedir: "/home/kairos"
          groups:
            - "admin"
    - name: "Set user password if running in live or uki"
      if: "[ -e /run/cos/live_mode ] || [ -e /run/cos/uki_install_mode ]"
      users:
        kairos:
          passwd: "kairos"
          groups:
            - "admin"
    - name: "Setup sudo"
      files:
      - path: "/etc/sudoers"
        owner: 0
        group: 0
        permissions: 0600
        content: |
           Defaults always_set_home
           Defaults secure_path="/usr/sbin:/usr/bin:/sbin:/bin:/usr/local/bin:/usr/local/sbin"
           Defaults env_reset
           Defaults env_keep = "LANG LC_ADDRESS LC_CTYPE LC_COLLATE LC_IDENTIFICATION LC_MEASUREMENT LC_MESSAGES LC_MONETARY LC_NAME LC_NUMERIC LC_PAPER LC_TELEPHONE LC_ATIME LC_ALL LANGUAGE LINGUAS XDG_SESSION_COOKIE"
           Defaults !insults
           root ALL=(ALL) ALL
           %admin ALL=(ALL) NOPASSWD: ALL
           #includedir /etc/sudoers.d
      commands:
        - passwd -l root
    - name: "Ensure runtime permission"
      if: '[ -e "/oem" ]'
      commands:
        - chown -R root:admin /oem
        - chmod 770 /oem
    - name: "Ensure runtime permission"
      if: '[ -e "/usr/local/cloud-config" ]'
      commands:
        - chown -R root:admin /usr/local/cloud-config
        - chmod 770 /usr/local/cloud-config
  initramfs.after:
    # Run this in the after stage so it doesnt collide with other initramfs changes to the /etc/inittab
    # Otherwise this can lead to 2 steps modifying the inittab at the same time and overriding or not cleaning it properly
    #
    # The after stage does not avoid that collision on a live medium, it wins
    # it: runstage.go runs every file's initramfs stage before any file's
    # initramfs.after stage, so this step always runs after
    # 25_autologin.yaml's, and its sed blanks the ttyS0 autologin line that one
    # appends. Hence the guard below, which is the exact complement of the one
    # 25_autologin.yaml's OpenRC step carries. One of the two applies on any
    # boot, so ttyS0 always ends up with a line, and neither has to care which
    # runs first.
    - name: "Enable serial login for alpine"  # https://wiki.alpinelinux.org/wiki/Enable_Serial_Console_on_Boot
      if: '[ ! -f /run/cos/live_mode ]'
      only_service_manager: "openrc"
      commands:
        - sed -i -e 's/ttyS0.*//g' /etc/inittab
        - echo "ttyS0::respawn:/sbin/getty -L ttyS0 115200 vt100" >> /etc/inittab
