name: "Create openrc services"
stages:
  initramfs:
    - name: "Create OpenRC services"
      only_service_manager: "openrc"
      files:
      - path: /etc/init.d/cos-setup-fs
        permissions: 0755
        owner: 0
        group: 0
        content: |
          #!/sbin/openrc-run

          depend() {
            after localmount
            before cos-setup-boot
            provide cos-setup-fs
          }

          start() {
            # cos-setup-fs.service caps the same stage with
            # TimeoutStartSec=90, because run-stage fs pulls config_url
            # fetches against a network that is not up at this ordering
            # point. openrc has no equivalent, and this service runs before
            # cos-setup-boot in the boot runlevel, so a stall here holds the
            # login prompt for ever. timeout is a busybox applet
            # (CONFIG_TIMEOUT=y on Alpine) and takes the seconds first. eend 0
            # keeps a timeout from failing the runlevel, which is what the
            # systemd side does when it proceeds past the timeout.
            timeout 90 kairos-agent run-stage fs
            eend 0
          }
      - path: /etc/init.d/cos-setup-boot
        permissions: 0755
        owner: 0
        group: 0
        content: |
          #!/sbin/openrc-run

          depend() {
            provide cos-setup-boot
          }

          start() {
            kairos-agent run-stage boot
            eend 0
          }
      - path: /etc/init.d/cos-setup-network
        permissions: 0755
        owner: 0
        group: 0
        content: |
          #!/sbin/openrc-run

          depend() {
            after net
            provide cos-setup-network
          }

          start() {
            kairos-agent run-stage network
            eend 0
          }
      - path: /etc/init.d/cos-setup-reconcile
        permissions: 0755
        owner: 0
        group: 0
        content: |
          #!/sbin/openrc-run

          depend() {
            provide cos-setup-reconcile
          }

          supervisor=supervise-daemon
          name="cos-setup-reconcile"
          # supervise-daemon resolves $command before it forks and refuses to
          # start if it is not on $PATH, so this has to name a binary that
          # exists. The systemd side runs the same stage from
          # cos-setup-reconcile.service, every 60min off
          # cos-setup-reconcile.timer.
          #
          # The interval lives inside the supervised command rather than in
          # respawn_delay, because respawn_delay means two different things on
          # the two openrc releases Kairos builds Alpine flavours from:
          #
          #   0.55.1 (Alpine 3.21) sleeps respawn_delay verbatim, but defaults
          #   respawn_period to 0, so the respawn counter never resets and the
          #   default respawn_max of 10 retires the service after 11 passes.
          #   0.63 (Alpine 3.23) resets the counter, but clamps the sleep to
          #   respawn_delay_cap, 30s by default, so an hourly delay would fire
          #   every 30 seconds. sh/supervise-daemon.sh passes neither
          #   --respawn-delay-cap nor --respawn-delay-step, and the flags do
          #   not exist on 0.55.1, so they cannot be set from here either.
          #
          # A sleep in the loop is the same interval on both.
          command="/bin/sh"
          command_args="-c 'while true; do /usr/bin/kairos-agent run-stage reconcile; sleep 3600; done'"
          supervise_daemon_args="--stdout /var/log/cos-setup-reconcile.log --stderr /var/log/cos-setup-reconcile.log"
          pidfile="/run/cos-setup-reconcile.pid"
          # The loop is what is supervised, so a respawn now only happens if
          # the loop itself dies. 0 is unlimited; the default 10 would retire
          # the service for the rest of the boot. Keep the delay under 0.63's
          # 30s respawn_delay_cap so it is honoured on both releases.
          respawn_max=0
          respawn_delay=5
          set -o allexport
          if [ -f /etc/environment ]; then . /etc/environment; fi
          set +o allexport
      - path: /etc/issue
        content: |


          ██╗  ██╗ █████╗ ██╗██████╗  ██████╗ ███████╗
          ██║ ██╔╝██╔══██╗██║██╔══██╗██╔═══██╗██╔════╝
          █████╔╝ ███████║██║██████╔╝██║   ██║███████╗
          ██╔═██╗ ██╔══██║██║██╔══██╗██║   ██║╚════██║
          ██║  ██╗██║  ██║██║██║  ██║╚██████╔╝███████║
          ╚═╝  ╚═╝╚═╝  ╚═╝╚═╝╚═╝  ╚═╝ ╚═════╝ ╚══════╝


          Kernel \r on an \m (\l)
        permissions: 0755
        owner: 0
        group: 0
    - name: "Enable OpenRC services"
      only_service_manager: "openrc"
      commands:
        - mkdir -p /etc/runlevels/default
        - mkdir -p /etc/runlevels/boot
        # The fs stage has to run before the boot stage, matching
        # cos-setup-fs.service Before=sysinit.target on systemd.
        - ln -sf ../../init.d/cos-setup-fs /etc/runlevels/boot/cos-setup-fs
        - ln -sf ../../init.d/cos-setup-boot /etc/runlevels/default/cos-setup-boot
        - ln -sf ../../init.d/cos-setup-network /etc/runlevels/default/cos-setup-network
        - ln -sf ../../init.d/cos-setup-reconcile /etc/runlevels/default/cos-setup-reconcile
    # The agent is the one service recovery must not get. 02_agent.yaml guards
    # kairos-agent.service with the same condition on systemd, and agent.Run
    # has no recovery check of its own: in recovery /usr/local is the tmpfs
    # overlay, so the firstboot sentinel is never found, the FirstBoot hooks
    # run on every recovery boot, GrubFirstBootOptions rewrites the OEM
    # grubenv, and the bootstrap event asks the provider to bring up a cluster
    # on a throwaway rootfs.
    - name: "Create the OpenRC kairos-agent service"
      if: '[ ! -f "/run/cos/recovery_mode" ]'
      only_service_manager: "openrc"
      files:
      - path: /etc/init.d/kairos-agent
        content: |
          #!/sbin/openrc-run

          depend() {
            provide kairos-agent
            after cos-setup-network
            use net
          }

          start() {
              mkdir -p /var/log/kairos
              kairos-agent start &> /var/log/kairos/agent.log &
              return 0
          }

          stop() {
              kill -9 $(pgrep -f "kairos-agent start")
              return 0
          }
        permissions: 0755
        owner: 0
        group: 0
    - name: "Enable the OpenRC kairos-agent service"
      if: '[ ! -f "/run/cos/recovery_mode" ]'
      only_service_manager: "openrc"
      commands:
        - mkdir -p /etc/runlevels/default
        - ln -sf ../../init.d/kairos-agent /etc/runlevels/default/kairos-agent
