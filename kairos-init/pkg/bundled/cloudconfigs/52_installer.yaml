name: "Start installer on tty1"
stages:
  initramfs:
    # Start the plain installer on a boot that is asking to install.
    #
    # The decision is immucore's: it writes /run/cos/install_mode when the
    # boot asked for the plain installer, and /run/cos/install_mode_interactive
    # when it asked for the interactive one. Nothing here reads /proc/cmdline,
    # which is what kairos-io/kairos#5459 is about: the intent reaches a boot
    # differently on each medium, and collapsing that into one file is what
    # lets a new medium be supported in immucore alone.
    #
    # How immucore decides, for reference (sdk/state.InstallIntentSentinels):
    #
    # On the GRUB live ISO the cmdline is per menu entry and unsigned, so the
    # entry says which installer it wants with install-mode or
    # install-mode-interactive, and a live boot that asks for neither gets
    # neither. The keyword stays the input there, because a menu entry has no
    # other way to express per-entry intent.
    #
    # On Trusted Boot the cmdline lives in a signed section of the UKI, and
    # AuroraBoot builds every entry from the same base, so install-mode is
    # present on every UKI boot: on the live medium and, because the installer
    # copies norole.efi byte for byte into active, passive, recovery and
    # statereset, on every installed role too. It therefore decides nothing
    # there, and what separates the two is having booted from an installed EFI
    # entry. A UKI install medium gets the interactive installer,
    # unconditionally.
    #
    # Nothing is lost by handing Trusted Boot to the interactive installer:
    # it runs AutoInstall first, so a config carrying install.auto: true still
    # installs with no prompt. See agent/docs/installer-contract.md.
    #
    # An entry naming both keywords yields both sentinels, so both stages run;
    # the interactive stage comes later in this file and takes tty1 back.
    - if: |
        [ -f /run/cos/install_mode ]
      only_service_manager: "systemd"
      files:
        - path: /etc/systemd/system/kairos-installer.service
          permissions: 0644
          owner: 0
          group: 0
          content: |
            [Unit]
            Description=kairos installer
            After=multi-user.target
            [Service]
            Type=simple
            StandardInput=tty
            StandardOutput=tty
            LimitNOFILE=49152
            ExecStartPre=-/bin/sh -c "dmesg -D"
            TTYPath=/dev/tty1
            RemainAfterExit=yes
            # Stop systemd messages on tty
            ExecStartPre=-/bin/bash -c "kill -SIGRTMIN+21 1"
            ExecStart=/usr/bin/kairos-agent install
            # Start systemd messages on tty
            ExecStartPost=-/bin/bash -c "kill -SIGRTMIN+20 1"
            TimeoutStopSec=10s
            [Install]
            WantedBy=multi-user.target
      commands:
        - systemctl disable getty@tty1
        - systemctl stop getty@tty1
        - systemctl mask getty@tty1
        - systemctl enable kairos-installer
    # Starts installer on boot for openRC based systems. Same sentinel as the
    # systemd stage above.
    - if: |
        [ -f /run/cos/install_mode ]
      only_service_manager: "openrc"
      commands:
        - sed -i -e 's/tty1.*//g' /etc/inittab
        - echo "tty1::respawn:/usr/bin/kairos-agent install tty1" >> /etc/inittab
    # Starts the interactive installer. It is what a Trusted Boot install
    # medium always gets, and what a GRUB live ISO gets when the entry the
    # user picked asks for it. immucore collapses both into
    # /run/cos/install_mode_interactive; see the plain stage above.
    #
    # The interactive installer is the right default for a UKI medium because
    # it is the dispatcher, not just a terminal UI: it runs AutoInstall first,
    # serves the WebUI in-process, and takes --shell.
    #
    # The legacy interactive-install keyword is still accepted as an input on
    # the GRUB cmdline, in immucore now rather than here.
    # TODO: Drop interactive-install keyword in Kairos 4.0.0
    - if: |
        [ -f /run/cos/install_mode_interactive ]
      only_service_manager: "systemd"
      files:
        - path: /etc/systemd/system/kairos-interactive.service
          permissions: 0644
          owner: 0
          group: 0
          content: |
            [Unit]
            Description=kairos interactive-installer
            After=multi-user.target
            [Service]
            ## Dont mark it as running until it finishes
            Type=oneshot
            # input/output to tty as its interactive
            # otherwise it will be silent and with no input
            StandardInput=tty
            StandardOutput=tty
            LimitNOFILE=49152
            ExecStartPre=-/bin/sh -c "dmesg -D"
            TTYPath=/dev/tty1
            RemainAfterExit=yes
            # Stop systemd messages on tty
            ExecStartPre=-/bin/bash -c "kill -SIGRTMIN+21 1"
            ExecStart=/usr/bin/kairos-agent interactive-install --shell
            # Start systemd messages on tty
            ExecStartPost=-/bin/bash -c "kill -SIGRTMIN+20 1"
            TimeoutStopSec=10s
            # Restart if it fails, like user doing control+c
            Restart=on-failure
            [Install]
            WantedBy=multi-user.target
      commands:
        # kairos-installer exists only where the plain stage above ran, which
        # a Trusted Boot medium no longer does, so tolerate it being absent.
        - systemctl stop kairos-installer || true
        - systemctl disable kairos-installer || true
        - systemctl disable getty@tty1
        - systemctl stop getty@tty1
        - systemctl mask getty@tty1
        - systemctl enable kairos-interactive
    # Starts installer on boot for openRC based systems. Same sentinel as the
    # systemd stage above.
    - if: |
        [ -f /run/cos/install_mode_interactive ]
      only_service_manager: "openrc"
      commands:
        - sed -i -e 's/tty1.*//g' /etc/inittab
        - echo "tty1::respawn:/usr/bin/kairos-agent interactive-install --shell tty1" >> /etc/inittab
