## Ensure that /etc/hostname and /etc/hosts survive a reboot.
## /etc is an ephemeral overlay (see RW_PATHS in 00_rootfs.yaml), so anything
## written there is gone on the next boot, while /usr/local is the persistent
## partition.
##
## /etc/hosts is symlinked at /usr/local/etc/hosts. That works because its
## writers append to the file they are given.
##
## /etc/hostname cannot be a symlink. systemd-hostnamed writes it with
## WRITE_STRING_FILE_ATOMIC (hostname/hostnamed.c), which writes a temporary
## file next to the target and renames over it, and rename() replaces a
## symlink rather than writing through it. So the name set with hostnamectl
## landed on the overlay and the persistent file never saw it. Instead the
## file is copied in on every boot and copied back out whenever it changes,
## the same shape 00_rootfs.yaml already uses for machine-id.
##
## This is skipped in recovery mode, where there is no persistent partition.
## A first boot with nothing stored yet gets a name generated from the machine
## id, which is stable across reboots and unique per machine, and which user
## configuration is free to override.
## Note: trunc 4 .MachineID takes the first 4 characters of the MachineID
## We should run the hosts part before the hostname, as yip will try to update the hosts file when changing the hostname
## so we get the proper name added to the hosts file
stages:
  initramfs:
    - if: '[ ! -f "/run/cos/recovery_mode" ]'
      name: "Ensure persistent /etc/ directory"
      directories:
        - path: "/usr/local/etc"
          permissions: 0755
          owner: 0
          group: 0
    # Only when the persistent partition has no hosts file yet, so a first
    # boot gets a usable one and every later boot keeps what is there.
    - if: '[ ! -f "/run/cos/recovery_mode" ] && [ ! -e "/usr/local/etc/hosts" ]'
      name: "Seed the persistent hosts file"
      files:
        - path: "/usr/local/etc/hosts"
          permissions: 0644
          owner: 0
          group: 0
          content: |
            127.0.0.1 localhost
            ::1       localhost
    - if: '[ ! -f "/run/cos/recovery_mode" ] && [ ! -L "/etc/hosts" ]'
      name: "Ensure persistent hosts file"
      commands:
        - rm -f /etc/hosts
        - ln -sf /usr/local/etc/hosts /etc/hosts
    # The overlay hands back the image's own /etc/hostname on every boot, and
    # kairos-init truncates that one to zero length at build time, so the name
    # has to be put back here. This runs before the seed below, which is what
    # makes the seed a first boot only step.
    - if: '[ ! -f "/run/cos/recovery_mode" ] && [ -s "/usr/local/etc/hostname" ]'
      name: "Restore the saved hostname"
      commands:
        - cat /usr/local/etc/hostname > /etc/hostname
    # Only when the persistent partition has no name in it yet. The guard
    # tests for a non-empty file rather than for its presence, because a boot
    # interrupted part way through leaves an empty file behind, and that is
    # not a name.
    - if: '[ ! -f "/run/cos/recovery_mode" ] && [ ! -s "/usr/local/etc/hostname" ]'
      name: "Seed a generated hostname"
      hostname: kairos-{{ trunc 4 .MachineID }}
    # One implementation of the save, in a file both service managers call.
    # It uses the shell and cat only. The images carry no cmp, and a guard
    # that cannot run is a guard that always says yes, so a `cmp -s` here
    # copied on every trigger, logged a `command not found` each time, and on
    # an image from before this change, where /etc/hostname is still a symlink
    # to the persistent file, truncated its own source.
    - if: '[ ! -f "/run/cos/recovery_mode" ]'
      name: "Install the hostname save script"
      directories:
        - path: "/usr/local/sbin"
          permissions: 0755
          owner: 0
          group: 0
      files:
        - path: /usr/local/sbin/kairos-persist-hostname
          permissions: 0755
          owner: 0
          group: 0
          content: |
            #!/bin/sh
            # Copy a hostname set at runtime out to the persistent partition.
            if [ -f /run/cos/recovery_mode ]; then
              exit 0
            fi
            # The overlay hands back an empty /etc/hostname on every boot,
            # before the restore step puts the saved name back. Empty is not a
            # name, and copying it out would lose the one that is stored.
            if [ ! -s /etc/hostname ]; then
              exit 0
            fi
            # Nothing to do when the two already agree. This is also the case
            # where /etc/hostname is a symlink to the file below, and the copy
            # would read and truncate the same inode.
            if [ "$(cat /etc/hostname)" = "$(cat /usr/local/etc/hostname 2>/dev/null)" ]; then
              exit 0
            fi
            cat /etc/hostname > /usr/local/etc/hostname
    # Carries the seeded name out to the persistent partition. After the
    # restore step above the two files already agree and the script exits.
    - if: '[ ! -f "/run/cos/recovery_mode" ]'
      name: "Save the hostname on the persistent partition"
      commands:
        - /bin/sh /usr/local/sbin/kairos-persist-hostname
    # What closes the loop for a name set at runtime: hostnamectl, a DHCP
    # client or a hand edit all end up changing /etc/hostname, and the path
    # unit copies it back out. A path unit only sees the file it names when
    # that file is not a symlink: systemd watches the inode the path resolves
    # to, so with a symlink in place the rename that replaces the symlink
    # reaches no watch at all (core/path.c, primary_wd).
    - if: '[ ! -f "/run/cos/recovery_mode" ]'
      name: "Create the hostname persistence units"
      only_service_manager: "systemd"
      files:
        - path: /etc/systemd/system/kairos-persist-hostname.path
          permissions: 0644
          owner: 0
          group: 0
          content: |
            [Unit]
            Description=Watch /etc/hostname for a name set at runtime
            ConditionPathExists=!/run/cos/recovery_mode

            [Path]
            PathChanged=/etc/hostname
            Unit=kairos-persist-hostname.service

            [Install]
            WantedBy=multi-user.target
        - path: /etc/systemd/system/kairos-persist-hostname.service
          permissions: 0644
          owner: 0
          group: 0
          content: |
            [Unit]
            Description=Save the runtime hostname on the persistent partition
            ConditionPathExists=!/run/cos/recovery_mode
            After=local-fs.target

            [Service]
            Type=oneshot
            ExecStart=/bin/sh /usr/local/sbin/kairos-persist-hostname
      commands:
        - mkdir -p /etc/systemd/system/multi-user.target.wants
        - ln -sf /etc/systemd/system/kairos-persist-hostname.path /etc/systemd/system/multi-user.target.wants/kairos-persist-hostname.path
    # openrc has no inotify, so it gets the save on shutdown instead. A name
    # set at runtime and then lost to a power cut is the one case this does
    # not cover.
    - if: '[ ! -f "/run/cos/recovery_mode" ]'
      name: "Create the OpenRC hostname persistence service"
      only_service_manager: "openrc"
      files:
        - path: /etc/init.d/kairos-persist-hostname
          permissions: 0755
          owner: 0
          group: 0
          content: |
            #!/sbin/openrc-run

            description="Save the runtime hostname on the persistent partition"

            depend() {
              after localmount
            }

            start() {
              return 0
            }

            stop() {
              /bin/sh /usr/local/sbin/kairos-persist-hostname
              return 0
            }
      commands:
        - mkdir -p /etc/runlevels/default
        - ln -sf ../../init.d/kairos-persist-hostname /etc/runlevels/default/kairos-persist-hostname
