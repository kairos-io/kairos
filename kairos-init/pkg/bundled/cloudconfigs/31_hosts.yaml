## Ensure that /etc/hostname and /etc/hosts are persistent across reboots
## by storing them in /usr/local/etc/ and symlinking them
## /etc is an ephemeral overlay (see RW_PATHS in 00_rootfs.yaml), so the
## symlinks are gone again on every boot and have to be recreated, while the
## files they point at live on the persistent partition and must only be
## seeded once. Seeding them on every boot resets whatever the running system
## stored there, which is the opposite of what this file is for.
## This is skipped in recovery mode
## Also, set a default hostname if not already set
## This is done in the initramfs stage to ensure it's set early
## Use MachineID for consistent hostname generation
## Note: trunc 4 .MachineID takes the first 4 characters of the MachineID
## This ensures the hostname is unique per machine but consistent across reboots
## This should be overridden by user configuration if provided
## We should run the hosts part before the hostname, as yip will try to update the hosts file when changing the hostname
## so we get the proper name added to the hosts file
stages:
  initramfs:
    - if: '[ ! -f "/run/cos/recovery_mode" ]'
      name: "Ensure persistent /etc/ directory"
      directories:
        - path: "/usr/local/etc/"
          permissions: 0755
          owner: 0
          group: 0
    # Only when the persistent partition has no hosts file yet, so a first
    # boot gets a usable one and every later boot keeps what is there.
    - if: '[ ! -f "/run/cos/recovery_mode" ] && [ ! -e "/usr/local/etc/hosts" ]'
      name: "Seed the persistent hosts file"
      files:
        - path: "/usr/local/etc/hosts"
          permissions: 0644
          owner: 0
          group: 0
          content: |
            127.0.0.1 localhost
            ::1       localhost
    - if: '[ ! -f "/run/cos/recovery_mode" ] && [ ! -L "/etc/hosts" ]'
      name: "Ensure persistent hosts file"
      commands:
        - rm -f /etc/hosts
        - ln -sf /usr/local/etc/hosts /etc/hosts
    # The symlink lives in the ephemeral overlay, so it is gone on every boot
    # and has to be made again. This runs before the seed below, so that the
    # seed writes through the link onto the persistent partition rather than
    # onto the overlay.
    - if: '[ ! -f "/run/cos/recovery_mode" ] && [ ! -L "/etc/hostname" ]'
      name: "Ensure persistent hostname"
      commands:
        - rm -f /etc/hostname
        - ln -sf /usr/local/etc/hostname /etc/hostname
    # Only when the persistent partition has no name in it yet, so a first boot
    # gets a usable one and every later boot keeps what is there. The init
    # system puts that name back on the running kernel on a later boot, by
    # reading /etc/hostname, which is the symlink made above.
    # The guard tests for a non-empty file rather than for its presence,
    # because a boot interrupted part way through the step this replaces left
    # an empty file behind, and that is worth reseeding.
    - if: '[ ! -f "/run/cos/recovery_mode" ] && [ ! -s "/usr/local/etc/hostname" ]'
      name: "Seed the persistent hostname"
      hostname: kairos-{{ trunc 4 .MachineID }}
