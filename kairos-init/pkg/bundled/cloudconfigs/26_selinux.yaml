name: "SELinux"
stages:
  initramfs:
    - if: 'grep -q "selinux=1" /proc/cmdline'
      name: "SELinux relabel unit"
      only_service_manager: "systemd"
      files:
        - path: /usr/local/bin/setup-selinux-relabel-unit
          permissions: 0755
          owner: 0
          group: 0
          content: |
            #!/bin/bash

            set -eu

            # Mode comes from the cmdline (rd.cos.selinux=<mode>, written
            # by the agent hook from install.selinux.mode). enforcing
            # promotes after relabel. Permissive (default) pins 0.
            if grep -q "rd.cos.selinux=enforcing" /proc/cmdline; then
                MODE=1
            else
                MODE=0
            fi

            UNIT=/etc/systemd/system/kairos-selinux-relabel.service
            mkdir -p /etc/systemd/system
            cat > "$UNIT" <<EOF
            [Unit]
            Description=Kairos final selinux relabel
            ConditionSecurity=selinux
            After=cos-setup-fs.service kairos-agent.service
            Before=multi-user.target

            [Service]
            Type=oneshot
            ExecStart=/usr/sbin/restorecon -Riv /etc /var
            ExecStart=/usr/local/bin/selinux-relabel-persistent
            ExecStart=/usr/sbin/setenforce $MODE
            RemainAfterExit=yes

            [Install]
            WantedBy=multi-user.target
            EOF
        - path: /usr/local/bin/selinux-relabel-persistent
          permissions: 0755
          owner: 0
          group: 0
          content: |
            #!/bin/bash

            set -eu

            STAMP=/usr/local/.state/selinux/.kairos-selinux-relabeled
            POLICY_DIR=/etc/selinux/targeted/policy

            CUR=$(ls "$POLICY_DIR"/policy.[0-9]* 2>/dev/null | sed 's/.*policy\.//' | sort -n | tail -n1)
            [ -n "$CUR" ] || exit 0
            [ ! -f "$STAMP" ] || [ "$(cat "$STAMP")" != "$CUR" ] || exit 0

            /usr/sbin/restorecon -Riv /usr/local /etc /var /home /oem /root /opt /srv

            mkdir -p "$(dirname "$STAMP")"
            echo "$CUR" > "$STAMP"
      commands:
        - /usr/local/bin/setup-selinux-relabel-unit
        - systemctl enable kairos-selinux-relabel
    - if: 'grep -q "selinux=1" /proc/cmdline'
      name: "file_contexts.subs from state bind mounts"
      files:
        - path: /usr/local/bin/fix-selinux-file-contexts
          permissions: 0755
          owner: 0
          group: 0
          content: |
            #!/bin/bash

            set -eu

            CONTEXT_DIR=/etc/selinux/targeted/contexts/files
            SUBS="$CONTEXT_DIR/file_contexts.subs"
            TMP="$(mktemp)"

            [ -d "$CONTEXT_DIR" ] || exit 0
            [ -f /etc/fstab ] || exit 0

            trap 'rm -f "$TMP"' EXIT

            awk '
                $1 ~ /^\/usr\/local\/\.state\// &&
                $4 ~ /(^|,)bind(,|$)/ {
                    print $1, $2
                }
            ' /etc/fstab > "$TMP"

            [ -e /sys/fs/selinux/enforce ] || /usr/sbin/load_policy -i

            install -m 0644 -o root -g root "$TMP" "$SUBS"

            STAMP=/usr/local/.state/selinux/.kairos-selinux-relabeled
            POLICY_DIR=/etc/selinux/targeted/policy
            CUR=$(ls "$POLICY_DIR"/policy.[0-9]* 2>/dev/null | sed 's/.*policy\.//' | sort -n | tail -n1)
            [ -n "$CUR" ] || exit 0
            [ ! -f "$STAMP" ] || [ "$(cat "$STAMP")" != "$CUR" ] || exit 0

            /usr/sbin/restorecon -Riv /usr/local /etc /var /home /oem /root /opt /srv

            mkdir -p "$(dirname "$STAMP")"
            echo "$CUR" > "$STAMP"
      commands:
        - /usr/local/bin/fix-selinux-file-contexts
    - name: "Align /etc/selinux/config with active SELinux state"
      only_service_manager: "systemd"
      files:
        - path: /usr/local/bin/align-selinux-config
          permissions: 0755
          owner: 0
          group: 0
          content: |
            #!/bin/bash

            set -eu

            CFG=/etc/selinux/config
            [ -f "$CFG" ] || exit 0

            if grep -q "selinux=1" /proc/cmdline; then
                if grep -q "rd.cos.selinux=enforcing" /proc/cmdline; then
                    MODE=enforcing
                else
                    MODE=permissive
                fi
            else
                MODE=disabled
            fi

            sed -i "s/^SELINUX=.*/SELINUX=$MODE/" "$CFG"
      commands:
        - /usr/local/bin/align-selinux-config
