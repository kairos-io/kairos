name: Tests
on:
  pull_request:
  push:
    branches:
      - main
concurrency:
  group: ci-tests-${{ github.head_ref || github.ref }}-${{ github.repository }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    # The store specs that need concurrent writers run against this server;
    # they are skipped when AURORABOOT_TEST_POSTGRES_DSN is unset.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json
      - name: Build UI bundle (embedded via go:embed)
        run: make ui-build
      - name: Run UI tests
        run: make ui-test
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
      - name: Run tests
        env:
          AURORABOOT_TEST_POSTGRES_DSN: postgres://postgres:test@localhost:5432/postgres?sslmode=disable
        run: |
          sudo env AURORABOOT_TEST_POSTGRES_DSN="$AURORABOOT_TEST_POSTGRES_DSN" go run github.com/onsi/ginkgo/v2/ginkgo --tags ui -v -r -p --covermode=atomic --coverprofile=coverage.out --timeout=2h --skip-package ./e2e ./...
      - name: Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./coverage.out
  vet-tagged:
    name: vet-tagged
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Running the suite needs kind, docker and kubectl and takes up to 30
      # minutes, so this type-checks it instead. No other job passes
      # operator_e2e, and go vet applies no build tags of its own, so without
      # this step nothing here compiles test/operator at all. Needs no UI
      # bundle (internal/ui builds from embed_noui.go without the ui tag) and
      # no system packages.
      - name: Type-check build-tagged trees
        run: make vet-tagged
  helm-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.2
      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version 1.2.1 --verify=false
      - name: Lint chart
        run: make helm-chart-lint
      - name: Run chart unit tests
        run: make helm-chart-test
  build-image:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prefer IPv4
        uses: ./.github/actions/prefer-ipv4
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          tags: auroraboot:ci
          outputs: type=docker,dest=/tmp/auroraboot-image.tar
      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: auroraboot-image
          path: /tmp/auroraboot-image.tar
          retention-days: 1
  e2e-tests:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # docker/setup-qemu-action runs the binfmt container on the default bridge,
      # which the former self-hosted runners failed with "bridge port not forwarding after 200ms".
      # binfmt only writes to /proc/sys/fs/binfmt_misc, so give it the host
      # network and never create a bridge port. Same reason as the network=host
      # driver-opt on buildx below.
      # Pinned by digest: this step installs the emulators every cross-arch
      # build then depends on, so it must not change under us.
      # tonistiigi/binfmt:qemu-v9.2.2
      - name: Set up QEMU
        run: docker run --rm --privileged --network host docker.io/tonistiigi/binfmt@sha256:1b804311fe87047a4c96d38b4b3ef6f62fca8cd125265917a9e3dc3c996c39e6 --install all
      - name: Prefer IPv4
        uses: ./.github/actions/prefer-ipv4
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
      - name: Build local image
        uses: docker/build-push-action@v7
        with:
          push: false
          load: true
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          tags: auroraboot:test
      - name: Ensure loop device nodes
        # losetup asks the kernel for a free loop index and then opens
        # /dev/loopN. On the former shared kvm runners the loop pool leaked across
        # jobs: a previous run could leave the kernel index free while the
        # /dev/loopN node has been unlinked (LOOP_CTL_DEL, or a container
        # bind-mounting /dev). losetup then fails with
        # "device node /dev/loopN is lost. You may use mknod(1) to recover it."
        # Pre-create the nodes so any recycled index has a matching /dev entry.
        run: |
          sudo bash -c '
            for i in $(seq 0 15); do
              [ -e /dev/loop$i ] || mknod -m 660 /dev/loop$i b 7 $i
              chown root:disk /dev/loop$i 2>/dev/null || true
            done
          '
          ls -la /dev/loop*
      - name: Run e2e tests
        # /tmp is a RAM-backed tmpfs capped at half the memory on 26.04
        # runners, too small for the raw and GCE disks the specs stage there.
        # TMPDIR moves os.MkdirTemp onto the runner's disk.
        # EXTENSIONS_AGENT_IMAGE turns on the extensions agent-flow tier. The
        # `extension` phone-home command shipped in Kairos v4.4.0.
        env:
          TMPDIR: ${{ runner.temp }}
          EXTENSIONS_AGENT_IMAGE: quay.io/kairos/hadron:v0.6.3-core-amd64-generic-v4.4.0
        run: |
          go run github.com/onsi/ginkgo/v2/ginkgo -v -r -p --covermode=atomic --coverprofile=coverage.out --timeout=2h --label-filter "e2e" ./e2e
      - name: Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./coverage.out
  test-bootable-iso-uki:
    runs-on: ubuntu-26.04
    needs: build-image
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y ovmf libvirt-clients libvirt-daemon-system libvirt-daemon virtinst bridge-utils qemu-system-x86 qemu-utils acl udev swtpm libpcsclite-dev
      - name: Grant access to /dev/kvm
        run: |
          echo "KERNEL==\"kvm\", GROUP=\"$(id -gn)\", MODE=\"0660\", OPTIONS+=\"static_node=kvm\"" | sudo tee /etc/udev/rules.d/99-kvm-access.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          test -w /dev/kvm
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Prefer IPv4
        uses: ./.github/actions/prefer-ipv4
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
      - name: Download image artifact
        uses: actions/download-artifact@v8
        with:
          name: auroraboot-image
          path: /tmp/
      - name: Load image
        run: docker load -i /tmp/auroraboot-image.tar
      - name: Generate ISO
        run: |
          mkdir build
          docker run --rm --privileged \
          --network=host \
          -v $PWD/build/:/output \
          -v $PWD/e2e/assets/keys/:/keys \
          auroraboot:ci \
          --debug \
          build-uki \
          --output-dir /output \
          --public-keys /keys \
          --tpm-pcr-private-key /keys/tpm2-pcr-private.pem \
          --sb-key /keys/db.key \
          --sb-cert /keys/db.pem \
          --output-type iso \
          -x "console=ttyS0" \
          quay.io/kairos/ubuntu:24.04-core-amd64-generic-v3.7.2
      - name: Find OVMF firmware
        uses: ./.github/actions/find-ovmf-firmware
        id: find_ovmf
        with:
          prefer_secboot: true
      - name: Test UKI iso is bootable
        env:
          FIRMWARE: ${{ steps.find_ovmf.outputs.firmware }}
          KVM: true
          EFIVARS_EMPTY: true
          TMPDIR: ${{ runner.temp }}
        run: |
          export ISO=$(find $PWD/build -name *.iso)
          go run github.com/onsi/ginkgo/v2/ginkgo run --label-filter "bootable" -v --fail-fast -r ./e2e
  test-bootable-raw-efi:
    runs-on: ubuntu-26.04
    needs: build-image
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y ovmf libvirt-clients libvirt-daemon-system libvirt-daemon virtinst bridge-utils qemu-system-x86 qemu-utils acl udev libpcsclite-dev
      - name: Grant access to /dev/kvm
        run: |
          echo "KERNEL==\"kvm\", GROUP=\"$(id -gn)\", MODE=\"0660\", OPTIONS+=\"static_node=kvm\"" | sudo tee /etc/udev/rules.d/99-kvm-access.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          test -w /dev/kvm
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Prefer IPv4
        uses: ./.github/actions/prefer-ipv4
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
      - name: Download image artifact
        uses: actions/download-artifact@v8
        with:
          name: auroraboot-image
          path: /tmp/
      - name: Load image
        run: docker load -i /tmp/auroraboot-image.tar
      - name: Generate raw image
        run: |
          mkdir build
          docker run --rm --privileged \
          --network=host \
          -v $PWD/build/:/output \
          auroraboot:ci \
          --debug \
          --set "disable_http_server=true" --set "disable_netboot=true" --set "state_dir=/output" \
          --set "disk.efi=true" \
          --set "disk.size=16000" \
          --set "container_image=oci://quay.io/kairos/ubuntu:24.04-core-amd64-generic-v3.7.2"
      - name: Find OVMF firmware
        uses: ./.github/actions/find-ovmf-firmware
        id: find_ovmf
      - name: Test raw image is bootable
        env:
          KVM: true
          FIRMWARE: ${{ steps.find_ovmf.outputs.firmware }}
          EFIVARS_EMPTY: true
          TMPDIR: ${{ runner.temp }}
        run: |
          export RAW_IMAGE=$(find $PWD/build -name *.raw)
          go run github.com/onsi/ginkgo/v2/ginkgo run --label-filter "raw-bootable" -v --fail-fast -r ./e2e
  test-bootable-raw-efi-boot-active:
    runs-on: ubuntu-26.04
    needs: build-image
    strategy:
      fail-fast: false
      matrix:
        include:
          - layout: boot-active
            extra_args: --set disk.boot_active=true
            expect_passive: "true"
            no_recovery: "false"
          - layout: single-image
            extra_args: --set disk.boot_active=true --set disk.no_recovery=true --set disk.state_slots=1
            expect_passive: "false"
            no_recovery: "true"
    name: test-bootable-raw-efi-boot-active (${{ matrix.layout }})
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y ovmf libvirt-clients libvirt-daemon-system libvirt-daemon virtinst bridge-utils qemu-system-x86 qemu-utils acl udev libpcsclite-dev
      - name: Grant access to /dev/kvm
        run: |
          echo "KERNEL==\"kvm\", GROUP=\"$(id -gn)\", MODE=\"0660\", OPTIONS+=\"static_node=kvm\"" | sudo tee /etc/udev/rules.d/99-kvm-access.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          test -w /dev/kvm
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Prefer IPv4
        uses: ./.github/actions/prefer-ipv4
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
      - name: Download image artifact
        uses: actions/download-artifact@v8
        with:
          name: auroraboot-image
          path: /tmp/
      - name: Load image
        run: docker load -i /tmp/auroraboot-image.tar
      - name: Generate raw image
        run: |
          mkdir build
          docker run --rm --privileged \
          --network=host \
          -v $PWD/build/:/output \
          auroraboot:ci \
          --debug \
          --set "disable_http_server=true" --set "disable_netboot=true" --set "state_dir=/output" \
          --set "disk.efi=true" \
          ${{ matrix.extra_args }} \
          --set "disk.size=16000" \
          --set "container_image=oci://quay.io/kairos/ubuntu:24.04-core-amd64-generic-v3.7.2"
      - name: Find OVMF firmware
        uses: ./.github/actions/find-ovmf-firmware
        id: find_ovmf
      - name: Test raw image is bootable
        env:
          KVM: true
          FIRMWARE: ${{ steps.find_ovmf.outputs.firmware }}
          EFIVARS_EMPTY: true
          BOOT_ACTIVE: "true"
          EXPECT_PASSIVE: ${{ matrix.expect_passive }}
          NO_RECOVERY: ${{ matrix.no_recovery }}
        run: |
          export RAW_IMAGE=$(find $PWD/build -name *.raw)
          go run github.com/onsi/ginkgo/v2/ginkgo run --label-filter "raw-bootable" -v --fail-fast -r ./e2e
  test-bootable-raw-bios:
    runs-on: ubuntu-26.04
    needs: build-image
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y ovmf libvirt-clients libvirt-daemon-system libvirt-daemon virtinst bridge-utils qemu-system-x86 qemu-utils acl udev libpcsclite-dev
      - name: Grant access to /dev/kvm
        run: |
          echo "KERNEL==\"kvm\", GROUP=\"$(id -gn)\", MODE=\"0660\", OPTIONS+=\"static_node=kvm\"" | sudo tee /etc/udev/rules.d/99-kvm-access.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          test -w /dev/kvm
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Prefer IPv4
        uses: ./.github/actions/prefer-ipv4
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
      - name: Download image artifact
        uses: actions/download-artifact@v8
        with:
          name: auroraboot-image
          path: /tmp/
      - name: Load image
        run: docker load -i /tmp/auroraboot-image.tar
      - name: Generate raw image
        run: |
          mkdir build
          docker run --rm --privileged \
          --network=host \
          -v $PWD/build/:/output \
          auroraboot:ci \
          --debug \
          --set "disable_http_server=true" --set "disable_netboot=true" --set "state_dir=/output" \
          --set "disk.bios=true" \
          --set "disk.size=16000" \
          --set "container_image=oci://quay.io/kairos/ubuntu:24.04-core-amd64-generic-v3.7.2"
      - name: Test raw image is bootable
        env:
          KVM: true
          TMPDIR: ${{ runner.temp }}
        run: |
          export RAW_IMAGE=$(find $PWD/build -name *.raw)
          go run github.com/onsi/ginkgo/v2/ginkgo run --label-filter "raw-bootable" -v --fail-fast -r ./e2e
  test-ui-builder:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
     - name: Checkout code
       uses: actions/checkout@v7
       with:
         fetch-depth: 1
     - name: Set up Docker Buildx
       id: buildx
       uses: docker/setup-buildx-action@v4
       with:
         driver-opts: network=host
     - name: Download image artifact
       uses: actions/download-artifact@v8
       with:
         name: auroraboot-image
         path: /tmp/
     - name: Load image
       run: docker load -i /tmp/auroraboot-image.tar
     - name: Cypress run
       uses: cypress-io/github-action@v7.4.10
       with:
         working-directory: e2e/web/
         start: docker run --network=host --rm auroraboot:ci web
         wait-on: 'http://localhost:8080'
         wait-on-timeout: 60
     - name: Upload Cypress screenshots
       if: always()
       continue-on-error: true
       uses: actions/upload-artifact@v7
       with:
         name: cypress-screenshots
         path: e2e/web/cypress/screenshots/
  phonehome-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y ovmf libvirt-clients libvirt-daemon-system libvirt-daemon virtinst bridge-utils qemu-system-x86 qemu-utils acl udev swtpm libpcsclite-dev
      - name: Grant access to /dev/kvm
        run: |
          echo "KERNEL==\"kvm\", GROUP=\"$(id -gn)\", MODE=\"0660\", OPTIONS+=\"static_node=kvm\"" | sudo tee /etc/udev/rules.d/99-kvm-access.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          test -w /dev/kvm
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Prefer IPv4
        uses: ./.github/actions/prefer-ipv4
      - name: Find OVMF firmware
        uses: ./.github/actions/find-ovmf-firmware
        id: find_ovmf
        with:
          prefer_secboot: false
      - name: Run phonehome VM tier
        env:
          KVM: true
          FIRMWARE: ${{ steps.find_ovmf.outputs.firmware }}
          # /tmp is a RAM-backed tmpfs on these runners, too small for the
          # VM disks and built artifacts.
          TMPDIR: ${{ runner.temp }}
        run: |
          go run github.com/onsi/ginkgo/v2/ginkgo -v --label-filter phonehome-vm --timeout 100m --grace-period 10m ./e2e
      - name: Upload phonehome logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: phonehome-logs
          path: e2e/logs/phonehome
          if-no-files-found: ignore
          retention-days: 7
