
search --file --set=root /boot/kernel
set default="{{DEFAULT_ENTRY}}"
set timeout=10
set timeout_style=menu

set font=($root)/boot/${grub_cpu}/loader/grub2/fonts/unicode.pf2
if [ -f ${font} ];then
    loadfont ${font}
fi

# Get model.
# This file is the live config for both firmware paths: prepareBootArtifacts
# writes it to /boot/grub2/grub.cfg and GrubEfiCfg chainloads the same file. The
# two grub binaries do not carry the same modules, though: the EFI one has
# smbios, while the BIOS core image is the committed eltorito.img, whose module
# list (constants.go) has none, and an ISO ships no i386-pc module dir to
# autoload from. Calling it there printed "error: can't find command `smbios'."
# on every BIOS live boot. Thor is arm64 and boots via EFI, so gating the lookup
# on the platform loses nothing.
if [ "${grub_platform}" = "efi" ]; then
    smbios --type 4 --get-string 5 --set model
fi
# For Thor we need to set the ignored clk and pd, otherwise devices will die during boot
# The expansion must be quoted: unquoted, an empty model (smbios missing or the
# lookup failing) or a multi-word one (QEMU host CPU strings) splits into
# multiple test arguments and the comparison wrongly evaluates to true,
# leaking $thor_options into the cmdline.
if [ "${model}" = "Thor" ]; then
  echo "Thor device detected, setting ignored clocks and power domains and proper console output"
  set thor_options="pd_ignore_unused clk_ignore_unused console=ttyUTC0,115200 earlycon=tegra_utc,mmio32,0xc5a0000"
  # Entering a submenu opens a new grub variable context where non-exported
  # variables are not visible, so entries nested under a submenu would expand
  # $thor_options to nothing without this.
  export thor_options
fi

# Add nomodeset only on x86/amd64-class arches.
# The live console, nomodeset, and extended command line placeholders are replaced at build time.
#
# One install entry, not three. The installer is a dispatcher, not a terminal
# UI: `kairos-agent interactive-install` runs AutoInstall first, so a config
# carrying `install.auto: true` (bundled in the image, or from a datasource or
# `config_url`) installs with no prompt, and everything else gets the welcome
# page, which offers the TUI, the WebUI and a shell. Unattended, interactive
# and manual are therefore choices made by the config and by the welcome page,
# not by the menu, which is why the UKI path has shipped a single entry
# (`norole`) all along. This is that entry for the GRUB path.
menuentry "Kairos (install)" --id kairos-install --class os --unrestricted {
    echo Loading kernel...
    linux ($root)/boot/kernel cdroot root=live:CDLABEL=COS_LIVE rd.live.dir=/ rd.live.squashimg=rootfs.squashfs net.ifnames=1 {{LIVE_CONSOLE}} rd.cos.disable vga=795{{NOMODESET}} install-mode-interactive selinux=0 $thor_options rd.live.overlay.overlayfs{{EXTEND_CMDLINE}}
    echo Loading initrd...
    initrd ($root)/boot/initrd
}

menuentry "Kairos (boot local node from livecd)" --id kairos-boot-local --class os --unrestricted {
    echo Loading kernel...
    linux ($root)/boot/kernel cdroot root=live:CDLABEL=COS_LIVE rd.live.dir=/ rd.live.squashimg=rootfs.squashfs net.ifnames=1 {{LIVE_CONSOLE}} kairos.boot_live_mode vga=795{{NOMODESET}} selinux=0 $thor_options rd.live.overlay.overlayfs{{EXTEND_CMDLINE}}
    echo Loading initrd...
    initrd ($root)/boot/initrd
}

menuentry "Kairos (debug)" --id kairos-debug --class os --unrestricted {
    echo Loading kernel...
    linux ($root)/boot/kernel cdroot root=live:CDLABEL=COS_LIVE rd.live.dir=/ rd.live.squashimg=rootfs.squashfs net.ifnames=1 console=tty0 rd.debug rd.shell rd.cos.disable rd.immucore.debug vga=795{{NOMODESET}} selinux=0 $thor_options rd.live.overlay.overlayfs{{EXTEND_CMDLINE}}
    echo Loading initrd...
    initrd ($root)/boot/initrd
}

# The in-RAM workflow (kairos.ram) is only useful when a cloud config with at
# least one user reaches the system, and it writes a partition table to an
# empty disk on first boot (kairos.ram.create_partitions), so it hides behind
# a submenu that explains all that before booting. The warning is rendered as
# informational menu lines (no-op bodies) because that is the only way to keep
# text on screen that works on every grub: echo output is cleared when the
# menu redraws, and pausing needs the sleep/read modules, which are not
# guaranteed to be built into the EFI grub image taken from the rootfs.
# The last entry is the one that actually boots; ESC goes back.
submenu "Kairos (boot to RAM)" --class os --unrestricted {
    menuentry "'Boot to RAM' runs the OS entirely from memory, nothing is installed" --unrestricted { set _info=1 }
    menuentry "immucore mounts COS_OEM and COS_PERSISTENT from the system disk; on an" --unrestricted { set _info=1 }
    menuentry "empty disk it CREATES them, writing a new partition table on first boot" --unrestricted { set _info=1 }
    menuentry "The image ships with no users: unless a cloud config defining at least" --unrestricted { set _info=1 }
    menuentry "one user reaches the system, you will not be able to log in. Provide it" --unrestricted { set _info=1 }
    menuentry "via a config bundled in the image, a datasource (user-data on a cloud" --unrestricted { set _info=1 }
    menuentry "provider or attached cdrom/usb), or a remote config_url stanza" --unrestricted { set _info=1 }
    menuentry "" --unrestricted { set _info=1 }
    menuentry "Boot Kairos to RAM now" --class os --unrestricted {
        echo Loading kernel...
        linux ($root)/boot/kernel cdroot root=live:CDLABEL=COS_LIVE rd.live.dir=/ rd.live.squashimg=rootfs.squashfs net.ifnames=1 {{LIVE_CONSOLE}} kairos.ram kairos.ram.create_partitions vga=795{{NOMODESET}} selinux=0 $thor_options rd.live.overlay.overlayfs{{EXTEND_CMDLINE}}
        echo Loading initrd...
        initrd ($root)/boot/initrd
    }
}

if [ "${grub_platform}" = "efi" ]; then
    menuentry "Text mode" --hotkey "t" {
        set textmode=true
        terminal_output console
    }
fi
